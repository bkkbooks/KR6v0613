body:
  text: 第二章部派空義之開展一空義依聞思而開展佛說的一切法門是隨順於解脫的解脫的道是如實知無常苦空無我依厭離欲滅無所取著而得解脫解脫要依於慧般若修行如實觀慧而能離煩惱的主要的方便是空無所有無相空於貪瞋癡的也是無相無所有的究竟義所以在佛法的發揚中空更顯著的重要起來在聖道的修習中空無所有無相都重於觀慧的離惑但空與無相顯然有了所觀察的理性意義如無相本是不作意一切相不取一切相而有明大經說二緣入無相心解脫一切相不作意及作意無相界這樣要入無相心解脫或作無相心三昧的不但不作意一切相而且要作意於無相無相界是無相寂靜的涅槃涅槃的體性如何部派中是有諍論的但都表示那是衆苦寂滅而不可戲論的所以作意無相界涅槃是所觀想的境界義理或理性的空也是這樣無我無我所是空空是一切法遍通的義理也是所觀的又立出世空性以表示空寂的涅槃這樣空與無相不只是實踐的聖道三昧解脫也是所觀所思的法義了佛法重於修行修行是不能沒有定的但真能離煩惱得解脫的是如實智平等慧如實觀與定相應的慧學在次第修學過程中有四入流分預流支親近善士聽聞正法如理作意法隨法行佛的化導以語言的教授教誡為主所以弟子們要由聞思修的學程才能引發無漏智慧知法見法得預流果雜阿含經中每對愚癡凡夫說多聞或作有聞聖弟子見聖人知聖人法善順聖人法見善知識知善知識法善順善知識法親近善士經聞思修習才能引發無漏智所以對從佛而來的文句從事於聽聞思惟是慧學不可或缺的方便為了佛法的正確理解為了適應外界的問難而有所說明佛教界漸漸的注重於教法的聞思於是乎論阿毗達磨論毗陀羅出現了佛教初期的聞思教法雖重於事類的分別抉擇而空義也依聞思而發揚起來這是部派佛教的卓越成就部派佛教的文獻現存的以說一切有部赤銅鍱部為詳備其他也有多少傳述初期大乘論如大智度論瑜伽師地論也有可參考的部派佛教思想本來都是依經的但各部所誦本文句不完全相同相同的也解說不一致所以在空義的開闡中當然也有所不同事實上部派佛教在印度演進到一切法空的大乘時代二勝義空與大空說一切有部是特長於法義論究的部派說一切有部內有二大系重經的是持經譬喻者重論的是阿毗達磨論師後來阿毗達磨論師系成為說一切有部的正宗於是乎持經譬喻者演化為說經部有部與經部的法義對大乘佛教大乘論師的主流中觀與瑜伽二派思想上有密切的關聯漢譯雜阿含經是說一切有部的誦本與赤銅鍱部的相應部相當雜阿含經中有以空為名的二經是相應部所沒有的可以說是屬於部派的但也不只是有部的一第一義空經如雜阿含經卷一三大正二九二下說眼生時無有來處滅時無有去處如是眼不實而生生已盡滅有業報而無作者此陰滅已異陰相續除俗數法耳鼻舌身意亦如是說俗數法者謂此有故彼有此起故彼起純大苦聚集起又復此無故彼無此滅故彼滅純大苦聚滅比丘是名第一義空法經第一義空是勝義空的異譯趙宋施護的異譯本就名佛說勝義空經經中以眼等六處的生滅說明生死相續流轉中有業與報報新譯作異熟而作者是沒有的這是明確的法有我無說沒有作業者也沒有受報者作者受者都是自我的別名所以不能說有捨前五陰而續生後五陰的我不能說有作者我有的只是俗數法俗數法是什麼意義阿毗達磨順正理論引經說如世尊說有業有異熟作者不可得謂能捨此蘊及能續餘蘊唯除法假勝義空經說此中法假謂無明緣行廣說乃至生緣老死依玄奘所譯的順正理論可知俗數法是法假的異譯法假即法施設施設可譯為安立或假名法施設法假就是無明緣行等十二支的起滅鳩摩羅什所譯成實論譯此經文為諸法但假名字假名字者所謂無明因緣諸行瑜伽論解說法假為唯有諸法從衆緣生能生諸法勝義空經作別法合集因緣所生所以經義是唯有法假施設緣起的生死相續有業有異熟而沒有作業受報的我緣起法是假有我不可得是勝義空勝義空經的俗數法法假有第一義空雖不是明確的二諦說而意義與二諦說相合所以瑜伽論就明白的說但唯於彼因果法中依世俗諦假立作用法假施設是假名勝義空是空假與空都依緣起法說依緣起說法雜阿含經是稱之為離此二邊處於中道而說法的龍樹的中論說諸佛依二諦為衆生說法衆因緣生法我說即是空亦為是假名亦是中道義二諦與空假中義都隱約的從這勝義空經中啓發出來第一義空經的前分有關生滅的經義留在下一節與其他有關的經文一同解說二大空經如雜阿含經卷一二大正二八四下八五上說云何為大空法經所謂此有故彼有此起故彼起謂緣無明行緣行識乃至純大苦聚集緣生老死者若有問言彼誰老死老死屬誰彼則答言我即老死今老死屬我老死是我所言命即是身或言命異身異此則一義而說有種種若見言命即是身彼梵行者所無有若復見言命異身異梵行者所無有於此二邊心所不隨正向中道賢聖出世如實不顛倒正見謂緣生老死諸比丘若無明離欲而生明彼誰老死老死屬誰者老死則斷則知斷其根本如截多羅樹頭於未來世成不生法若比丘無明離欲而生明彼無明滅則行滅乃至純大苦聚滅是名大空法經大空經所說是否定老死等是我老死屬我的邪見與命即是身命異身異的二邊邪見相同而說十二緣起的中道正見命即是身我即老死以身為我命異身異老死屬我以身為我所命是一般信仰的生命自體也就是我別名身是身體肉體這裡引申為生死流轉十二支也可約五陰六處說的身心綜合體假如說我即老死生有等那是以身為自我命即是身了假如說老死屬於我那是以身為不是我命異身異了身是屬於我的我所有的所以命是我而身是我所這一則經文相應部因緣相應中也是有的但沒有大空經的名稱那麼有部所誦的雜阿含經特地稱之為大空經到底意義何在瑜伽論解說為一切無我無有差別總名為空謂補特伽羅無我及法無我補特伽羅無我者謂離一切緣生行外別有實我不可得故法無我者謂即一切緣生諸行性非實我是無常故如是二種略攝為一彼處說此名為大空依瑜伽論說補特伽羅無我與法無我總名為大空補特伽羅無我是命異身異的身外的實我不可得法無我是命即是身的即身的實我不可得這二種無我也可說是二種空所以總名為大空所說的法無我與一切法空說不同只是法不是實我還是法有我無說不過有的就解說大空為我法皆空了三無來無去之生滅如幻說一切有部說三世實有法性恆有似乎與大乘法空義背道而馳其實在說一切有思想的開展中對一切法空是大有影響的真可說是相破相成這裡再舉三經來說一勝義空經第一義空經說有業報而沒有作者上文已說過了怎樣說明有業有報呢雜阿含經卷一三大正二九二下這樣說眼等生時無有來處滅時無有去處如是眼等不實而生生已盡滅有業報而無作者眼等六處是依前業所生起的報體所以初生時是諸蘊顯現諸處獲得得陰得界得入處得命根是名為生為了說明依業招感報體沒有作者所以先說眼等報體的生滅情形這一段經文玄奘所譯阿毗達磨順正理論卷五一大正二九六二五下六二六中這樣說如勝義空經中說眼根生位無所從來眼根滅時無所造集本無今有有已還去有業有異熟作者不可得眼等根是從緣而生滅的生滅是無所從來無所造集的這是什麼意義呢佛法中在沒有生起以前可能生起有生起的可能那就與沒有不同所以說未來有當有眼等是生而又剎那滅去的雖已成為過去不可能再生但有生起後果的作用不可能說沒有所以說過去有曾有現在有是當前的生滅如眼根是色法是微細的色物質眼極微從因緣生名為從未來來現在說眼根未生起時在未來中但未來沒有空間性不能說從未來的某處來所以說無所從來現在的眼極微是依能造的地等四大極微等和集而住的剎那間滅入過去不能說沒有了成為過去的眼根不再是四大等極微和集而住所以說滅時無所造集無所造集瑜伽論解說為滅時都無所往積集而住有已散滅眼根等來無所從去無所至往所以說不實而生生已盡滅盡滅玄奘譯為有已散滅或有已還去散滅與還去都不是沒有這樣從緣生滅的眼根有三世可說而實是來無所從去無所至的說一切有部說三世實有說過去與未來是現在的類是同於現在的但在未來與過去中色法沒有極微的和集相心法也沒有心聚的了別用卻說過去與未來的法性與現在的沒有任何差異所以說三世實有法性恆住說一切有部的法性實有從現在有而推論到過去與未來過去與未來的實有有形而上有的傾向這才從現在的眼根生滅而得出生時無所從來滅時無所往至的結論來無所從去無所至以這樣的語句說明現有不正與大乘如幻如化的三世觀有某種共同嗎二撫掌喻經撫掌喻經從譬如兩手和合相對作聲的譬喻得名雜阿含經卷一一大正二七二下說比丘諸行如幻如炎剎那時頃盡朽不實來實去順正理論引此經說諸行如幻如焰暫時而住速還謝滅瑜伽論作了分別的解說又此諸行以於諸趣種種自體生起差別不成實故說如幻事想心見倒迷亂性故說如陽焰起盡法故說有增減剎那性故名曰暫時數數壞已速疾有餘頻頻續故說為速疾現前相續來無所從往無所至是故說為本無今有有已散滅撫掌喻經從剎那生滅來無所從去無所至說明諸行的虛僞不實與勝義空經的見解是完全一致的三幻網經十誦律所傳的多識多知諸大經中有摩那闍藍晉言化經摩那應該是摩耶的誤寫摩耶闍藍譯為幻網幻網與撫掌都是有部所誦的幻網經沒有漢譯阿毗達磨順正理論卷四引此經大正二九三五下說佛告多聞諸聖弟子汝等今者應如是學諸有過去未來現在眼所識色此中都無常性恆性廣說乃至無顛倒性出世聖諦皆是虛僞妄失之法成唯識寶生論也引述此經都無常性以下譯為無有常定無妄無異實事可得或如所有或無倒性悉皆非有唯除聖者出過世間斯成真實這是說一切世間法都是虛僞妄失法沒有常恆不異的實性可得幻網經也有如見幻事的譬喻與撫掌喻經相同以上三經是有部與經部所共誦的而解說不同有部以為三世法性是實有的為了遣除常恆我我所等妄執所以說虛妄如幻喻等經部解說為沒有實性並引用為無緣也可以生識的教證經文的本義也許近於有部但不可能是有部那樣的實有我外道雖有妄執離蘊計我的其實沙門婆羅門計有我一切皆於此五受陰計有我如五陰一一法是常是恆是不變易那一一法可說是我了但五陰等諸行無常無恆是變易所以實我是不可得的中阿含經想經說彼於一切有一切想一切即是神我的舊譯一切是神所神是一切所彼計一切即是神已便不知一切如於一切法而有所想著一切就是我我所所以通達無我要如實知一切行是無常變易虛僞妄失法不著於相想如實知諸行無常無恆等正是為了顯示我不可得然我所依所有的諸行從生無所從來去無所至虛僞不實如幻如焰去觀察那麼實我不可得諸行也非實有的思想很自然的發展起來有為法是虛僞不實的雜阿含經早已明確的說到了如五陰譬喻色如聚沫受如水泡想如野馬陽焰的異譯行如芭蕉識如幻事所譬喻的五陰經上說諦觀思惟分別無所有無牢無實無有堅固如病如癰如刺如殺無常苦空非我相應部也說無所有無實無堅固五譬喻中聚沫喻水泡喻都表示無常不堅固芭蕉喻是外實而中虛的幻事喻是見也見到聽也聽到卻沒有那樣的實事野馬喻如大智度論說炎以日光風動塵故曠野中見如野馬無智人初見謂之為水野馬是迅速流動的氣這一譬喻的實際是春天暖了日光風動下的水汽上升遠遠的望去只見波浪掀騰渴鹿會奔過去喝水的所以或譯為鹿愛遠望所見的波光蕩漾與日光有關所以譯為炎焰陽焰遠望所見的大水過去卻什麼也沒有見到陽焰所表示的無所有無實很可能會被解說為虛妄無實空的還有琴音的譬喻如雜阿含經卷四三大正二三一二下說有王聞未曾有好彈琴聲極生愛樂王語大臣我不用琴取其先聞可愛樂聲來大臣答言如此之琴有衆多種具謂有柄有槽有麗有絃有皮巧方便人彈之得衆具因緣乃成音聲前所聞聲久已過去轉亦盡滅不可持來爾時大王作是念言咄何用此虛僞物為琴是虛僞的琴音是從衆緣生剎那滅去的依此譬喻可見一切為有為法都是虛僞不實的虛妄劫奪法者謂一切有為有為是虛妄的虛僞的由於剎那生滅的探求得出生時無所從來滅時往無所去不來不去的生滅說這無疑為引發一切法空說的有力因素四聲聞學派之我法二空說聲聞部派中有說一切法空的由於文獻不充分不明瞭究竟是那些部派但說法空的部派確實是存在的如龍樹大智度論說到三種法門一者蜫勒門二者阿毗曇門三者空門三種法門中的空門有的屬於聲聞引聲聞三經來說明又於說一切法空時引六或七經明三藏中處處說法空智論又說若不得般若波羅蜜法入阿毗曇門則墮有中若入空門則墮無中若入蜫勒門則墮有無中這可見廣引聲聞經而說一切法空的不是龍樹自己而是聲聞的部派以下依智論所引的經說可以了解空門是怎樣解說法空的一大空經上文已說到了說一切有部的見解漢譯雜阿含經說若有問言彼誰老死老死屬誰彼則答言我即老死今老死屬我老死是我所並與命即是身命異身異相配合依空門的見解這是說法空的如大智度論說聲聞法中法空為大空是人老死人不可得則衆生空是老死老死不可得是法空若說誰老死當知是虛妄是名生空若說是老死當知是虛妄是名法空生空衆生空法空空門是成立二空的經說今老死屬我老死是我所是邪見虛妄的因而說是老死是法空這是以無我為我空無我所是法空的與成實論所說若遮某老死則破假名遮此老死則破五陰破五陰即法空的意見相合二梵網經如大智度論卷一八大正二五一九三上說梵網經中六十二見若有人言神常世間亦常是為邪見若言神無常世間無常是亦邪見神及世間常亦無常神及世間非常亦非非常皆是邪見以是故知諸法皆空是為實梵網經是長阿含經的一經經說六十二見是綜舉印度當時外道們的異見內容為過去十八見未來四十四見論文所引神及世間常無常等是六十二見的前四見常無常等四見在雜阿含經中是十四不可記的前四見本來只是世間常無常等而梵網經作神及世間常無常等神是我的古譯世間雜阿含經約六根六境六識六觸六受說是衆生的身心活動長阿含經分別為神我與世間那是我與法對舉也可說以衆生自體與山河大地相對論也就是一般所說的衆生世間與器世間了智論依空門以神我及世間常無常等邪見解說為諸法皆空是為如實依經文並沒有法空說的明文這經過怎樣的理解而論定是空呢神我是不可得的所以說我是常是無常等都是邪見但佛處處說有為法無常苦空無我令人得道云何梵網經言世間無常墮邪見在佛的不同教說中似乎存有矛盾大智度論引經而加以解說如卷一八大正二五一九三上中說佛告摩訶男若人身壞死時善心意識長夜以信戒聞施慧熏心故必得利益上生天上以上引經以下解說若一切法念念生滅無常佛云何言諸功德熏心故必得上生以是故知非無常性佛隨衆生所應而說法破常顛倒故說無常以人不知不信後世故說心去後世上生天上罪福業因緣百千萬劫不失是對治悉檀非第一義悉檀諸法實相非常非無常佛亦處處說諸法空諸法空中亦無無常以是故說世間無常是邪見是故名為法空佛說無常使人得道這是原始佛教的事實諸行無常的無常原語為無常性是佛不但說無常也說無恆變易不安隱等瑜伽論依經說於諸行中修無常想行有五種謂由無常性無恆性非久住性不可保性變壞法性佛說無常等不是論究義理而是指明事實如四非常偈說積聚財富皆銷散崇高名位權勢必墮落親友合會要當離有生無不死這是要人對這現實世間天國也在內不可迷戀於不徹底的終究要消失的福樂起厭離心而向於解脫然而一切凡夫都是寄望於永恆而戀著這世間的所以雜阿含經卷一二大正二八一下說愚癡無聞凡夫於四大身厭患離欲背捨而非識愚癡無聞凡夫寧於四大身繫我我所不可於識繫我我所所以者何四大色身我見十年住二十三十乃至百年若善消息或復小過彼心意識日夜時刻須臾轉變異生異滅愚癡無聞的一般人對於四大色身肉體有的還能生厭離心而對於心識卻不能厭離固執的執我我所依佛的意思對於四大色身執我我所而不能厭離多少還可以原諒因為我們的色身有的活了十年二十年有的能活到一百歲如將護調養得好有的還少少超過了一百歲有這樣的長期安定所以不免迷戀而執著我們的心意識是時刻不停的在變異前滅的不同於後起的所以說異生異滅這樣的剎那生滅變異而衆生卻固執的執為我我所如一般所說的靈魂玄學與神學家稱之為真心真我這都以為在無常變化中有生命的主體不變從前生到今生從今生到後世佛針對世俗的妄執對生死流轉中的一切宣說諸行無常無常是要人不迷戀於短暫的福樂而向於究竟的解脫這是被稱為如實知與正見的說到世間常與無常是邪見無常的原語是雖同樣的譯為無常但與諸行無常不同邪見的世間無常是以為有情世間是一死了事沒有生死流轉是斷滅論者順世的唯物論者的見解在佛陀時代的印度順世派是少數諸行無常是正見世間無常是邪見在原始佛教裡應該是沒有矛盾的正見的諸行無常邪見的世間無常是沒有矛盾的但在佛法法義的論究中兩種無常有點相同那為什麼一正一邪呢世間無常是前滅而以後沒有了犯了中斷的過失諸行無常是有為生滅的如經上所說心是時刻不住的生滅前前與後後不同論究起來即使是最短的時間剎那也是有生滅的這就是念念生滅無常四大色身不是十年二十年百年沒有變異的也是年異月異日異即使一剎那間也是生滅無常的這樣的剎那生滅前剎那沒有滅後剎那是不能生起的如前剎那已滅已經滅了也就不能生起後剎那如所作的善惡業也是剎那滅的業滅而成為過去又怎能招感未來也許是百千萬億劫以後的善惡報呢因果相續的諸行無常由於剎那生滅前滅後生的難以成立就與世間無常的中斷一樣那為什麼一正一邪呢為了剎那生滅而又要成立前後相續說一切有部依三世有說法性恆有滅入過去而還是存在有的所以能前後相續而起經部依現在有說滅入過去是成為熏習而保存於現在所以能前後續生但部派的意見不一不是大家所能完全同意的說法空的部派以為佛處處說無常處處說不滅不滅就是常佛隨衆生所應而說法說諸行無常為了破常顛倒一切法非實性無常不能說是滅而就沒有了說心去後世上生天上等為了破斷滅見並非說心是前後一如的這都是隨順世俗的方便如論究到諸法實相實相是實性的異譯是非常非無常的空性也是非常非無常的是超越常無常等一切戲論執見的所以佛說十四事不可記不能肯定的說是什麼所以佛不豫答覆六十二見是邪見正表示了一切法空的正見三義品如大智度論卷一八大正二五一九三中下說佛說義品偈各各謂究竟而各自愛著各自是非彼是皆非究竟是人入論衆辨明義理時各各相是非勝負懷憂喜勝者墮憍坑負者墮憂獄是故有智者不隨此二法論力汝當知我諸弟子法無虛亦無實汝欲何所求汝欲壞我論終已無此處一切智難勝適足自毀壞如是等處處聲聞經中說諸法空義品一六經巴利藏編入小部的經集與義品相當的有吳支謙所譯的佛說義足經二卷一六品法藏部稱此為十六句義或句義經句是的義譯有足跡的意義所以譯為義足經的可能是法藏部的誦本大智度論一再引用義品如上明法空所引的五偈外又明第一義悉檀引衆義經三偈明無諍法引阿他婆耆經阿他婆耆是義品的音譯三偈引利衆經利衆即衆利利是義利的利明不取著一切法法空引佛說利衆經二偈明如實知名色瑜伽師地論也引義品明一切法離言法性義品的成立很早雜阿含經弟子記說已經解說到了從大智度論與瑜伽論的引用可見義品對大乘法性空寂離言的思想是有重要影響的上文所引的五偈是論力義足經作勇辭勇辭是論力的異譯經集義品作波須羅梵志舉外道的種種見想與佛論諍誰是究竟的佛告訴他人都是愛著自己的見解以自己的見解為真理自是非他的互相論諍結果是勝利者長憍慢心失敗者心生憂惱這意味著真理是不能在思辨論諍中得來的引向法性離言空寂的自證說法空的聲聞學派引了大空經梵網經義品三經並說處處聲聞經中說諸法空大智度論在說一切法空後又簡略的引述了聲聞藏的六或七經如論卷三一大正二五二九五中下說有利根梵志求諸法實相不厭老病死著種種法相為是故說法空所謂先尼梵志不說五衆即是實亦不說離五衆是實復有強論梵志佛答我法中不受有無汝何所論有無是戲論法結使生處及雜阿含中大空經說二種空衆生空法空羅陀經中說色衆破裂分散令無所有筏喻經中說法尚應捨何況非法波羅延經利衆經中說智者於一切法不受不著若受著法則生戲論若無所依止則無所論諸得道聖人於諸法無取無捨若無取捨能離一切諸見如是等三藏中處處說法空六經中第一先尼梵志事見雜阿含經巴利藏缺佛與仙尼的問答是色等五陰是如來異離色是如來色中有如來如來中有色如來是我的異名如如不動而來去生死的如來不即色不離色如來不在色中色不在如來中這就是一般所說的非是我異我不相在論文所說不說五衆五陰即是實亦不說離五衆是實實就是如來無實即無如來我這是二十句我我所見而法空說者依四句不可說是如來解說為法空先尼梵志經可能是法空派所誦本文句略有出入般若經的原始部分曾引先尼梵志的因信得入一切智是繼承聲聞法空派的解說集入般若經為例證的第二強論梵志如上面義品所說的強論就是論力義足經是譯為勇辭的第三大空經已在上文說過第四羅陀經見雜阿含經如說於色境界當散壞消滅於受想行識境界當散壞消滅斷除愛欲愛盡則苦盡五陰的散壞消滅或依此立散空第五筏喻經見中阿含經的阿梨吒經法尚應捨何況非法的經意是佛說的一切法九分或十二分教善巧了解目的是為了解脫所以聞思法義對解脫是有用的是有必要的但為了解脫就不應取著諍論文義因為一有取著就不得解脫如一般所說渡河須用筏到岸不用船從此可見如來說法只是適應衆生說法引導衆生出離而不是說些見解要人堅固取著的無邊法門都不過適應衆生的方便法善的正的尚應捨何況惡的邪的非法表示了一切法空第六波羅延經是經集的彼岸道品利衆經是經集的義品長行略引二經的經意明智者於一切法不受不著不取不捨與義品的第一八偈相當聲聞的法空學派引聲聞經以說法空的主要的理由是一無我所二五陰法散滅三不落二邊四句的見解四佛法是非諍論處五智者不取著一切法法空的學派與阿毗曇門的辨析事相是不同的這是著眼於佛法的理想方便引導趣入修證的立場五常空我我所空雜阿含經卷一一撫掌喻經大正二七二下說空諸行常恆住不變易法空無我我所空諸行經約根境識觸受想思說與此意義相同的是空世間如說云何名為世間空佛告三彌離提眼等空常恆不變易法空我我所空所以者何此性自爾相應部也有此經約根境識觸受說世間只說我我所空故名空世間空是以無我我所為主的雜阿含經為什麼說常恆不變易法空呢雜阿含經與相應部常見這樣的文句如說無常即苦苦即非我非我者亦非我所又常見這樣的問答如說於意云何色受想行識為常為無常耶答言無常又問若無常者是苦耶樂耶答言是苦又問若無常苦者是變易法聖弟子寧於中見色受想行識是我異我相在不答曰不也五陰六處等無我我所是從無常苦變易法而得到定論的如依文釋義無常苦變易法無我我所空文字不同意義當然也有所差別如依文義相成來說那無常等都可說是空了無常故苦苦是依無常而成立的如雜阿含經卷一七大正二一二一上說佛告比丘我以一切行無常故一切諸行變易法故說諸所有受悉皆是苦一般的說受有三類苦受樂受不苦不樂受約三受說不能說諸所有受悉皆是苦的然從深一層說一切行是無常變易法是不可保信的不安隱的終於要消失過去的所以說諸所有受悉皆是苦一般所執的自我一定是常恆不變易是樂自在而一切行非常非樂這那裡可說有我呢無常是苦義無常苦變易法是無我義無常苦無我是相成的這樣的論究不但我我所是空常恆不變易法也可說是空了這樣的解說不只是說一切有部這樣說屬於分別說系的舍利弗阿毗曇論也說以何義空以我空我所亦空常空不變易空巴利藏小部的無礙解道也說我我所常堅固恆不變易法空這可見依我我所空進而說常恆不變易法空是上座部系的一致意見印度文化中的我曾發展到與宇宙的本體梵無二無別然原本只是衆生的自我我一定要有自在樂的屬性如不自在苦那就不能說是我了如雜阿含經卷二大正二七中下說若色受想行識下例是我者不應於色病苦生亦不應於色欲令如是不令如是以色無我故於色有病有苦生亦得於色欲令如是不令如是經說無常故苦無常苦故無我是一貫的相依相成的為什麼經上只說無我我所常恆不變易法空而沒有說是苦是空呢佛教界的論究傾向於客觀事相的觀察觀一切法不限於衆生自體都是無我空的但不能說器世界是無常故苦苦故無我只能說是無常無我空傾向於客觀的事相觀察阿毗達磨的特性如此所以說無我我所常恆不變易法空了六三三摩地空無所有無相是方便不同而究竟一致的究竟一致的就是空後來演化為三三昧空無願無相又名三解脫門這已在前一章說明了在三三昧中顯然空是更重要的如雜阿含經說若得空已能起無相無所有離慢知見者斯有是處這是說真正的無所有或無願無相要先得空住才有修得的可能阿毗達磨大毗婆沙論卷一四大正二七五四中下說空三摩地是諸內道不共住處外道法中雖無真實無願無相而有相似謂麁行相等相似無願靜行相等相似無相九十六種外道法中尚無相似空定況有真實故唯說空定是內道不共法空定定即三摩地三昧的義譯是內道不共法也就是說佛法與一般宗教的根本差別所在就是空三昧的確佛法的最大特色是無常苦故無我空三三昧空無願無相說一切有部以三緣來建立他的差別空是約對治說的空三摩地是有身見近對治故無願是約期心說的諸修行者期心不願三有法故期心不願三有聖道依有故亦不願無相是約所緣說的此定所緣離十相故謂離色聲香味觸及女男三有為生住異滅相也有依行相差別建立的說一切有部立四諦十六行相空三摩地有空非我二行相無願三摩地有苦非常及集諦下四因集緣生道諦下四道如行出各四行相無相三摩地有滅諦下滅靜妙離四行相這是約能為四諦下煩惱對治的無漏智說如約有漏智所緣行相說那空與無我二行相是通於四諦一切法的不但有漏的苦與集是空的無我的無漏有為的聖道無漏無為的滅也是空的無我的含義雖與大乘不同而可以說一切法空的空是通於無我無我所的如經說世間空是我我所空故名空世間空諸行是無我我所這可見無我是空無我所也是空但說一切有部以為空就是無我我所只是說明上有些不同如阿毗達磨大毗婆沙論卷九大正二七四五上中說有說謂空行相義不決定以一切法有義故空約他性故有義故不空約自性故非我行相無不決定以約自他俱無我故由此尊者世友說言我不定說諸法皆空定說一切法皆無我這是說一切有部的正義說一切法無我是確定的徹底的因為不論什麼法即法異法都非是我所以一切法決定是無我的說諸法皆