涅槃除了卷一如上所引說到一切行空寂外一律都譯作捨涅槃在阿含經中是以煩惱的滅盡蘊處身心滅而不再生起來表示的如火滅一樣但以否定遮遣方式來表示並不等於沒有表示超越一切的不可思議性可以有三例一如雜阿含經卷三四大正二二四四下說甚深廣大無量無數皆悉寂滅瑜伽論解說為世尊依此密意說言甚深廣大無量無數是謂寂滅由於此中所具功德難了知故名為甚深極寬博故名為廣大無窮盡故名為無量數不能數無二說故名為無數這是以大海的難以測度來比喻的這一喻說在超越中意味著不可思議的內容可能引起不同的解說二如雜阿含經卷三四大正二二四五下說滅寂靜清涼真實瑜伽論解說此經分別為寂滅寂靜清涼宴默真實更意味著充實的內含三如雜阿含經卷九大正二六上說盡離欲滅息沒已有亦不應說無亦不應說有無亦不應說非有非無亦不應說離諸虛僞得般涅槃末二句與此相當的增支部作戲論滅戲論寂雜阿含經的虛僞是戲論的異譯涅槃是不能是有或是無的這些相對的語句都不過是戲論戲論是不足以表示涅槃的雜阿含經漸傾向於涅槃的真實性所以說一切有部以為實有涅槃一切法中唯有涅槃是善是常赤銅鍱部說涅槃空當然也不會說涅槃是沒有著重於涅槃空的說明於是乎諸行空性涅槃空性可說有二種空性了如小部論事南傳五八三六五注說有二空性蘊無我相與涅槃此中無我相一分或方便說繫屬行蘊但涅槃則無所繫屬從聖典的施設名言來說有為諸行本性空所以離有為諸行煩惱業煩惱業所感的報體的涅槃也說為空直從涅槃說一切語言都是戲論空也是不可說的但從諸行空空卻諸行而可名為涅槃當然雖不可說而也可說是空是滅是出離等了依諸行滅而施設涅槃諸行空性與涅槃空性果真是條然不同的二種空性嗎九二諦與一切法空無我空有二方面諸行空那是無我我所的意思進而說明為常空恆空不變易法空無我我所另一方面是一切煩惱空空的是煩惱業苦也就以空來表示離煩惱業苦的涅槃寂出離止滅滅等也都表示是空的有出世空性的名稱這二方面勝義空明顯的表示了這一意義在雜阿含經中是緣起生死相續中有業報而沒有作者我的異名緣起因果是俗數法法假無我是勝義依諸行無我而說勝義空性是說一切有部系所說在無礙解道中勝義空是一切煩惱永滅六處永滅涅槃是勝義依涅槃的寂滅而說勝義空是赤銅鍱部所說勝義空也許不載於原始聖典而在佛法的流傳發揚中受到部派的重視是一項明顯的事實俗數法與勝義佛教界安立為二諦世俗諦勝義諦依四諦而明二諦的安立大毗婆沙論列舉了四家的二諦說第一家以苦集二諦為世俗滅道二諦為勝義這是世間虛妄出世間真實的二諦說與說出世部相近第二家以前三諦為世俗道諦為勝義第三家以為四諦皆是世俗諦攝唯一切法空非我理是勝義諦空非我中諸世俗事絶施設故第四家是有部的評家正義四諦皆有世俗勝義苦諦中有勝義諦者謂苦非常空非我理集諦中有勝義諦者謂因集生緣理滅諦中有勝義諦者謂滅靜妙離理道諦中有勝義諦者謂道如行出理後二家都是以世俗事的施設為世俗諦而勝義諦是絶施設不可安立的後二家可說是同一意義的不同開展對於空性為勝義空的思想是有重要關係的這應該從自相共相說起如阿毗達磨大毗婆沙論卷四二大正二七二一七上說分別一物相者是分別自相分別多物相者是分別共相自相是一法物所有的共相是通於多法的例如色是自相色法的無常性是通於心心所等的所以無常是共相進一步說色是一蘊的總名通於種種色的在色蘊中有眼耳等法即以眼所見的色來說也有青黃赤白等多法所以色也還是通於多法的這樣的推求下去一直到不可再分析的一一極微自性才是色的自相所以大毗婆沙論說諸法自性即是諸法自相同類性是共相自性是一一法的自體在有部中與自相是相同的但自相依相立名自性是以相而知法自體的共相是通於多法的也就是遍通的理性一般人雖說能知事相而實不能知一一法不知一一法的共相如實知四諦共相的能見道而向解脫所以後代就以四諦的十六行相為共相有部的評家正義就這樣的論定四諦事相是世俗諦四諦一一諦四行相的十六行相是勝義諦共相近於一般所說的通遍理性但有部不許四諦以外別有抽象的通遍理性十六行相只是四諦一一法上所有共通的義理對於世俗與勝義的覺了大毗婆沙論列舉了多種譬喻試引述二喻如論卷四二大正二七二一七上說如種種物近帝青寶自相不現皆同彼色分別共相慧應知亦爾如種種物遠帝青寶青黃等色各別顯現分別自相慧應知亦爾如日出時光明遍照衆暗頓遣分別共相慧應知亦爾如日出已漸照衆物牆壁竅隙山巖幽藪皆悉顯現分別自相慧應知亦爾通達共相慧的帝青寶喻與般若經所說般若照見一切法空如高入須彌咸同金色正是勝義慧的同一譬喻有部是事理二諦說四諦事是世俗四諦所有的共相理是勝義四諦各有四行相集滅道諦的四行相是局限於集滅道諦的苦諦下的四行相可不同了苦諦的四行相苦行相是限於苦諦的無常行相可通於苦集道三諦空與無我行相是通於四諦及非擇滅與虛空的所以空與無我是一切法中最通遍的共相理以理為勝義諦那麼空無我理可說是一切法的勝義諦理了由於有部是次第見四諦的所以說無漏慧所通達的空無我行相唯是苦諦假如是主張一時見四諦的就不會有這一區別了第三家以為一切是世俗施設唯一切法空非我理是勝義諦空非我中諸世俗事絶施設故這也是理事二諦但以一切法中最通遍的義理空非我理是勝義諦這可能與一說部的見解相近世俗唯是假名施設空非我理是勝義世俗假而勝義空非我是近似大乘空義的一派有部的無常苦空無我赤銅鍱部作無常苦無我無我是空義空無我遍通一切法也是赤銅鍱部所說的無礙解道有四諦論引經說四諦是如不虛不異諦是不倒亂而確實如此的所以諦是如如是不異的意義正如佛垂般涅槃略說教誡經所說月可令熱日可令冷佛說四諦不可令異無礙解道說到四諦同一通達也就是一時見諦為什麼四諦能同一通達因為四諦是同一所攝同一所攝則一性一性則依一智通達故四諦同一通達那麼四諦依什麼而是同一所攝呢論依四行相九行相十二行相來說明四行相是如義無我義諦義通達義每一諦都是如義無我義諦義通達義四諦同有這四行相所以說四諦是同一所攝九行相與十二行相的前四相就是如義無我義諦義通達義這些義相四諦都是有的所以是同一所攝同一通達如義與諦義間有無我義四諦同有無我可見空無我是通於四諦的與有部所說相同以空無我為遍通四諦的勝義是從諸行空而延展到一切空無我的這是上座部系著重我我所空而發揚起來的十大衆部系與法空一切煩惱空生死不再生以涅槃為勝義空無礙解道已說到了但著重涅槃空而發揚起來最足以代表聲聞法空說的是龍樹所說的空門法空說的主要理由上文曾歸納為五項除無我所為法空外都與涅槃空有關五陰散滅是行者滅五陰愛盡苦盡而作苦邊際不落四句涅槃正是不能以四句有無亦有亦無非有非無來說明的非諍論處這是言說所不及超越於名言的智者不取著一切正由於涅槃智的自證法空說是從涅槃空或佛證境來觀一切法的一切法空所以修行者隨順趣向臨入於無對絶對的的涅槃在現存的部派傳說中與法空有關的資料不多姑舉四說一如佛性論卷一大正三一七八七下說小乘諸部解執不同若依分別部說一切凡聖衆生並以空為其本所以凡聖衆生皆從空出故空是佛性佛性者即大涅槃佛性論是真諦所譯的以真諦所譯的部執異論及四諦論所用的譯名推定分別部即分別說部為唐譯說假部的異譯分別部說滅有三種一念念滅二相違滅三無餘滅譬如燈滅涅槃是無餘滅約煩惱等滅盡無餘說滅是空的異名依佛性論分別部說一切凡聖衆生以空為其本此空顯然有了形而上的本體意義凡聖衆生或迷而流轉或悟而解脫所有凡聖迷悟的一切現象都是依空而有的空是本來如此本性空的為成佛的因性所以空就是佛性離一切迷妄而成佛空就是大涅槃以空為佛性大涅槃我想這是真諦的時代分別部適應大乘學而作的說明吧佛法原本是依現實的身心世間修道斷惑而得涅槃的現在說空為一切所依那是通過涅槃空義再從涅槃常寂來說明一切的或稱為卻來門二如大智度論卷一大正二五六一上中說佛法中方廣道人言一切法不生不滅空無所有譬如兔角龜毛常無小部的論事中有方廣部也名說大空的部執雖然所說的問題與智度論不同然方廣部與方廣道人一切法空無所有與說大空顯然是同一的方廣部以為僧伽四雙八輩約勝義僧說勝義僧是無漏道果所以僧伽是不受供施的供物是無所淨的不受用飲食的施僧也就不得大果佛住兜率天宮人世間佛是示現的化身所以施佛不得大果佛不住此世間佛不說法論事所說的方廣部執勝義僧與佛都是超越現實人間世的凡重於超越的每不免輕忽了現實方廣道人說一切法空無所有如龜毛兔角一樣不正是同一意境的表現嗎三如入中論卷二漢藏教理院刊本三一說若世間導師不順世間轉佛及佛法性誰亦不能知雖許蘊處界同屬一體性然說有三界是順世間轉無名諸法性以不思議名為諸有情說是順世間轉由入佛本性無事此亦無然佛說無事是順世間轉不見義無義然說法中尊說滅及勝義是順世間轉不滅亦不生與法界平等然說有燒劫是順世間轉雖於三世中不得有情性然說有情界是順世間轉這是東山住部的隨順頌東山住部是大衆部系中安達派的一派所說蘊處界同一體性無名諸法性不滅不生在如來如實證佛本性中一切是同一的離言法性沒有如世俗所見的我與法有與無連佛滅勝義這也都是無可說的佛為衆生說有這有那不過順世間轉隨順世間方便罷了從如來自證的同一離言法性說法性是超越於世間名言的頌文雖沒有說空然與大乘法空性說是非常一致的四三論玄義檢幽集卷五大正七四五九中下說一說部者真諦云此部執世出世法悉是假名故言一切法無有實體同是一名名即是說故言一說部這是梁真諦傳來的解說一說部說世出世法悉是假名世間法是苦諦與集諦出世間法是滅諦與道諦四諦都是假名了假名一般是施設的異譯同是一名正是唯名的意思一說部的教義我們所知有限但這是大論師所傳來的窺基的異部宗輪論述記也這樣說賢首所判十宗的諸法但名宗也指一說部一說部的思想如是真諦所說那樣的但名無實那與原始般若的思想相合上來所引的四則說分別部方廣部東山住部一說部凡與法空說相近的都是大衆部系統的學派這是不能不重視的歷史事實上座部系中見滅得道的學派如法藏達摩毱多部以無相三摩地於涅槃起寂靜作意入正性離生赤銅鍱部說智見清淨也就是聖道現前是無相不起離滅以涅槃所緣而入的這樣的見滅得道滅諦可說是涅槃空寂然對於苦集道三諦沒有說是空的所以法空說是淵源於大衆學系而發揚起來當然上座部系的論究法義也有多方面啓發性的大衆部系的特色是佛與聲聞果的距離越來越遠了從佛身無漏開始佛與菩薩的聖德發展到如異部宗輪論介紹那樣重視佛德佛法性佛自住涅槃也就有了超越世間及聲聞四諦的傾向於是乎一切法但名無實但是順世間轉一切法不生不滅如龜毛兔角常無等從不同方面流傳出來了再引一論一經以證明法空說與大衆部的關係一成實論論是訶梨跋摩所造的為西元三四世紀間的論師論師出身於說一切有部而不滿說一切有部是一位從說一切有部脫出的早期的譬喻者思想與鳩摩羅陀相近出三藏記集卷一一訶梨跋摩傳大正五五七九上說時有僧祇部僧住巴連弗邑並遵奉大乘云是五部之本久聞跋摩才超群彥為衆師所忌相與慨然要以同止遂得研心方等鋭意九部採訪微言搜簡幽旨僧祇部是大衆部大衆部的僧衆是不拒斥大乘的訶梨跋摩與大衆部的僧衆共住也就接觸了大乘方等經因而思想上有了突破超過了有部經部一切上座學系的傳承成實論是見滅得道的分為三個層次先以法有滅假名心次觀涅槃空而滅法心末後是空心也滅了才是證入滅諦滅諦非實有的見解仍與經部說相同但成實論以為觀涅槃空而不見五陰但見陰滅名見五陰空見滅而一切法不起解說為法空與法藏部赤銅鍱部等見滅得道的解說不同這就是受了大衆部系的影響成實論引經以明法空的還是阿含經文全論以四諦開章不失聲聞學派的立場二增一阿含經漢譯本是苻秦曇摩難提所譯的經初有序可知是大衆部的誦本有些與大衆部本義不合而內容已接觸到大乘所以推定為屬於大衆部末派的誦本集成的時代稍遲所以引經來證明空義上面很少引用他但大衆部末派到底可以代表聲聞部派的一流須菩提見佛的故事傳說為義足品經的事緣之一增一阿含經三六聽法品大正二七七下七八上說若欲禮佛者過去及當來現在及諸佛當計於無我無常空例此善業以先禮最初無過者空無解脫門此是禮佛義若欲禮佛者當來及過去當觀空無法此名禮佛義善業是須菩提的義譯禮佛見佛應觀三世佛的無我無常空觀一切法空無所有佛之所以為佛是由於證得法性空寂也就是佛的法身所以應這樣的禮佛見佛智度論說須菩提觀諸法空是為見佛法身與增一阿含經意相符經上說法法自生法法自滅法法相動法法自息法法相亂法法自息法能生法法能滅法一切所有皆歸於空因果生滅可從二方面說一方面一切法是相動相亂的沒有他法的緣力自己是不會生滅動亂的從另一方面說法法各住自位不能互相動亂的一切法相互依存又各住自位從這緣起生滅中一切所有皆歸於空這是很深徹的觀察增一阿含經三須陀品大正二六五九中說有字者是生死結無字者是涅槃也有字者有生有死有終有始無字者無生無死無終無始名字是生死法始終法就是世間法超越名字的是無對的涅槃這是從涅槃空而世間但有假名的說法經中表示法空的是到處可見的從這一論一經的引述足以證明與大衆部系有關的都表示出我與法皆空的思想
