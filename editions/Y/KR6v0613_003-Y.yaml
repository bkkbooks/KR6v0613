body:
  text: 第三章般若經甚深之一切法空一般若經之譯出佛法演化到大乘佛法時代空與空性成為非常重要可說是大乘佛法的核心大乘法門是以發菩提心修菩薩行圓成無上佛果為主題的然在因行發心與修行中是不離空觀與空慧的果證菩提與涅槃也是不離空性的圓滿證得所以空的意義在經論的解說中也許不一致而空確是遍於一切經的特別是初期大乘經說到大乘空義很自然的想到了般若經與龍樹論般若經與龍樹論公認為著重於空義的闡揚以一切法空為究竟的在根本大義上般若經與龍樹的中論等當然是一致的但在方法上我以為龍樹菩薩本著大乘深邃廣博的理論從緣起性空的正見中掘發阿含經的真義中論是阿含經的通論中論確是以大乘學者的立場確認緣起空中道為佛教的根本深義掘發阿含經的緣起深義將佛法的正見確樹於緣起中道的磐石這樣般若經與龍樹論要分別來敘述般若經的部類非常多依古代的記載知道有二部三部四部八部十六會等不同傳說時代越遲般若經的部類越多這表明了般若經的眾多部類是在發展中先後次第集成的龍樹的大智度論說般若波羅蜜部黨經卷有多有少有上中下光讚放光道行龍樹知道般若經有三部上本是十萬頌本中本與下本就是一般所說的大品與小品三部中的下本般若中國古稱之為小品漢文譯出而現存的共有七部一道行般若波羅蜜經後漢支婁迦讖譯一卷二大明度經吳支謙譯六卷三摩訶般若波羅蜜鈔經傳說為前秦曇摩蜱共竺佛念譯其實是西晉竺法護譯的現存五卷部分已經佚失了四小品般若波羅蜜經後秦鳩摩羅什譯一卷五大般若波羅蜜多經第四分五三八卷起五五五卷止一八卷六第五分五五六卷起五六五卷止一卷這二分都是唐玄奘所譯的七佛說佛母出生三法藏般若波羅蜜多經趙宋施護譯二五卷中本般若古代稱之為大品漢文譯出而現存的共五部一光讚般若波羅蜜經西晉竺法護譯現存的已有佚失僅存一卷二放光般若波羅蜜經西晉無羅叉譯二卷三摩訶般若波羅蜜經姚秦鳩摩羅什譯三卷四大般若波羅蜜多經第二分四一卷起四七八卷止七八卷五第三分四七九卷起五三七卷止五九卷這二分也是唐玄奘所譯的上本般若即唐玄奘所譯大般若波羅蜜多經的初分一卷起四卷止共四卷以上各部與龍樹所見的三部般若經相當龍樹所見的上中下三部般若經為初期大乘所傳出代表般若法門的主要經典三部是先後集出的內容與文句都不斷擴充而一天天廣大起來先後集出的次第是先有原始般若經下本般若中本般若而後成立上本般若般若經的原始部分如道行般若經的道行品佛命須菩提為菩薩說應該修學成就的般若波羅蜜須菩提說般若容易引起疑問的由舍利弗發問須菩提解答這部分的成立最早在西元前五年應該已經成立了般若本是甚深的法門可說是趣入不退轉菩薩的法門但為了法門的宏揚宏傳者以聽聞讀背誦書寫經文以經典施他講說來勸人修學更說般若法門的世俗現生與死後的利益信仰的功德與毀謗的過失這才成為甚深而又通俗的法門經過長期的宏傳以原始般若部分為初品集成了下本般若以下本般若為核心而更擴大編集的是中本般若依摩訶般若波羅蜜經來說全經九十品可以分為三分前分序品第一舌相品第六中分三假品第七累教品第六六後分無盡品第六七囑累品第九中本般若的前分是下本般若所沒有的序品以下是佛為舍利弗說般若波羅蜜舌相品是中分的序起也可說是前分的得益結束中分或是內容的增廣或是經義解說的增廣或是法數的增廣而大概的說是與下本般若相當可以相互比對的後分依下本般若的見阿閦佛國品末後部分無盡品以外更廣說為六度相攝品方便品三慧品道樹品以下是下本般若所沒有的後分是方便道得不退轉以後的菩薩大行如六波羅蜜四攝報得神通莊嚴淨土成就眾生佛果功德末後三品常啼品法尚品囑累品舉薩陀波崙菩薩的求法故事作為勸發求學般若的範例這部分其後也被編入下本般若上本般若即傳說的十萬頌本論內容與中本般若相同論文句增多了四五倍這主要是每一法的反復敘述一一問答都不厭其繁的說明適應印度某些人的特殊愛好在好簡易的中國人看來未免太冗長了印度的經論梵本在流傳中是多有變化的般若經也不能例外如實有菩薩五種所知海岸常樂我淨真實功德本來是上本般若時代遲些的但在玄奘所譯中本般若大般若波羅蜜多經第二分第三分中也都有了這才與中國早期的譯本不合從後漢到姚秦西元二世紀末到五世紀初傳入中國的般若經都是屬於早期的現存的般若經梵本是西元六七世紀以後的寫本與漢譯本可能有些出入但不能完全依現存的梵本為依準論到漢譯般若經的文字當然玄奘的譯本明白但不能忽視的是玄奘譯出的時代西元六六六六三遲了些特別是玄奘是繼承無著世親一系的有宗是依解深密經對般若經作再解說的學派對空義有了不同的解說如羅什所譯為無所有或無所有性的玄奘每譯為無性為自性例如若一切法皆以無性而為自性如是無性非諸佛作無性之法定無作用然一切法皆以無性而為自性無性法中實無異法無業無果亦無作用無性之法常無性故諸法性無所有非佛所作無性法中無有業用無性法無業無果報無性常是無性諸法所有無所有非佛所作無所有法者亦無作亦無行是玄奘譯本是羅什與無羅叉譯本內容可說是相同的而玄奘所譯在短短的文段裡卻多出了兩句一切法皆以無性而為自性這與有宗學者的意解有關可能原本已有此增飾本文在說明初期的般若空義所以參考玄奘的譯本而以羅什等早期譯本為依二法空性是涅槃異名佛法是面對生死流轉的現實經修持而達涅槃理想的實現大乘佛法還是面對這一現實要解脫生死而又長在生死中度脫眾生達到究竟涅槃這被稱為菩薩道的修持心要是般若波羅蜜多般若慧本為佛法達成解脫的根本法門但要解脫而不捨生死不著生死而不急求證入涅槃大乘的般若波羅蜜多就與佛法有點不同了如般若經所說的一切法空就充分表示了這一特色那麼般若經所說的一切法空到底表示了什麼內容呢上文一再說到阿含經與部派佛教上座系對於空的意義諸行空是常空恒空不變易法空我我所空空是無我無我所的意思涅槃空是一切諸行空寂不可得愛盡離欲滅涅槃依此佛教的早期定義空在般若經中的意義也就可以明白般若經說一甚深相者即是空義即是無相無作願無起無生無滅無所有無染寂滅遠離涅槃義希有世尊以微妙方便障色等法示涅槃我不說一切法空耶世尊說耳須菩提若空即是無盡若空即是無量如來所說無盡無量空無相無作無起無生無滅無所有無染涅槃但以名字方便故說一切法皆不可說須菩提一切法空相性不可得說二深奧處者空是其義無相無作無起無生無滅無染寂滅離如法性界實際涅槃須菩提如是等法是為深奧義希有世尊微妙方便力故令阿惟越致菩薩摩訶薩離色等一切法處涅槃我不常說一切法空耶須菩提言世尊佛說一切法空世尊諸法空即是不可盡無有數無量無邊佛以方便力故分別說所謂不可盡無數無量無邊無著空無相無作無起無生無滅無染涅槃佛種種因緣以方便力說一切法不可說一切法不可說相即是空是空不可說三甚深義處謂空無相無願無造作無生無滅寂靜涅槃真如法界法性實際如是等名甚深義處善現當知如是所說甚深義處種種增語皆顯涅槃為甚深義如來甚奇微妙方便為不退轉地菩薩摩訶薩遮遣諸色等一切法顯示涅槃我先豈不說一切法皆自性自性二字唐譯增空善現一切法空皆不可說如來方便說為無盡或說無數或說無量或說無邊或說為空或說無相或說無願或說無作或說無生或說無滅或說離染或說寂滅或說涅槃或說真如或說實際如是等義皆是如來方便演說一切法性皆不可說何以故一切法性皆畢竟空無能宣說畢竟空者上列三則經文一是鳩摩羅什譯的小品般若波羅蜜經是下本二是羅什所譯的摩訶般若波羅蜜經三是玄奘所譯大般若經的第二分這二部都是中本三則經文的意義大致相同都分為二段第一段經的上文說阿惟越致不退轉菩薩然後說甚深義空無相等這種種名字都是涅槃的異名這是以甚深涅槃為主題的所以說為不退菩薩遮遣或譯障離除色等一切法而顯示涅槃這樣空與無相等相同都是涅槃的異名之一這是依涅槃而說空的這種種異名可分為三類一無生無滅無染寂滅離涅槃阿含經以來就是表示涅槃果的二空無相無願是三解脫門出世空性與無相界阿含經已用來表示涅槃三解脫是行門依此而得解脫涅槃也就依此來表示涅槃三真如法界法性實際實際是大乘特有的真如等在阿含經中是表示緣起與四諦理的到中本般若真如等作為般若體悟的甚深義這三類果行理境所有的種種名字都是表示甚深涅槃的第二段是接著說如菩薩思惟修習不離甚深般若得無量無數功德什麼是無量無數是超越數量的空義所以說我不常說一切法空耶法空相性如來說為空無相寂滅涅槃真如實際等一切法性是不可說的一切法不可說相即是空是空不可說空性也是不可說的說為涅槃真如等都不過是如來的方便假說而已這段文中空與涅槃都是其中的一名而歸於一切法空這是以一切法空性為主題的依教說涅槃是三乘共通的法空性是大乘不共的如約理說涅槃與一切法空性是相同的如上引經說外大方廣佛華嚴經十地品卷二六大正九五六四中下說菩薩得無生法忍入第八地入不動地住不動地一切心意識不現在前乃至佛心菩提心涅槃心尚不現前何況當生諸世間心佛子是菩薩隨順是地以本願力故又諸佛為現其身皆作是言善哉善哉善男子一切法性一切法相有佛無佛常住不異一切如來不以得此法故說名為佛聲聞辟支佛亦得此寂滅無分別法若諸佛不與菩薩起智慧門者是菩薩畢竟取於涅槃八地菩薩就是不退轉地菩薩八地得無生法忍悟入寂滅無分別法這是二乘也能得到的如菩薩的本願力不足沒有諸佛的勸發那是要證入涅槃退落而與二乘一樣的經佛的勸發菩薩這才從般若起方便起如幻三昧作利益眾生的大業莊嚴功德圓滿而成佛小品般若波羅蜜經卷七大正八五六八下五六九上說菩薩行般若波羅蜜應觀色空應觀受想行識等一切法空應以不散亂心觀法無所見亦無所證菩薩具足觀空本已生心即本願但觀空而不證空我當學空今是學時非是證時不深攝心繫於緣中菩薩緣一切眾生繫心慈三昧過聲聞辟支佛地住空三昧而不盡漏須菩提爾時菩薩行空無相無願解脫門而不證無相亦不墮有相般若經義與十地品說是一致的今是學時非是證時如以為所作已辦大事已了那就要證實際盡諸漏而成為二乘入涅槃的觀空而不證空除了般若外主要是本願與慈悲力般若經集出要早些還沒有說到佛力的加持勸發總之般若經的空性就是十地品的寂滅無分別法如證入就是涅槃這說明了般若經的法空性是依佛說的甚深涅槃而說的三大乘般若與阿含經釋迦佛說法從現實的身心說起指出生死不已的癥結所在呵斥生死呵斥煩惱從聖道去實現理想的涅槃涅槃佛沒有說是這樣的那樣的因為涅槃是無量無數不能說是有是無的佛只是從煩惱的不再生起苦蘊身心的不再生起以遮的方法來表示如燈火滅一樣這樣說生死是有為那涅槃就是無為有為法有生住滅無常無為法是不生不住不滅常對於生死有為與涅槃無為一般是看作對立的別體法即使說涅槃空與無為空也不許說是有為空那樣的這是後世的聲聞弟子們為了說明佛法出發於相對二的立場終於忽略了涅槃的超越絕對性般若經的甚深義是空性也就是涅槃涅槃的體證是沒有時空沒有數量也沒有能所主觀與客觀的對立渾然的無二無別也不會覺得是一體的現觀是一切不可說不可得的般若等大乘經就是從這無二無別的甚深體驗中來觀一切法一切法不出於此於是一切法本空一切法本不生滅一切法甚深一切法不可得一切法本清淨一切法本自寂滅一切法皆如也一切法不出於法界這一類文句就這樣的弘傳出來玄奘譯的大般若經說以真法性為定量故這是以法性真如空性的異名的現觀為理解與修證的準量如中本般若的四十二字母門以阿喉音為首一切語音都以阿為根本依阿而申展出來的以此為修行法門也就是從阿不非無離來觀一切法羅闍是垢義羅字就是一切法離垢故到末一字荼是必義荼就是諸法邊竟處故不終不生從阿字為本來觀一切一切都是不無非離了初期大乘經雖有多方面的獨到開展而本於一切法性不可得空性的立場與般若經是一致的這一立場與阿含經以來的傳統佛法從現實身心五蘊六處等出發指導知斷證修以達理想涅槃的實現方法是截然不同的如佛說文殊師利淨律經大正一四四四八下說問其佛說法何所興為何所滅除答曰其本淨者以無起滅不以生盡滅所以者何彼土眾生了真諦義以為元首不以緣合為第一也文殊師利是從東方寶英佛土來的文殊說彼土的佛法是以真諦無生滅法為首的不如此土的佛法以緣合因緣和合生或緣起為第一出發於因緣生滅呵責煩惱等教說文殊所說的彼土佛法代表了印度東南新起的大乘此土以緣合為第一當然是固有的釋迦佛以來的傳統佛法這兩大不同類型的佛法在方法上是對立的如阿含經從生滅無常下手無常故苦苦故無我空甚至說若人壽百歲不觀生滅法不如一日中而解生滅法如實知生滅無常的重要性可想而知但般若經嚴厲的批評了無常的觀慧如小品般若波羅蜜經卷三大正八五四六下說當來世有比丘欲說般若波羅蜜而說相似般若波羅蜜諸比丘說言色是無常受想行識是無常若如是求是為行般若波羅蜜憍尸迦是名說相似般若波羅蜜以生滅無常觀為相似般若不生滅不壞觀為真般若雖可說對某些部派說但在文字上顯然是不滿傳統的阿含經阿含與般若等大乘經的對立應該說是佛法的不幸般若等大乘經發菩提心修菩薩行圓滿佛果而外甚深義一切法空法法皆如的闡揚都是涅槃別名這應該是依阿含思想引發而來怎麼會到達這樣的對立呢傳統者指新興的大乘為非佛說大乘者稱阿含等為小乘尖銳的對立能不說是佛法的可悲現象嗎從不拘宗派的超然立場來說傳統佛教部派佛教與大乘行人都有些偏頗了阿含經的中心思想是緣起緣起是此有故彼有此生故彼生純大苦聚集此無故彼無此滅故彼滅純大苦聚滅依緣起的相依性依之而有說明生死的集有為法也依緣起的相依性依之而無說明生死的滅無為法有為與無為依同一原則而闡明但傳統佛教界似乎少有能完滿的把握緣起不是以緣起為生滅邊事有為的就推想為不變的理性無為的還有慧解脫本是一切阿羅漢的通稱所以論佛與阿羅漢的差別就舉慧解脫為一切阿羅漢的代表依空無所有無相而得心解脫不正就是阿羅漢的心解脫嗎但阿羅漢中有不得深定的有得深定的這才方便的分為慧解脫與心慧俱解脫的二類我要這麼說因為要解說一項事實雜阿含經中長老比丘們告訴須深比丘他們是阿羅漢但不得四禪相應部說不得五通及無色定須深覺得難以信解佛告訴他說彼先知法住後知涅槃不問汝知不知且自先知法住後知涅槃這是說阿羅漢有先後層次也可說有二類一法住智知緣起被稱為法性法住所以法住智是從因果起滅的必然性中於五蘊等如實知厭離欲滅而得解脫智我生已盡梵行已立所作已辦不受後有雖然沒有禪定但煩惱已盡生死已了這是以慧得解脫知一切法寂滅而沒有涅槃的自證二涅槃智知生前就能現證涅槃的絕對超越即大乘的證入空性絕諸戲論也類似一般所說的神秘經驗名為得現法涅槃在古代被稱為得滅盡定的俱解脫不過滅盡定論師的異解紛紜這可能是二類阿羅漢也可能是先後契入的層次眾生的根性不一還有一類人不是信仰希欲聽聞覺想也不是見審諦忍卻有有滅涅槃的知見但不是阿羅漢如從井中望下去如實知見水但還不能嘗到水一樣部派佛教中主要是上座部系重於四諦的知見少有得現法涅槃的在教義上雖有種種阿羅漢滅盡定等而缺乏超越的體驗所以這一系的教義被譏為唯見浮繁妨情支離害志紛紜名相竟無妙異了大乘佛法的興起決定是與大眾部系有關的如上一章說到方廣部說大空派以為勝義僧與佛都是超越現實人間世的這就是大智度論所說的方廣道人說一切法不生不滅東山住部的隨順頌以為法性不二佛所說的都是隨順世間轉分別部說凡聖一切都以空為本一說部說世出世法悉是假名甚深義法性不二從大眾部學派中開展出來此外論事說到安達羅派以為釋迦菩薩在迦葉佛時入於決定東山住部等也說成佛以前的菩薩已經得法現觀入正性決定正性決定就是正性離生入正性離生是體悟正法而成為聖者這樣菩薩有二階位一凡夫二得正性決定的聖者菩薩的分為二階與大乘所說的菩薩是一致的大眾部系中法性不二思想的開展本生又廣泛的流傳菩薩道受到佛弟子的讚仰有聖位菩薩的安立如有人發心修學求成佛道依佛法說這是可能而值得讚歎的在佛教界慧解脫聖者是沒有涅槃智的俱解脫者有涅槃智是入滅盡定而決定趣涅槃的惟有另一類人絕少數正知見有滅涅槃而不證得阿羅漢的不入滅盡定而有甚深涅槃知見的正是初期大乘觀一切法空而不證實際的菩薩模樣大乘法中菩薩觀空而不證實際當然是由於智慧深悲願切還有佛力加持而最原始的見解還有不深攝心繫於緣中不深入禪定因為入深定是要墮二乘證實際的所以觀彌勒菩薩上生兜率陀天經說彌勒雖復出家不修禪定不斷煩惱被稱為菩薩的持經譬喻師法救也說菩薩雖伏我見不怖邊際滅不起深坑想而欲廣修般羅若故於滅盡定心不樂入勿令般若有斷有礙正見甚深法的菩薩從這樣的情況下出現悲願力所持自知此是學時非是證時所以不盡煩惱不作究竟想不取涅槃成為觀空而不證空的菩薩最深徹的名為無生法忍阿毘達磨中忍是無間道稱為忍表示是知而不是證入的意思甚深空義慧解脫聖者沒有涅槃智的超越體驗當然不會說俱解脫聖者有現法涅槃但好入深定或長期在定中當然也不會去闡揚惟有有涅槃知見而不證的在崇尚菩薩道的氣運中求成佛道利益眾生才會充分的發揚起來也有適應世間的成分起初如小品般若波羅蜜經說是深般若波羅蜜應於能得阿毘跋致菩薩前說是人聞是不疑不悔不退轉菩薩是少之又少的所以說無量無邊阿僧祇眾生發阿耨多羅三藐三菩提心於中若一若二住阿毘跋致不退轉地這當然是甚深義法門還不是普遍傳宏的也許大乘法門傳開了來學的人也漸漸多了於是久行菩薩也能夠信解了所以說能信解深般若波羅蜜當知是菩薩如阿毘跋致何以故世尊若人於過去世不久行深般若波羅蜜則不能信解進一步新發意應譯新學菩薩也有信解可能了如說若新發意菩薩隨惡知識則驚怖退沒若隨善知識聞是說者則不驚怖沒退再進一步一切法空的般若深義什麼人都能契入如中本般若說是法門利根菩薩摩訶薩所入佛言鈍根菩薩亦可入是門中根菩薩散心菩薩亦可入是門是門無礙若菩薩摩訶薩一心學者皆入是門般若甚深法門三根普被人人可學可入這就是直從法性平等法法皆空皆如去深入的法門四空之發展與類集般若經以超越名相分別的涅槃也就是釋迦如來的自證為根本立場依此來觀一切法有為與無為不二生死與涅槃不二一切是無二無別絕諸戲論以此來化導就不如釋尊那樣的教化不從無常苦入手而直從空無相無願等入門這是大乘佛法般若經的特色表示這一內容的如上文引述有空無相無願不起不生無所有遠離寂靜如法界實際等種種異名而般若經所獨到發揚的是空一切法空本來般若經不是非說空不可的如金剛般若波羅蜜經全經但說無相竟沒有一個空字被推定為原始般若的道行般若經的道行品也沒有說到空只說離無所有無生無性不可得等下本般若說到了空起初說以空法住般若波羅蜜什麼是安住空法經上說不住一切法不住一切法的常與無常樂與苦淨與不淨我與無我空與不空中本般若更不住寂滅與不寂滅遠離與不遠離還有須菩提說甚深法是隨順一切法的是甚深法無障礙處是法無生是法無處足跡諸天子聽了讚歎說長老須菩提為隨佛生有所說法皆為空故皆為空故玄奘譯為一切皆與空相應故這可見經文所說的無障礙處無生無處都與空相應可說都是空義還有釋提桓因說須菩提如汝所說者皆因於空皆因於空是說須菩提安住空法本著空的體悟而說法所以一切境法所行法所得果法得法者都無所得依據這幾則經文及上所引法空性的種種異名可知下本般若所說的是在般若的實踐中明甚深空性甚深空性經聽聞思惟觀察而到達無生法忍的徹悟到了中本般若有了進一步的發展將種種空類集起來中本般若是應該分為三分的一前分經上說菩薩摩訶薩行般若波羅蜜相應所謂空無相無作雖並舉三解脫門卻更重視空所以說是空相應名為第一相應於諸相應中為最第一相應所謂空相應摩訶般若波羅蜜經卷一大正八二二二下二二三上說菩薩摩訶薩行般若波羅蜜習應七空所謂性空自相空諸法空無所得空無法空有法空無法有法空七空是中本般若所共說的但放光般若波羅蜜經大般若波羅蜜多經第二分第三分都沒有列舉七空的名目光讚般若波羅蜜經列舉了七空的名目內空外空有空無空近空遠空真空即勝義空又與摩訶般若波羅蜜經所說的不同放光等沒有列舉名目而列出名目的又彼此不同那七空到底是那七種空呢依經文來觀察七空是總結上文的如放光般若經說何謂七上七事是也上文說習應空是別觀五蘊空十二處空十八界空四諦空十二緣起空一切法若有為若無為空本性空這就是前分所說的七空吧中本般若的後分有十四種空的類集如大般若波羅蜜多經第三分卷五二三大正七六八二中說菩薩摩訶薩安住般若波羅蜜多觀內空內空性不可得觀外空外空性不可得觀內外空內外空性不可得觀大空大空性不可得觀空空空空性不可得觀勝義空勝義空性不可得觀有為空