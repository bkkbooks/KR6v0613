住如如住者即是常耶不也世尊前心與後心是不能同時而有的那麼前滅後生怎麼能相續而善根增長圓成佛道呢佛舉如燈燒炷的譬喻以不即不離的意義來說明這才引起了這一段的問答心已滅了是不能再生起的心生起了就有滅相這滅相卻是不滅的滅相是不滅的所以問那就真如那樣的住嗎是真如那樣的卻不是常住的這一段問答不正是非常非滅嗎一般說諸行無常但論到前滅後生間總不免有中斷的過失如唯識學者提出了前因滅位後果即生如秤兩頭低昂時等的解說也不免有前後同時的嫌疑同時怎能有前後呢依般若經及龍樹論意若一切實性無常則無行業報以是故諸法非無常性若一切法實皆無常佛云何說世間無常是名邪見佛處處說無常處處說不滅破常顛倒故說無常諸法實相非常非無常所以法相是非常非滅也就是非常非無常的觀一切法非常非滅不落常無常二邊契會中道的空性上文所引如燈燒炷的譬喻經說是緣起理趣極為甚深甚深緣起是非常非滅的緣起而在十八空中非常非滅本性爾故表示了一切法的空性非常非滅也就是假名而沒有自性的如摩訶般若波羅蜜經卷七大正八二六九中說舍利弗一切法非常非滅色非常非滅何以故性自爾受想行識非常非滅何以故性自爾乃至意觸因緣所生受非常非滅何以故性自爾以是因緣故舍利弗諸法和合生無自性諸法和合生無自性大般若經第二分作但有假名都無自性假名是諸法和合生的無自性就是空可見般若的正觀是通達一切法非常非滅不落二邊而空的所以摩訶般若波羅蜜經說般若波羅蜜遠離生死非常非滅故六空之雙關意義空是形容詞形容詞的名詞化就是空性在阿含經中空三昧空住等都是空性但沒有般若經空性的意義空與無相無所有同為解脫的要門重在觀慧般若經的觀慧漸漸的重視空演進到空與真如涅槃法性等為同義異名如摩訶般若波羅蜜經卷二五大正八四二下說是本性空不常不斷何以故是性空無住處亦無所從來亦無所從去須菩提是名法住相性是中無法無聚無散無增無減無生無滅無垢無淨是為諸法相性般若經說的空是從種種而顯示的本性空本性空是不常不斷即非常非滅的無住處超越了空間無所從來無所從去又超越了時間這就是法住相性也就是諸法相性在這一意義上空性與法住法性真如等是同一內容的但在表示法義的應用上還是有點不同的空是觀慧所觀從一切法的虛妄不實而顯示的原則的說般若經是以般若為主導的菩薩行般若圓滿了就是佛的薩婆若一切智或一切智智這是般若修證的開示不是義理的說明般若所悟的法相性稱為如法界實際等這種種異名也只是方便安立如摩訶般若波羅蜜經說眾生但住名相虛妄憶想分別虛妄分別中可見一切名義一切分別都不能表達法性的但方便說法不可能沒有表示這不落名相分別的方便佛法固有三解脫門空無相無作願等便被使用起來今依小品般若經擇要的列舉用以表示的詞類如下空無相無作願無起盡無或不生無或不滅無依無性遠離清淨寂滅寂靜不可得不可思議無所有虛誑虛妄不實不堅牢從所列舉的來說空與無所有具有雙關的意義在雜阿含經中空無相無所有是三三摩提或三解脫在解脫法門中無所有是重要的術語但後來無願代替了無所有所以在阿毘達磨論中無所有就少見了般若及初期大乘經雖繼承了空無相無願的三解脫門說而無所有仍廣泛的應用說空與無所有的比無相與無願要多得多如上表所列的從空到無所有如是甚深法相是示世間的實相是將入不退轉的深行是無法可轉無法可還無法可示無法可見是一切無縛無解這或是表示深法相或是菩薩的深觀下本般若的空與無所有等是重在顯示真實的但空無所有以下如的空無所有虛誑不實是各種譯本所同的這是表示虛妄不實了如小品般若經說字無決定無住處所以者何是字無所有故所說的無所有也是但名無實的意思空與無所有是顯示如實相的也用來表示虛妄性所以說有雙關的意義其實如盡無生無滅寂滅遠離清淨這些涅槃的同義異名還不是都有遮妄的意義般若經本重於深法相的直觀而在空的發展中說諸行或一切法虛妄不實的教說也越來越多如小品般若經說菩薩行深般若波羅蜜信解一切法無生一切法空一切法寂滅而沒有能得無生法忍入不退轉地的也為諸佛所讚歎這是無生空寂滅的深觀而摩訶般若經作信解一切法無生一切法空一切法虛誑不實無所有不堅固大般若經第二分作信解無生深般若畢竟空性寂靜性遠離性虛妄性空性無所有性不自在性不堅實性又如摩訶般若經說行深般若的應觀寂滅空虛誑不堅實第二分就說應觀彫落破壞離散不自在不堅實性虛偽了又如摩訶般若經說諸波羅蜜性無所能作自性空虛誑如野馬放光般若經也說自空無所能作無所能為如熱時之焰大般若經第二分就這樣說一切法自性皆鈍無所能為無有主宰虛妄不實空無所有不自在相譬如陽焰光影水月幻事夢等虛誑不實這一類術語的更多應用意味著般若法門不只是深法相的體悟而要觀破世俗的虛妄從而脫落名相以契入如實相七自性空與無自性空般若經常說自性空一切法無自性無自性故空經論師的大力宏揚學者們似乎覺得般若經所說的自性空就是一切法無自性空了當然般若經說一切法虛妄無實但有名字是可以說是無自性的如經說我名字無自性但有假名都無自性但般若經所說的自性空與無自性空意義上是有些不同的大智度論卷四六大正二五三九六中說自性有二種一者如世間法中地堅性等二者聖人所知如法性界實際自性的第一類是世間法中所說的地堅性水濕性等地以堅為自性水以濕為自性等世俗法中是可以這樣說的如求堅等自性的實體那是不可得的也就是沒有自性無自性了自性的第二類是聖人所證的真如或名法界實際等這是本來如此可以名之為自性的智論卷六七所說色性者所謂地堅性等復次色實性名法性也就是這二類自性的分別這二類自性一是世俗自性世間眾生以為自性有的如地堅性等不符緣起的深義所以要破斥而論證為沒有自性的二是勝義自性聖人所證見的真如法界等是聖人如實通達的可以說是有的所以智論說如法性界實際世界故無第一義故有第一義就是勝義第一義中有的自性下本般若是一再說到的小品般若波羅蜜經卷三大正八五五一中說色無縛無解何以故色真性是色受想行識無縛無解何以故識真性是識色真性是色道行般若與摩訶般若鈔經譯為色之自然故為色自然是自性的古譯趙宋所譯的佛母出生三法藏般若波羅蜜多經也作色自性是色一般所知的是色等五蘊的虛妄相所以說繫縛說解脫色等法的勝義真自性是色等真相這是沒有繫縛與解脫可說的與之相當的中本般若如放光般若經說五陰不縛不解何以故色色自有性識識自有性六波羅蜜亦不縛亦不解何以故六波羅蜜所有無所有故五陰自有性還是下本般若的自性說而中本增廣的六波羅蜜等卻改作所有無所有了秦譯的摩訶般若波羅蜜經等五陰六度等一律改為無所有性玄奘所譯的大般若經作以無性為自性或無所有性為色等自性故依各本的比較可知下本般若是自性中本般若漸演化為無所有之性再演化為無性為自性無所有性為自性意義相同但這是無性的自性與下本的但說自性不同了道行般若經卷三大正八四四一上說人無所生般若波羅蜜與人俱皆自然人恍惚故般若波羅蜜與人俱不可計人亦不壞般若波羅蜜亦如是摩訶般若鈔經也如此說這二本古譯說人眾生與般若波羅蜜都是無所生無生自然恍惚遠離不可計不可思議不滅壞所說的自然自性小品般若等就譯作無性大般若經竟改作無自性了大明度經卷一大正八四八二上說眾生自然念亦自然眾生恢廓念亦恢廓眾生之不正覺而念亦不正覺自然恢廓不正覺三者摩訶般若鈔經作自然恍惚遠離難了知自然自性道行般若經作空性而小品般若等就譯作無性大般若經第四分第五分譯為無自性與之相當的中本般若各本都作無無自然無自性下本般若的自然自性與無生遠離不可思議為同類實在是勝義自性法性與涅槃的異名稱之為無所有性無性為自性雖多一轉折近於正經反而到合是可以的如改為無自性似乎是不適當的中本般若也說到自性如摩訶般若波羅蜜經卷一大正八二九二中說云何名無為諸法相若法無生無滅無住無異無垢無淨無增無減諸法自性云何名諸法自性諸法無所有性是諸法自性是名無為諸法相諸法自性唐譯本作謂一切法無性自性意義相同又摩訶般若經說諸法實性無生無滅無垢無淨故實性唐譯本也作自性無性與無自性說是中本般若的一致傾向而唐譯本增入了更多的無自性更多的無性為性以無性而為自性我以為般若法門本是直觀深法性的空性是涅槃的異名所以自性也約勝義自性說然般若法門的開展不但為久行說為鄰近不退者說也為初學說不但為利根說也為鈍根說這一甚深法在分別思惟觀察非勘破現前事相的虛妄不實從虛妄不實去求突破不可這所以多說一切法無性一切法無自性了以無自性為自性與空的空虛性及涅槃的雙層意義是非常契合的般若經廣說種種空而定義都是非常非壞何以故本性爾故經說十四空十六空十八空二十空依種種法義來顯示空而一切都是約本性空說的本性空是聖智證知的所以摩訶般若波羅蜜經卷二五大正八四二下說須菩提若內空性不空外空乃至無法有法空性不空者則壞空性是本性空不常不斷何以故是本性空無住處亦無所從來亦無所從去須菩提是名法住相是中無法無聚無散無增無減無生無滅無垢無淨是為諸法相是為諸法相唐譯本作是一切法本所住性本性在說一切有部中與自性同一內容如毘婆沙論說如說自性我物自體相分本性亦爾般若經中處處說本性空也處處說自性空意義也大致相同自性空本是勝義自性空如說自性空故自性離故自性無生故這是以空離來表示自性自性空並非沒有自性由於假名無實虛妄無實與空的空虛義相關聯而自性空有了無世俗自性的意義如摩訶般若波羅蜜經卷二四大正八三九八中說是名但有空名虛妄憶想分別中生此事本末皆無自性空故自性空故唐譯本作自性皆空更顯出都無世俗自性的意味如說但有假名都無自性以色處等與名俱自性空故勝義的自性空漸演化為世俗的無自性空還可以從空的類集中得到證明中本般若立十六空是在十四空以下增列無性空與無性自性空十六空是沒有自性空的然中本般若無論為十六空或十八空上本立二十空在說十六或十八空後都更說四種空復次須菩提法有性法相空無法無性無法相空自法自性自法相空他法他性他法相空自法自法相空就是自性由自性空所說的自性空是是自性空非知作非見作非知所作非見所作也非餘人所作的自性空正是本來如此的勝義自性空一直到成立十八空與大般若經第二分相當才在無性空與無性自性空間增列自性空這三種空如摩訶般若波羅蜜經卷五大正八二五下說何等為無法無性空若法無是無法亦空非常非滅故何等為有法自性空有法名諸法和合中有自性相是有法空非常非滅故何等為無法有法無性自性空諸法中無法諸法和合中有自性相是無法有法空非常非滅故無法有法空依經文說是無法無性與有法自性的合觀為空所以大智度論以為與內空外空內外空初三空一樣十八空中初三空破一切法後三空亦破一切法又如光讚般若經說一切諸法皆無所有悉為自然自性是以一切法無性而顯自性摩訶般若經說諸法亦如是無自性舍利弗諸法和合生故無自性唐譯大般若經作諸法都無和合自性何以故和合有法自性空故諸法和合生所以沒有自性這是無自性的自性空也與眾緣和合生故無自性緣起的無自性空相同但在般若經中這還是十八空的一空把握這一原則而徹底發揮的那是龍樹的緣起無自性故即空了八空與一切法空與一切法之關係如小品般若波羅蜜經卷一大正八五三八中說舍利弗是諸法不爾如凡夫所著舍利弗白佛言世尊今云何有佛言如無所有如是有如是諸法無所有凡夫不知故名無明如凡夫所知的以為如何如何的一切法都是有所取著的一切法的實相並不如凡夫所著的那樣舍利弗問佛那麼一切法是怎樣的呢佛說一切是無所有而有的凡夫不知道以為是一般所知那樣的所以說是無明無明是眾生的根本迷惑也就是生死流轉的根源這一問答表示了二方面一眾生以為如是如是有的是迷執的生死一聖者知一切無所有是解脫這就符合早期的二諦說如中論青目釋說世俗諦者一切法性空而世間顛倒故生虛妄法於世間是實諸賢聖真知顛倒性故知一切法皆空無生於聖人是第一義諦名為實二諦說到中本般若的後分大大的應用起來依般若經說第一義諦勝義諦是沒有任何差別可說的為了方便說法不能不說二相對的不立二就一切無可說了所以有名相安立的一切法及不落名相的勝義勝義下本般若多依真如立論也有名為法性的如說法性唯一無二無三是性亦非性非作中本般若的前分後分多稱為法界實際也有稱為法住性的在真如的十二異名中空與無相沒有計算在內但也一再說到無相如說是一切法皆不合不散無色無形無對一相所謂無相空也被稱為空相如說是諸法空相不生不滅不垢不淨不增不減一切法皆空一切法與空應怎樣的去如實信解如大般若波羅蜜多經第二分卷四三大正七一四上說舍利子諸色空彼非色諸受想行識空彼非受想行識何以故舍利子諸色空彼非變礙相諸識空彼非了別相何以故舍利子色不異空空不異色色即是空空即是色受想行識不異空空不異受想行識受想行識即是空空即是受想行識舍利子是諸法空相不生不滅不染不淨不增不減非過去非未來非現在如是空中無色無受想行識無眼處無得無現觀無正等覺無正等覺菩提這就是一般最熟悉的如心經所說的色不異空空不異色色即是空空即是色受想行識亦復如是的教說這一教說中本般若一再的說到而上面所引的與般若波羅蜜多心經最接近所以引述這段文來解說這段文字明色受想行識五蘊空然後依空明一切法不可得五蘊主要是每人一切眾生的身心自體廣義是包含了器世間的山河大地草木叢林可說是一切現象界的分類五類聚為了文字的簡約且依色蘊來說全文可分三節標宗明義結論一諸色空彼非色是標宗菩薩與般若波羅蜜相應就是空相應為了要闡明般若波羅蜜照見的空義所以揭示了諸色空彼非色的宗要色是一般所說的物理現象其他四蘊是心理現象的分類一般所知的色法是本性空的本性空的也就是非色這二句或作是色非色空是色空非色這是說色是非色的所以色是空色是空的所以是非色反復說明而意義還是相同的二何以故下是明義為什麼色空非色呢諸色空彼非變礙相約自相空說為什麼知道有這樣那樣的法以相故知相是一一法的特徵以不同的相知不同的法如變礙是色相變是變異礙是物質佔有一定的空間有此就不能有彼如部派佛教者說色分析到最微細的物質點名為極微極微是不可析不可入的與古代的原子說相同不可入就是礙一般所說的變異與質礙相大乘法是加以否定的沒有變礙的決定相那怎麼說是色呢所以沒有變礙相相空也就是空非色了何以故色不異空到空即是色是進一層的解明空義色不異空空不異色或作色不離空空不離色空是涅槃的異名或以為空與色是相對的涅槃空是離色滅色而後空的所以進一步說上文的色空非色是本性空色如幻如化沒有決定性的相色相空所以說非色沒有決定性的相宛然似有當體即空色與空不是離異的而是即色明空的即色是空就是色的本性空般若大乘的特色是一切法本空本性清淨也就是世間五蘊生死即涅槃如大智度論舉般若經的色即是空空即是色而引中論頌說涅槃不異世間世間不異涅槃涅槃際世間際一際無有異故這就是色空彼非色的進一步說明三是諸法空相以下是結成般若法門從信解一切法空經柔順忍而無生法忍得到與涅槃同一內容的深悟不過通達而不證入般若是聖道的實踐不是深玄的理論所以般若相應只是一切法本性空的觀照目的是空性相的體悟所以先標色空非色等再從色等相空而明即色是空然後結歸正宗而表示一切法空相空性相是超越名相分別不落對待實是不可說的如摩訶般若經說一切法不可說一切法不可說相即是空是空不可說所以名為空相也只是佛以方便假說而已經上提出不生不滅不垢不淨不增不減及非未來等三世以表示空相生是生起是有滅是滅去是無約法體的存在與不存在說但空相不可說是有是無非先無而後有也非先有而又後無的不生不滅表示了超越有無生滅的相對性垢是雜染淨是清淨約法的性質說空相本無所謂雜染與清淨的經上或稱為清淨也是佛的方便說如大智度論說畢竟空即是畢竟清淨以人畏空故言清淨依方便說空性也是在纏而不染出纏而非新得清淨的所以不垢不淨超越了染淨的相對性增是增多減是減少約法的數量說空性無數無量所以不增不減超越了增減的相對性空性是超越時間相的所以說非未來非過去非現在是空不可說說空相不生不滅等還是依超越世俗所作的方便說空性相是這樣的所以接著說是空相中無色等五蘊無十二處無十八界無四諦無十二緣起無得無現觀就是心經所說的無智亦無得現觀是現證智沒有智沒有得所以無預流無預流果無阿羅漢無阿羅漢果沒有聲聞乘的四果聖者及所得的四沙門果無獨覺聖者無證得的獨覺菩提無菩薩人無菩薩行無正等覺者無正等覺菩提三乘人法空性中是不可得的這一段文字與心經的主體部分完全一樣只是心經要簡略些如照見五蘊皆空到受想行識亦復如是與諸色等空彼非色到空即是受想行識相當既然無智無得有智有得的三乘聖者與聖法當然也不可得而不妨簡略了般若道的實踐是依一切法而觀為一切皆空不離一切而超越一切如實的體悟如大智度論說般若波羅蜜能滅諸邪見煩惱戲論將至畢竟空中唯識宗雖解說不同而般若真見道時也是沒有任何相可見可得的菩薩依一切法而深觀一切法空到如實通達時一如無二無別譬如種種色身到須彌山王邊皆同一色般若經所說的空中無色無等正覺等正覺菩提正是這一意義九法空如幻般若經的宗要是即一切法而超越一切法超越一切的實義名為空性法性等是第一義實無有相無有分別亦無言說無有言說所以一切法不可說無有相所以一切法無可示無有分別所以一切法不可分別離名離相離分別的諸法空相當然是一切不可得的般若經開示菩薩的般若行教學菩薩行的應怎樣的不著一切以無所得而能度眾生成佛道但在世俗心中不免引起疑惑在中本般若的後分中就不斷的提出種種疑問既然法也不可得眾生也不可得沒有業報沒有道果沒有垢淨沒有修證沒有名相佛與佛法也不可說那為什麼要說為什麼說有業報有地獄菩薩佛有六度十八佛不共法等差別為什麼要發心度眾生莊嚴佛土成佛在後分中說到那裡就問到那裡解說到那裡一層層的問題問題的所以成為問題始終是一樣的也就是名相與無名相間的對立性般若經的解答還是與修證相應而不是理論的經上提出了二諦說也就是一切言說一切差別說修行說凡說聖都是依世俗諦說的如說眾生於無法中有法想我以除其妄著故說世俗法故說有得非第一義一切言說差別是不能不是二相對的為了教化所以方便的說有二諦說種種差別是依世俗說的不是實義其實世諦第一義諦無異也何以故世諦如即是第一義諦如相對的二超越絕對的無二如摩訶般若波羅蜜經卷二一大正八三七三下三七四上說諸有二者是有所得無有二者是無所得不從有所得中無所得不從無所得中無所得須菩提有所得無所得平等是名無所得相對的世俗是二是有所得是眾生的取著處佛說無二無所得是一切無所取著的第一義勝義但發心修行要安住無所得無所得不在有所得中有所得是有取著的也不能說在無所得中如有無所得可得那是落於相待不是無所得了所以菩薩住無所得以無所得為方便等是不著有所得而又不著於無所得的這樣有所得二與無所得無二無二無別平等平等這才是佛說無所得無二的意趣所在當然稱之為無所得終歸是不離假名的方便般若經廣說一切法空一切法清淨一切法不可得等意在即一切法而超越一切空無所有等並非什麼都沒有也不是一切法外別有涅槃真如等所以對於種種疑問經上每舉如幻如化等譬喻譬喻雜阿含經就有了如色如聚沫受如水泡想如陽燄行如芭蕉識如幻事等般若經所舉的譬喻先後不一有六譬七譬九喻十喻等摩訶般若波羅蜜經序品總列為十喻一幻二陽焰三水中月四虛空五響六揵闥婆城七夢八影九鏡中像十化這些譬喻的共通意義是看也看到聽也聽到明明有這回事而其實卻是沒有的根本沒有的說他空無所有卻又看得聽得分明試舉一容易理解的陽焰來說地上有水分經太陽光的照射化為水汽在地面流動遠遠望去如一池水在微波盪漾口渴的鹿見了也會跑過去喝所以或稱為鹿愛前方明明有水微波盪漾這是大家都見到的但走到那邊卻什麼也沒有水汽也是看不到的說沒有麼遠遠的望去還是水波盪漾這樣以水來說見到水時並沒有水的生起不能說是有過去一看水沒有了不是水的滅去也不能說是無陽燄是這樣的不生不滅非有非無宛然現有而其實是空的以陽燄作譬喻一切法也都這樣進一步說有水沒有水由於遠處望去或近處察看陽燄的水並不是忽而有了忽而沒有陽燄一直是這樣這樣的如如不異不能說是常住的可也無所謂生滅不過這是譬喻譬喻只能取其譬喻的意義而已十種譬喻可以從種種方面作不同的解說而主要是似乎是有其實是空無所有的如大智度論說是十喻為解空法故諸法雖空而有分別有難解空有易解空今以十喻易解空喻難解空所以說幻化等譬喻是解了一切法空的後代的瑜伽派依解深密經意而別為解說虛空是譬喻圓成實性的幻化等是譬喻依他起性的別立空華喻譬喻遍計所執性在羅什及以前的放光光讚是沒有空華喻的這樣幻化等是說有而不是空了然論般若法門的本義是不宜依據這一別解的般若經說甚深一切法都是甚深說清淨一切法都是清淨說空無所有一切法都是空無所有說法性一切法都是法性說如幻如化當然是一切如幻如化如經說我說眾生如幻如夢須陀洹果亦如幻如夢辟支佛道亦如幻如夢我說佛法亦如幻如夢我說涅槃亦如幻如夢設復有法過於涅槃我亦說如幻如夢諸天子幻夢與涅槃無二無別一切法皆是化於是法中有聲聞法變化有辟支佛法變化有菩薩摩訶薩法變化有諸佛法變化有煩惱法變化有業因緣法變化以是因緣故須菩提一切法皆是變化是下本般若經文沒有簡別的說一切法都如幻如夢涅槃也是如幻如夢的中本般若結束時說到不同層次的一切法都是如變化的一切法中有聲聞法發心修行證沙門果等有辟支佛法是獨覺者的發心修行證果有菩薩法如發菩提心以般若為導而修六度四攝得無生忍報得神通莊嚴淨土成就眾生等有佛法佛的一切種智攝得十力四無所畏十八佛不共法大慈大悲相好莊嚴等無邊功德以上是聖法煩惱法業因緣感報法是五趣流轉的凡夫法凡聖迷悟這不同層次的一切法都是如化的幻化是似有而空的空不是什麼都沒有如大智度論說空不以不見為空以其無實用故言空幻化是似有而空的空是無實而不礙有的說一切法空一切法如幻化是說明的觀點不同而不是內容的各別對立這想到了上面曾經說到過的般若經說十八空或十六空二十空而每一種空都是非常非壞滅何以故本性爾故從非常非壞知一切是空的是本性如此不是滅色而說空的這與論菩提心的因果相續非常而不滅是完全相同的所以在超越情見的實義中一切無二無別無名無相是眾生所不能理解的眾生處處取著依名著相形成無休止的生死苦迫為了破除眾生的執見所以說空無所有以表示實義空不是什麼都沒有為了解開眾生的迷著所以又說如幻化等方便的說如幻的就是空本性空本性空就是如幻如化的一切般若經中或說色即是空空即是色也就是幻不異色色不異幻或說一切不可說諸法空相中一切法不可得似乎說得不同所以印度傳來的如西藏所傳或許勝義諦現空雙聚名理成如幻及許勝義諦唯於現境斷絕戲論名極無所住如依中國佛學說理成如幻是空有無礙的中道極無所住是真空然統觀般若經義要在即一切法而超越一切不離一切法而畢竟空寂表示無生法忍的體悟這是有所得無所得平等是名無所得無二法無不二法即是道即是果平等法中無有戲論如以方便說相即而擬議圓融以方便說不可得而偏重空寂怕都可能違失聖道實踐的般若宗趣
