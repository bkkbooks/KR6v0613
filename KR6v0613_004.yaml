body:
  text: 第四章龍樹中道緣起與假名空性之統一一龍樹與龍樹論龍樹菩薩對空義有獨到的闡揚為學者所宗仰成為印度大乘的一大流在中國或推尊龍樹為大乘八宗的共祖印度佛教史上龍樹可說是釋尊以下的第一人但龍樹的傳記極為混亂主要是楞伽經中證得歡喜地往生極樂國的那位龍樹梵語應譯為龍叫龍名或龍猛與龍樹是根本不同的多氏印度佛教史說南方阿闍黎耶龍叫真實的名字是如來賢闡揚唯識中道是龍樹的弟子月稱的入中論引楞伽經又引大雲經說此離車子一切有情樂見童子於我滅度後滿四百年轉為苾芻其名曰龍廣宏我教法後於極淨光世界成佛這位本名一切有情樂見的也是龍名月稱誤以為中論的作者龍樹了與大雲經相當的曇無讖所譯的大方等無想經說一切眾生樂見梨車後時復名眾生樂見是大菩薩大香象王常為一切恭敬供養尊重讚嘆大香象的象就是龍或譯龍象為一切尊重讚歎也與楞伽經的吉祥大名稱相當這位龍叫弘法於西元三二旃陀羅崛多時代顯然是遲於龍樹的傳說為龍樹弟子那時候進入後期大乘如來藏佛性思想大大的流傳起來鳩摩羅什譯出的龍樹菩薩傳關於龍樹出家修學弘法的過程這樣說入山詣一佛塔出家受戒九十日中誦三藏盡更求異經都無得處遂入雪山山中有塔塔中有一老比丘以摩訶衍經典與之欲立師教戒更造衣服令附佛法而有小異大龍菩薩接之入海於宮殿中開七寶藏發七寶華函以諸方等深奧經典無量妙法授之龍樹受讀九十日中通解甚多龍樹既得諸經一相深入無生二忍具足龍還送出於南天竺大弘佛法去此世以來至今始過百歲南天竺諸國為其立廟敬奉如佛龍樹青年出家時佛像初興佛的舍利塔代表三寶之一的佛為寺院的主要部分大乘行者總稱佛塔及附屬的精舍為塔聲聞行者總稱為精舍僧伽藍其實是一樣的所以龍樹在佛塔出家就是在寺院中出家出家都是在聲聞佛教的各部派寺院中出家所以先讀聲聞乘的三藏其後又在雪山的某一佛寺中讀到了大乘經典雪山有大雪山小雪山都在印度西北初期大乘是興起於南方而大盛於北方的北方的大乘教區是以烏仗那山陵地帶為中心而向東西山地延伸的向南而到犍陀羅小品般若經說後五百歲時般若波羅蜜當廣流布北方晚出的薩陀波崙求法故事眾香城就是犍陀羅眾香城主深入大乘書寫般若經恭敬供養可看出大乘在北方的盛況龍樹在雪山佛寺中讀到大乘經是可以論定為史實的龍樹有立師教戒更造衣服的企圖我以為問題是大乘佛教雖離傳統的聲聞佛教獨立開展但重法而輕律儀所以大乘的出家者還是在部派中出家受戒離不開聲聞佛教的傳統這是龍樹想別立大乘僧團的問題所在可能為了避免諍執或被責為叛離佛教這一企圖終於沒有實現在傳說中說他有慢心那是不知佛教實況的誤會龍樹入龍宮取經傳說極為普遍龍樹在龍宮中讀到更多的大乘經得諸經一相一相或作一箱所得的經典傳說與華嚴經有關我曾有龍樹龍宮取經考論證為龍樹取經處在烏荼今奧里薩地方這裡在大海邊傳說是婆樓那龍王往來的地方這裡有神奇的塔傳說是龍樹從龍宮得來的這裡是華嚴經入法界品善財童子的故鄉有古塔廟所以龍樹於龍宮得經應有事實的成分極可能是從龍王的祠廟中得來的後來龍叫七次入海的傳說也只是這一傳說的誇張烏荼在東南印度當時屬於安達羅的娑多婆訶王朝龍樹在南印度弘法受到娑多婆訶王朝某王的護持漢譯有龍樹菩薩勸誡王頌共有三種譯本名為親友書就是寄給娑多婆訶國王的依多氏印度佛教史龍樹也在中印度弘法從龍樹在雪山區佛寺中研讀大乘對北方也不能說沒有影響總之龍樹弘法的影響是遍及全印度的依大唐西域記龍樹晚年住在國都西南的跋羅末羅山也就在此山去世龍樹菩薩傳說去此世以來始過百歲依此可約略推見龍樹在世的年代傳是鳩摩羅什於西元五世紀初所譯的羅什二十歲以前學得龍樹學系的中百十二門論二十歲以後長住在龜茲前秦建元十八年九月苻堅遣驍騎將軍呂光西伐龜茲及烏耆龜茲被攻破羅什也就離龜茲到東方來建元十八年為西元三八二年龍樹傳的成立一定在三八二年以前那時龍樹去世始過百年已有一百零年了所以在世的時代約略為西元一五二五年這是很壽長了後來傳說六百歲等那只是便於那些後代學者自稱親從龍樹受學而已龍樹的著作據龍樹傳說廣明摩訶衍作優波提舍十萬偈又作莊嚴佛道論五千偈大慈方便論五千偈中論五百偈令摩訶衍教大行於天竺又造無畏論十萬偈中論出其中西藏所傳中論釋有無畏論或說是龍樹的自釋造無畏論十萬偈中論出其中就是依此傳說而來的龍樹壽很高大乘佛教由此而大大的發揚有不少著作論理是當然的現依漢譯者略說龍樹的論著可分為三類一西藏傳譯有中論頌六十頌如理論七十空性論迴諍論大乘破有論稱為五正理聚漢譯與之相當的中論頌釋有鳩摩羅什所譯的青目釋中論唐波羅頗迦羅蜜多羅所譯分別明清辨所造的般若燈論趙宋惟淨所譯的安慧所造的大乘中觀釋論三部後魏毘目智仙與瞿曇般若流支共譯的迴諍論宋施護所譯的六十頌如理論及大乘破有論七十空性論法尊於民國三十三年在四川漢藏教理院譯出這五部都是抉擇甚深義的鳩摩羅什所譯的十二門論瞿曇般若流支譯的壹輸盧迦論都屬於抉擇甚深義的一類二屬於菩薩廣大行的有三部大智度論鳩摩羅什譯為中本般若經的釋論僧叡序說有十萬偈三分除二得此百卷論的後記說論初品三十四卷解釋第一品是全論具本二品以下法師略之若盡出之將十倍於此這部般若經的釋論是十萬偈的廣論現存的是略譯有的說這就是龍樹菩薩傳所說廣明摩訶衍作優波提舍十萬偈十住毘婆沙論鳩摩羅什譯這是十地經華嚴經十地品的釋論共一七卷僅釋初二地此論是依十地經的偈頌而廣為解說的菩提資糧論本頌是龍樹造隋達摩笈多譯三唐義淨譯的龍樹菩薩勸誡王頌異譯有宋僧伽跋摩的勸發諸王要偈宋求那跋摩的龍樹菩薩為禪陀迦王說法要偈這是為在家信者說法有淺有深有事有理自成一例西藏所傳的是後期中興的龍樹學在佛教史上龍樹與弟子提婆以後龍樹學中衰進入後期大乘時代到西元四五世紀間與無著世親同時的僧護門下有佛護與清辨龍樹學這才又盛大起來後期的龍樹學以一切法皆空為了義說是一致的但論到世俗的安立不免是各說各的如佛護的弟子月稱是隨順說一切有部的清辨是隨順經部的後起的寂護是隨順大乘瑜伽的世俗安立的自由擇取可說適應的不同也表示了無所適從這由於後期的龍樹學者只知龍樹所造的中論等五正理聚但五正理聚抉擇甚深空義而略於世俗的安立龍樹為大乘行者抉擇甚深空義難道沒有論菩薩廣大行嗎西元四五世紀間由鳩摩羅什傳來的有般若經二萬二千頌本的釋論大智度論華嚴經十地品的釋論十住毘婆沙論這兩部龍樹論是在甚深義的基石上明菩薩廣大行對於境行果都有所解說特別是聲聞與菩薩的同異龍樹曾在北方修學大智度論說到聲聞學派特重於說一切有系龍樹學與北方聲聞及大乘般若佛教的關係極深宏傳於北方很早就經西域而傳入我國北印度的佛教漸漸的衰了後起的佛護清辨生於南方在中印度學得中觀學又弘傳於南方這所以西藏所傳的後期中觀學竟不知道大智度論等世俗安立也就不免無所適從了近代的部分學者由於西藏沒有大智度論月稱清辨等沒有說到大智度論等而大智度論論文也有幾處可疑因此說大智度論不是龍樹造的我以為簡譯全書為三分之一的大智度論是一部十萬偈的大論大智度論的體例如僧叡序所說其為論也初辭擬之必標眾異以盡美卒成之終則舉無執以盡善這與大毘婆沙論的體例或即其殊辯或標之銓評非常近似這樣的大部論著列舉當時及以前的論義在流傳中自不免有增補的成分與大毘婆沙論的集成一樣如摭拾幾點就懷疑全部不是龍樹論違反千百年來的成說那未免太輕率了無論如何這是早期的龍樹學二中論與阿含經論書有釋經論宗經論釋經論是依經文次第解說的有的以為如來應機說法所集的經不一定是一會說的所以不妨說了再說也不妨或淺或深有的以為如來是一切智人說法是不會重複的所以特重先後次第大智度論與十住毘婆沙論是釋經論而屬於前一類型的有南方重經師的風格與重論師所作的經釋如無著的釋經論體裁不同宗經論是依一經或多經而論究法義有阿毘達磨傳統的都是深思密察審決法義似乎非此不可中論是宗經論但重在抉擇深義其實論書還有觀行論一類以觀行止觀為主中論二十七品每品都稱為觀所以古稱中論為中觀如僧肇物不遷論說中觀云觀方知彼去去者不至方中論是宗經論以觀行為旨趣而不是注重思辨的龍樹所學綜貫南北大小而表現出獨到的立場現在論究龍樹的空義以中論為主這是後期中觀學者所共通的以大智度論等為助說明中論所沒有詳論的問題中論開宗明義是不生亦不滅不常亦不斷不一亦不異不來亦不出能說是因緣善滅諸戲論中論所要論的是因緣新譯為緣起是八不的緣起八不的緣起就是中道八不緣起的含義可說與般若經相同而以緣起為論題以八不來闡明卻不是般若經的我以為中論是阿含經的通論是通論阿含經的根本思想抉擇阿含經的本意所在中論確是以大乘學者的立場確認緣起空中道為佛法的根本深義抉發阿含的緣起深義將佛法的正見確樹於緣起中道的磐石這一理解我曾廣為引證但有些人總覺得中論是依般若經造的這也難怪印度論師順中論般若燈論等已就是這樣說了我也不是說中論與般若經無關而是說龍樹本著般若法門的深悟不如有些大乘學者以為大乘別有法源而肯定為佛法同一本源不過一般聲聞學者偏重事相的分別失去了佛說的深義所以就阿含經所說的引起部派異執的一一加以遮破而顯出阿含經的深義也就通於般若的深義從前所論證過的現在再敘述一下一中論的歸敬頌明八不的緣起緣起是佛法不共外道的特色緣起是離二邊的中道說緣起而名為中論是阿含而不是般若中道中不常不斷的中道如雜阿含經說自作自覺受則墮常見他作他覺受則墮斷見義說法說離此二邊處於中道而說法所謂此有故彼有此起故彼起不一不異的中道如雜阿含經說若見言命即是身彼梵行者所無有若復見言命異身異梵行者所無有於此二邊心所不隨正向中道賢聖出世如實不顛倒正見謂緣生老死緣無明故有行不來不出的中道如雜阿含經說眼生時無有來處滅時無有去處除俗數法俗數法者謂此有故彼有此起故彼起中道的不生不滅阿含經約無為涅槃說涅槃是苦的止息寂滅在阿含經中是依緣起的此無故彼無此滅故彼滅而闡明的以八不說明中道的緣起說淵源於雜阿含經說是不庸懷疑的二中論所引證的佛說多出於阿含經觀本際品說大聖之所說本際不可得出於雜阿含經說無始生死長夜輪迴不知苦之本際無始生死的經說龍樹引歸何故而戲論謂有生老死的空義觀行品說如佛經所說虛誑妄取相以有為諸行由妄取而成的虛誑妄以涅槃為不虛誑龍樹解說為佛說如是事欲以示空義觀有無品說佛能滅有無於化迦旃延經中之所說離有亦離無此出於雜阿含經說世間有二種依若有若無世間集如實正知見若世間無者不有離無世間滅如實正知見若世間有者無有離有是名離於二邊說於中道離有無二邊的緣起中道為中論重要的教證觀四諦品說世尊知是法甚深微妙相非鈍根所及是故不欲說這如增壹阿含經說我今甚深之法難曉難了難可覺知設吾與人說妙法者人不信受亦不奉行我今宜可默然何須說法各部廣律在梵天請法前也有此不欲說法的記錄觀四諦品說是故經中說若見因緣法則為能見佛見苦集滅道如稻芉經說見緣起即見法四諦如中阿含經象跡喻經說觀涅槃品說如佛經中說斷有斷非有這是雜阿含經說盡離欲滅息沒已有亦不應說無亦不應說離諸虛偽戲論得般涅槃此則佛說三中論凡二十七品青目釋以為前二十五品以摩訶衍說第一義道後二品說聲聞法入第一義道無畏論也這樣說然依上文所說緣起中道的八不文證及多引阿含經說我不能同意這樣的判別中論所觀所論的沒有大乘法的術語如菩提心六波羅蜜十地莊嚴佛土等而是阿含及阿毘達磨的法義中論是依四諦次第的只是經大乘行者的觀察抉發阿含經的深義與大乘深義相契合而已這不妨略為分析一觀因緣品觀緣起的集無所生觀去來品觀緣起的滅無所去這二品觀緣起的不生不滅不來不去總觀八不的始終以下別觀二觀六情品觀五陰品觀六種界品即觀六處五蘊六界論究世間苦的中道三觀染染者品觀煩惱法觀三相品觀有為煩惱所為法的三相觀作作者品觀本住品觀燃可燃品明作者受者不可得與上二品合起來就是論究惑招生死作即受果的深義四觀本際品明生死本際不可得觀苦品明苦非自他共無因作而是依緣生觀行品明諸行的性空觀合品明三和合觸的無性觀有無品明緣起法非有非無觀縛解品從生死流轉說到還滅從生死繫縛說到解脫觀業品更是生死相續的要事從觀染染者品以來共十二品論究世間集的中道五觀法品明知法入法的現觀六觀時品觀因果品觀成壞品明三世因果與得失是有關修證的重要論題七觀如來品明創覺正法者八觀顛倒品觀三毒染淨四倒的無性觀四諦品明所悟的諦理觀涅槃品觀涅槃無為無受的真義從觀法品到此論究世間集滅的中道九觀十二因緣品正觀緣起觀邪見品遠離邪見這二品論究世間滅道的中道中論與阿含經的關係明確可見但阿含說空沒有中論那樣的明顯沒有明說一切法空說種種空說一切法空的是初期大乘的般若經般若經說空主要是佛法的甚深義是不退菩薩所悟入的也是聲聞聖者所共的阿含經說法的方便與般若經有差別但以空寂無戲論為歸趣也就是學佛者的究極理想不可說是有差別的龍樹的時代佛法因不斷發展而已分化成眾多部派部派間異見紛紜莫衷一是中論說若人說有我諸法各異相當知如是人不得佛法味淺智見諸法若有若無相是則不能見滅見安隱法聲聞各部派或說有我有法或說我無法有或說一切法有或說部分有而部分無這樣的異見紛紜與阿含經義大有距離了所以中論引用阿含經說抉擇遮破各部派及外道的妄執顯示佛法的如實義如第十八觀法品法是聖者所覺證的觀法品從觀無我我所而契入寂滅正是阿含經義品末說不一亦不異不常亦不斷是名諸世尊教化甘露味若佛不出世佛法已滅盡諸辟支佛智從於遠離生上一偈總結聲聞法下一偈是出於無佛世的辟支佛二乘聖者都是這樣悟入法性的所以或以為前二十五品明大乘第一義後二品明聲聞第一義是我所不能贊同的又如第二十四觀四諦品說以有空義故一切法得成若無空義者一切則不成依空而能成立的一切法出世法是四諦法四果僧佛也就是三寶世間法是生死的罪福業報總之依阿含經說遮破異義顯示佛說的真義確是中論的立場當然這不是說與大乘無關而是說中論闡明的一切法空為一切佛法的如實義通於二乘如要論究大乘這就是大乘的如實義依此而廣明大乘行證所以龍樹本著大乘的深見抉擇阿含經及阿毘達磨論義而貫通了阿含與般若等大乘經如佛法而確有通教的話中論可說是典型的佛法通論了三中論之中心思想中論所要闡明的是中道的緣起論初的歸敬偈就充分的表示了如說不生亦不滅不常亦不斷不一亦不異不來亦不出能說是因緣緣起善滅諸戲論我稽首禮佛諸說中第一佛所開示的教法在世間一切學說中是最上第一的佛說的所以最上第一不是別的是佛說的因緣緣起說佛依緣起說法能離一切戲論而寂滅這是不共世間學的所以說能說是因緣善滅諸戲論緣起為佛法宗要是各部派所公認的但解說不一龍樹所要闡揚的是不生不滅等八不的緣起也就是中道的緣起雜阿含經所說處中說法宣說中道就是不落二邊一見異見常見斷見等的緣起闡明不落二邊的緣起所以名為中論中道的緣起說為佛法宗要闡明這一要義龍樹是通過空義而顯揚出來的如說由一切諸法自性皆是空諸法是緣起無等如來說諸說空緣起中道為一義無等第一語敬禮如是佛是七十空性論明一切法是空一切法是緣起是迴諍論列舉了空緣起中道三名而表示為同一內容這兩部龍樹論都表示了空與緣起的關係說得更完備的如中論卷四大正三三三中說眾因緣生法我說即是空亦為是假名亦是中道義未曾有一法不從因緣生是故一切法無不是空者緣起法為什麼是離二邊的中道因為緣起法是空的在阿含經中空是無我我所也就是離我見我所見的假名施設雖也是阿含經所說過的但顯然由於部派的論究而發展為了般若經的一切但是假名所以中論將緣起空假名中道統一起來不過龍樹學的宗要說空說假名而重點還是中道的緣起說空以離一切見為主與離二邊見的中道相同所以在緣起即空即假即中道下接著說未曾有一法不從因緣生是故一切法無不是空者結歸於一切空也就是歸於中道龍樹依中道的緣起說論破當時各部派及外道的異見著重離見的空中道正是阿含與般若經義如來說法宗趣在此所以中論結讚說瞿曇大聖主憐愍說是法悉斷一切見我今稽首禮以下依緣起假名空中道一一的分別加以論究四緣起八不緣起中論依緣起而明即空的中道空是離諸見的下本般若確是這樣說的以空法住般若波羅蜜不應住色若常若無常若苦若樂若淨若不淨若我若無我若空若不空受等同此說但經文說空多約涅槃超越說或但名虛妄無實說依緣起說中道下本般若末後才說到如小品般若波羅蜜經卷九大正八五七八下說須菩提般若波羅蜜無盡如虛空無盡故般若波羅蜜無盡色無盡故是生般若波羅蜜受想行識無盡故是生般若波羅蜜須菩提菩薩坐道場時如是觀十二因緣離於二邊是為菩薩不共之法阿含經說佛是順逆觀十二緣起而成佛的下本般若末後正是說明菩薩坐道場得一切智智的般若正觀不落二邊中道的緣起般若經說是如虛空不可盡但如虛空不可盡經上也約五蘊十二處等說所以不能說是以緣起來闡明中道因為在般若經的歷法明空中緣起與蘊處界諦道品等一樣只是種種法門的一門而已中道的緣起說出於雜阿含經阿含經是以因緣來明一切法作為修行解脫的正見經中的用語並不統一或說因或說緣或雙舉因緣如說二因二緣起於正見或說四名何因何集何生何轉生起義這些名詞是同一意義的異名當然名字不同在文字學者解說起來也自有不同的意義因緣原是極複雜的所以佛弟子依經義而成立種種因緣說如南傳赤銅鍱部發趣論的二十四緣流行印度本土的分別說系舍利弗阿毘曇論的十因十緣說一切有部發智論的六因四緣大眾部也立先生無有等諸緣在不同安立的種種緣中因緣次第緣所緣緣增上緣四緣最為先要也是般若經與龍樹論所說的此外雜阿含經提到了緣起與緣生或譯緣所生緣已生同時提出而分別解說當然是有不同意義的如阿毘達磨法蘊足論卷一一引經大正二六五五上說云何緣起謂依此有故彼有此生故彼生謂無明緣行如是便集純大苦蘊苾芻當知生緣老死若佛出世若不出世如是緣起法住法界乃至無明緣行應知亦爾云何名為緣已生法謂無明行識名色六處觸受愛取有生老死如是名為緣已生法苾芻當知老死是無常是有為是所造作是緣已生盡法沒法離法滅法生無明亦爾緣起與緣生同樣的是無明行等十二支而意義卻顯然不同緣生法是無常滅盡的有為法是緣已生從緣所生的果法而緣起是佛出世也如此佛不出世也如此的法住法界是形容緣起的相應部經作法定法住即緣性緣性或譯為相依性法蘊足論所引經下文還說到此中所有法性法定法理法趣是真是實是諦是如非妄非虛非倒非異這些緣起的形容詞使大眾部一分及化地部等說緣起是無為舍利弗阿毘曇論也這樣說這是離開因果事相而論定為永恒不變的抽象理性然依雜阿含經佛為須深所說緣起應該是不能說是無為的雜阿含經卷一四大正二九七中下說須深於意云何有生故有老死不離生有老死耶須深答曰如是世尊有生故有老死不離生有老死如是生有無明故有行不離無明而有行耶須深白佛如是世尊有無明故有行不離無明而有行佛告須深無生故無老死不離生滅而老死滅耶須深白佛言如是世尊無生故無老死不離生滅而老死滅如是乃至無無明故無行不離無明滅而行滅耶須深白佛如是世尊無無明故無行不離無明滅而行滅佛告須深作如是知如是見者為有離欲惡不善法乃至身作證具足住不須深白佛不也世尊佛告須深是名先知法住後知涅槃須深出家不久聽見有些比丘們說生死已盡自知不受後有卻不得禪定是慧解脫阿羅漢須深聽了非常疑惑佛告訴他彼先知法住後知涅槃慧解脫阿羅漢沒有深定所以沒有見法涅槃的體驗但正確而深刻的知道有無明故有行不離無明而有行無無明故無行不離無明滅而行滅餘支例此這是正見依緣起滅的確定性法住智而能得無明滅故行滅生滅故老死滅的果證這樣的緣起依緣而有無生滅的法住性怎能說是無為呢又如長阿含的大緣方便經說一切有部編入中阿含名大因經也就是長部的大緣經經文說明緣起甚深而被稱為尼陀那尼陀那就是為因為集為生為轉的因從這些看來緣起是不能說為無為的所以說一切有部等不許有別法體名為緣起湛然常住而是無明決定是諸行因諸行決定是無明果如經中說緣起是法住法住是安住的確立而不可改易的緣起是法定法定是決定而不亂的緣起是法界界是因性緣性這樣緣起與緣生都是有為法差別在緣起約因性說緣生約果法說緣起是有為在世俗的說明中龍樹論顯然是與說一切有部相同的依我的理解如來或說因或說緣等只是說明依因緣而有及生也就依因緣而無及滅從依緣起滅闡明生死集起與還滅解脫的定律如馬勝為舍利弗說偈諸法從緣起如來說是因彼法因緣盡是大沙門說諸法從緣起四分律作若法所因生與赤銅鍱部律相合五分律作法從緣生智度論譯為