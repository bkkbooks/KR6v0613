body:
  text: 第四章龍樹中道緣起與假名空性之統一一龍樹與龍樹論龍樹菩薩對空義有獨到的闡揚為學者所宗仰成為印度大乘的一大流在中國或推尊龍樹為大乘八宗的共祖印度佛教史上龍樹可説是釋尊以下的第一人但龍樹的傳記極為混亂主要是楞伽經中證得歡喜地往生極樂國的那位龍樹梵語應譯為龍叫龍名或龍猛與龍樹是根本不同的多氏印度佛教史説南方阿闍黎耶龍叫真實的名字是如來賢闡揚唯識中道是龍樹的弟子月稱的入中論引楞伽經又引大雲經説此離車子一切有情樂見童子於我滅度後滿四百年轉為苾芻其名曰龍廣宏我教法後於極淨光世界成佛這位本名一切有情樂見的也是龍名月稱誤以為中論的作者龍樹了與大雲經相當的曇無讖所譯的大方等無想經説一切衆生樂見梨車後時復名衆生樂見是大菩薩大香象王常為一切恭敬供養尊重讚嘆大香象的象就是龍或譯龍象為一切尊重讚歎也與楞伽經的吉祥大名稱相當這位龍叫弘法於西元三二旃陀羅崛多時代顯然是遲於龍樹的傳説為龍樹弟子那時候進入後期大乘如來藏佛性思想大大的流傳起來鳩摩羅什譯出的龍樹菩薩傳關於龍樹出家修學弘法的過程這樣説入山詣一佛塔出家受戒九十日中誦三藏盡更求異經都無得處遂入雪山山中有塔塔中有一老比丘以摩訶衍經典與之欲立師教戒更造衣服令附佛法而有小異大龍菩薩接之入海於宮殿中開七寶藏發七寶華函以諸方等深奧經典無量妙法授之龍樹受讀九十日中通解甚多龍樹既得諸經一相深入無生二忍具足龍還送出於南天竺大弘佛法去此世以來至今始過百歲南天竺諸國為其立廟敬奉如佛龍樹青年出家時佛像初興佛的舍利塔代表三寶之一的佛為寺院的主要部分大乘行者總稱佛塔及附屬的精舍為塔聲聞行者總稱為精舍僧伽藍其實是一樣的所以龍樹在佛塔出家就是在寺院中出家出家都是在聲聞佛教的各部派寺院中出家所以先讀聲聞乘的三藏其後又在雪山的某一佛寺中讀到了大乘經典雪山有大雪山小雪山都在印度西北初期大乘是興起於南方而大盛於北方的北方的大乘教區是以烏仗那山陵地帶為中心而向東西山地延伸的向南而到犍陀羅小品般若經説後五百歲時般若波羅蜜當廣流布北方晚出的薩陀波崙求法故事衆香城就是犍陀羅衆香城主深入大乘書寫般若經恭敬供養可看出大乘在北方的盛況龍樹在雪山佛寺中讀到大乘經是可以論定為史實的龍樹有立師教戒更造衣服的企圖我以為問題是大乘佛教雖離傳統的聲聞佛教獨立開展但重法而輕律儀所以大乘的出家者還是在部派中出家受戒離不開聲聞佛教的傳統這是龍樹想別立大乘僧團的問題所在可能為了避免諍執或被責為叛離佛教這一企圖終於沒有實現在傳説中説他有慢心那是不知佛教實況的誤會龍樹入龍宮取經傳説極為普遍龍樹在龍宮中讀到更多的大乘經得諸經一相一相或作一箱所得的經典傳説與華嚴經有關我曾有龍樹龍宮取經考論證為龍樹取經處在烏荼今奧里薩地方這裡在大海邊傳説是婆樓那龍王往來的地方這裡有神奇的塔傳説是龍樹從龍宮得來的這裡是華嚴經入法界品善財童子的故鄉有古塔廟所以龍樹於龍宮得經應有事實的成分極可能是從龍王的祠廟中得來的後來龍叫七次入海的傳説也只是這一傳説的誇張烏荼在東南印度當時屬於安達羅的娑多婆訶王朝龍樹在南印度弘法受到娑多婆訶王朝某王的護持漢譯有龍樹菩薩勸誡王頌共有三種譯本名為親友書就是寄給娑多婆訶國王的依多氏印度佛教史龍樹也在中印度弘法從龍樹在雪山區佛寺中研讀大乘對北方也不能説沒有影響總之龍樹弘法的影響是遍及全印度的依大唐西域記龍樹晚年住在國都西南的跋羅末羅山也就在此山去世龍樹菩薩傳説去此世以來始過百歲依此可約略推見龍樹在世的年代傳是鳩摩羅什於西元五世紀初所譯的羅什二十歲以前學得龍樹學系的中百十二門論二十歲以後長住在龜茲前秦建元十八年九月苻堅遣驍騎將軍呂光西伐龜茲及烏耆龜茲被攻破羅什也就離龜茲到東方來建元十八年為西元三八二年龍樹傳的成立一定在三八二年以前那時龍樹去世始過百年已有一百零年了所以在世的時代約略為西元一五二五年這是很壽長了後來傳説六百歲等那只是便於那些後代學者自稱親從龍樹受學而已龍樹的著作據龍樹傳説廣明摩訶衍作優波提舍十萬偈又作莊嚴佛道論五千偈大慈方便論五千偈中論五百偈令摩訶衍教大行於天竺又造無畏論十萬偈中論出其中西藏所傳中論釋有無畏論或説是龍樹的自釋造無畏論十萬偈中論出其中就是依此傳説而來的龍樹壽很高大乘佛教由此而大大的發揚有不少著作論理是當然的現依漢譯者略説龍樹的論著可分為三類一西藏傳譯有中論頌六十頌如理論七十空性論回諍論大乘破有論稱為五正理聚漢譯與之相當的中論頌釋有鳩摩羅什所譯的青目釋中論唐波羅頗迦羅蜜多羅所譯分別明清辨所造的般若燈論趙宋惟淨所譯的安慧所造的大乘中觀釋論三部後魏毗目智仙與瞿曇般若流支共譯的回諍論宋施護所譯的六十頌如理論及大乘破有論七十空性論法尊於民國三十三年在四川漢藏教理院譯出這五部都是抉擇甚深義的鳩摩羅什所譯的十二門論瞿曇般若流支譯的一輸盧迦論都屬於抉擇甚深義的一類二屬於菩薩廣大行的有三部大智度論鳩摩羅什譯為中本般若經的釋論僧睿序説有十萬偈三分除二得此百卷論的後記説論初品三十四卷解釋第一品是全論具本二品以下法師略之若盡出之將十倍於此這部般若經的釋論是十萬偈的廣論現存的是略譯有的説這就是龍樹菩薩傳所説廣明摩訶衍作優波提舍十萬偈十住毗婆沙論鳩摩羅什譯這是十地經華嚴經十地品的釋論共一七卷僅釋初二地此論是依十地經的偈頌而廣為解説的菩提資糧論本頌是龍樹造隋達摩笈多譯三唐義淨譯的龍樹菩薩勸誡王頌異譯有宋僧伽跋摩的勸發諸王要偈宋求那跋摩的龍樹菩薩為禪陀迦王説法要偈這是為在家信者説法有淺有深有事有理自成一例西藏所傳的是後期中興的龍樹學在佛教史上龍樹與弟子提婆以後龍樹學中衰進入後期大乘時代到西元四五世紀間與無著世親同時的僧護門下有佛護與清辨龍樹學這才又盛大起來後期的龍樹學以一切法皆空為了義説是一致的但論到世俗的安立不免是各説各的如佛護的弟子月稱是隨順説一切有部的清辨是隨順經部的後起的寂護是隨順大乘瑜伽的世俗安立的自由擇取可説適應的不同也表示了無所適從這由於後期的龍樹學者只知龍樹所造的中論等五正理聚但五正理聚抉擇甚深空義而略於世俗的安立龍樹為大乘行者抉擇甚深空義難道沒有論菩薩廣大行嗎西元四五世紀間由鳩摩羅什傳來的有般若經二萬二千頌本的釋論大智度論華嚴經十地品的釋論十住毗婆沙論這兩部龍樹論是在甚深義的基石上明菩薩廣大行對於境行果都有所解説特別是聲聞與菩薩的同異龍樹曾在北方修學大智度論説到聲聞學派特重於説一切有系龍樹學與北方聲聞及大乘般若佛教的關係極深宏傳於北方很早就經西域而傳入我國北印度的佛教漸漸的衰了後起的佛護清辨生於南方在中印度學得中觀學又弘傳於南方這所以西藏所傳的後期中觀學竟不知道大智度論等世俗安立也就不免無所適從了近代的部分學者由於西藏沒有大智度論月稱清辨等沒有説到大智度論等而大智度論論文也有幾處可疑因此説大智度論不是龍樹造的我以為簡譯全書為三分之一的大智度論是一部十萬偈的大論大智度論的體例如僧睿序所説其為論也初辭擬之必標衆異以盡美卒成之終則舉無執以盡善這與大毗婆沙論的體例或即其殊辨或標之銓評非常近似這樣的大部論著列舉當時及以前的論義在流傳中自不免有增補的成分與大毗婆沙論的集成一樣如托拾幾點就懷疑全部不是龍樹論違反千百年來的成説那未免太輕率了無論如何這是早期的龍樹學二中論與阿含經論書有釋經論宗經論釋經論是依經文次第解説的有的以為如來應機説法所集的經不一定是一會説的所以不妨説了再説也不妨或淺或深有的以為如來是一切智人説法是不會重復的所以特重先後次第大智度論與十住毗婆沙論是釋經論而屬於前一類型的有南方重經師的風格與重論師所作的經釋如無著的釋經論體裁不同宗經論是依一經或多經而論究法義有阿毗達磨傳統的都是深思密察審決法義似乎非此不可中論是宗經論但重在抉擇深義其實論書還有觀行論一類以觀行止觀為主中論二十七品每品都稱為觀所以古稱中論為中觀如僧肇物不遷論説中觀云觀方知彼去去者不至方中論是宗經論以觀行為旨趣而不是注重思辨的龍樹所學綜貫南北大小而表現出獨到的立場現在論究龍樹的空義以中論為主這是後期中觀學者所共通的以大智度論等為助説明中論所沒有詳論的問題中論開宗明義是不生亦不滅不常亦不斷不一亦不異不來亦不出能説是因緣善滅諸戲論中論所要論的是因緣新譯為緣起是八不的緣起八不的緣起就是中道八不緣起的含義可説與般若經相同而以緣起為論題以八不來闡明卻不是般若經的我以為中論是阿含經的通論是通論阿含經的根本思想抉擇阿含經的本意所在中論確是以大乘學者的立場確認緣起空中道為佛法的根本深義抉發阿含的緣起深義將佛法的正見確樹於緣起中道的磐石這一理解我曾廣為引證但有些人總覺得中論是依般若經造的這也難怪印度論師順中論般若燈論等已就是這樣説了我也不是説中論與般若經無關而是説龍樹本著般若法門的深悟不如有些大乘學者以為大乘別有法源而肯定為佛法同一本源不過一般聲聞學者偏重事相的分別失去了佛説的深義所以就阿含經所説的引起部派異執的一一加以遮破而顯出阿含經的深義也就通於般若的深義從前所論證過的現在再敘述一下一中論的歸敬頌明八不的緣起緣起是佛法不共外道的特色緣起是離二邊的中道説緣起而名為中論是阿含而不是般若中道中不常不斷的中道如雜阿含經説自作自覺受則墮常見他作他覺受則墮斷見義説法説離此二邊處於中道而説法所謂此有故彼有此起故彼起不一不異的中道如雜阿含經説若見言命即是身彼梵行者所無有若復見言命異身異梵行者所無有於此二邊心所不隨正向中道賢聖出世如實不顛倒正見謂緣生老死緣無明故有行不來不出的中道如雜阿含經説眼生時無有來處滅時無有去處除俗數法俗數法者謂此有故彼有此起故彼起中道的不生不滅阿含經約無為涅槃説涅槃是苦的止息寂滅在阿含經中是依緣起的此無故彼無此滅故彼滅而闡明的以八不説明中道的緣起説淵源於雜阿含經説是不庸懷疑的二中論所引證的佛説多出於阿含經觀本際品説大聖之所説本際不可得出於雜阿含經説無始生死長夜輪回不知苦之本際無始生死的經説龍樹引歸何故而戲論謂有生老死