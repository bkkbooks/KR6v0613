起法為什麼是離二邊的中道因為緣起法是空的在阿含經中空是無我我所也就是離我見我所見的假名施設雖也是阿含經所説過的但顯然由於部派的論究而發展為了般若經的一切但是假名所以中論將緣起空假名中道統一起來不過龍樹學的宗要説空説假名而重點還是中道的緣起説空以離一切見為主與離二邊見的中道相同所以在緣起即空即假即中道下接著説未曾有一法不從因緣生是故一切法無不是空者結歸於一切空也就是歸於中道龍樹依中道的緣起説論破當時各部派及外道的異見著重離見的空中道正是阿含與般若經義如來説法宗趣在此所以中論結讚説瞿曇大聖主憐愍説是法悉斷一切見我今稽首禮以下依緣起假名空中道一一的分別加以論究四緣起八不緣起中論依緣起而明即空的中道空是離諸見的下本般若確是這樣説的以空法住般若波羅蜜不應住色若常若無常若苦若樂若淨若不淨若我若無我若空若不空受等同此説但經文説空多約涅槃超越説或但名虛妄無實説依緣起説中道下本般若末後才説到如小品般若波羅蜜經卷九大正八五七八下説須菩提般若波羅蜜無盡如虛空無盡故般若波羅蜜無盡色無盡故是生般若波羅蜜受想行識無盡故是生般若波羅蜜須菩提菩薩坐道場時如是觀十二因緣離於二邊是為菩薩不共之法阿含經説佛是順逆觀十二緣起而成佛的下本般若末後正是説明菩薩坐道場得一切智智的般若正觀不落二邊中道的緣起般若經説是如虛空不可盡但如虛空不可盡經上也約五蘊十二處等説所以不能説是以緣起來闡明中道因為在般若經的歷法明空中緣起與蘊處界諦道品等一樣只是種種法門的一門而已中道的緣起説出於雜阿含經阿含經是以因緣來明一切法作為修行解脫的正見經中的用語並不統一或説因或説緣或雙舉因緣如説二因二緣起於正見或説四名何因何集何生何轉生起義這些名詞是同一意義的異名當然名字不同在文字學者解説起來也自有不同的意義因緣原是極復雜的所以佛弟子依經義而成立種種因緣説如南傳赤銅鍱部發趣論的二十四緣流行印度本土的分別説系舍利弗阿毗曇論的十因十緣説一切有部發智論的六因四緣大衆部也立先生無有等諸緣在不同安立的種種緣中因緣次第緣所緣緣增上緣四緣最為先要也是般若經與龍樹論所説的此外雜阿含經提到了緣起與緣生或譯緣所生緣已生同時提出而分別解説當然是有不同意義的如阿毗達磨法蘊足論卷一一引經大正二六五五上説云何緣起謂依此有故彼有此生故彼生謂無明緣行如是便集純大苦蘊苾芻當知生緣老死若佛出世若不出世如是緣起法住法界乃至無明緣行應知亦爾云何名為緣已生法謂無明行識名色六處觸受愛取有生老死如是名為緣已生法苾芻當知老死是無常是有為是所造作是緣已生盡法沒法離法滅法生無明亦爾緣起與緣生同樣的是無明行等十二支而意義卻顯然不同緣生法是無常滅盡的有為法是緣已生從緣所生的果法而緣起是佛出世也如此佛不出世也如此的法住法界是形容緣起的相應部經作法定法住即緣性緣性或譯為相依性法蘊足論所引經下文還説到此中所有法性法定法理法趣是真是實是諦是如非妄非虛非倒非異這些緣起的形容詞使大衆部一分及化地部等説緣起是無為舍利弗阿毗曇論也這樣説這是離開因果事相而論定為永恆不變的抽象理性然依雜阿含經佛為須深所説緣起應該是不能説是無為的雜阿含經卷一四大正二九七中下説須深於意云何有生故有老死不離生有老死耶須深答曰如是世尊有生故有老死不離生有老死如是生有無明故有行不離無明而有行耶須深白佛如是世尊有無明故有行不離無明而有行佛告須深無生故無老死不離生滅而老死滅耶須深白佛言如是世尊無生故無老死不離生滅而老死滅如是乃至無無明故無行不離無明滅而行滅耶須深白佛如是世尊無無明故無行不離無明滅而行滅佛告須深作如是知如是見者為有離欲惡不善法乃至身作證具足住不須深白佛不也世尊佛告須深是名先知法住後知涅槃須深出家不久聽見有些比丘們説生死已盡自知不受後有卻不得禪定是慧解脫阿羅漢須深聽了非常疑惑佛告訴他彼先知法住後知涅槃慧解脫阿羅漢沒有深定所以沒有見法涅槃的體驗但正確而深刻的知道有無明故有行不離無明而有行無無明故無行不離無明滅而行滅餘支例此這是正見依緣起滅的確定性法住智而能得無明滅故行滅生滅故老死滅的果證這樣的緣起依緣而有無生滅的法住性怎能説是無為呢又如長阿含的大緣方便經説一切有部編入中阿含名大因經也就是長部的大緣經經文説明緣起甚深而被稱為尼陀那尼陀那就是為因為集為生為轉的因從這些看來緣起是不能説為無為的所以説一切有部等不許有別法體名為緣起湛然常住而是無明決定是諸行因諸行決定是無明果如經中説緣起是法住法住是安住的確立而不可改易的緣起是法定法定是決定而不亂的緣起是法界界是因性緣性這樣緣起與緣生都是有為法差別在緣起約因性説緣生約果法説緣起是有為在世俗的説明中龍樹論顯然是與説一切有部相同的依我的理解如來或説因或説緣等只是説明依因緣而有及生也就依因緣而無及滅從依緣起滅闡明生死集起與還滅解脫的定律如馬勝為舍利弗説偈諸法從緣起如來説是因彼法因緣盡是大沙門説諸法從緣起四分律作若法所因生與赤銅鍱部律相合五分律作法從緣生智度論譯為