道八不的緣起假名能成立世俗諦中世出世間一切法依中道緣起的八不空能不落諸見契如實義勝義所以中論最著名的一頌可表解如下自性空緣起法無自性八不中道假名有中本般若後分一再的說到二諦中論也是以二諦來說明佛法的如卷四大正三三二下三三上說諸佛依二諦為眾生說法一以世俗諦二第一義諦若不依俗諦不得第一義不得第一義則不得涅槃佛為眾生說法不能不安立二諦如沒有相對的二那就一切不可說了如世間眾生所知那樣的確實如此名為世俗諦諦是不顛倒的意思第一義諦勝義諦是聖者所知的真實義眾生世間所知雖然共知共見確實如此其實是迷惑顛倒所以生死不已求勝義的佛法是要於世間一切法離顛倒迷惑而通達實義這是安立二諦的根本意趣然第一義諦世間的名相虛妄分別是不能表達的所以說勝義諦如何如何還是依世俗諦方便說的如摩訶般若波羅蜜經說如是空性等相是深般若波羅蜜相佛為眾生用世間法故說非第一義若名字因緣和合無則世俗語言眾事都滅世諦無故第一義諦亦無世俗諦是眾生迷謬所知的雖是惑亂卻是重要的我們凡夫正是處在這一情境中呀所以要依止世俗諦才能表示第一義諦才能從勘破世俗迷妄中去通達勝義諦依中論的二諦來觀察龍樹最著名的一偈眾生迷妄所知的世俗諦佛說是緣起的依緣起而離邊見能正確的體見實義這就是中道但一般人部派佛教者不能如實地理解緣起到頭來總是陷入依實立假的窠臼不能自拔所以般若經說一切法是假名通達自性空寂這就是二諦說中論依緣起立論緣起法即空性顯第一義緣起即假名明世俗諦這樣的假有即性空性空也是依假名說不礙假有就是緣起離二邊的中道說緣起即空亦假亦中迴諍論說緣起空中道是同一內容而只是二諦說即空即假即中的三諦說不是龍樹論意引人轉迷向覺依世俗諦說法緣起無自性故空空故依緣起有中道說能善立一切法遠離一切見可說是非常善巧的教說不過世俗的名言是二是沒有決定性的名義內在的相對性在適應眾生隨時隨地而流行中不免會引起異議那也是世間常法依第一義諦空無生等只是一個符號並不等於第一義如空以離諸見為用著空也就不是中了所以說空亦復空空亦不可得而且在緣起即空的觀行中正如上引經文所說要隨時善巧的適得其中大智度論這樣說般若波羅蜜離二邊說中道雖空而不著空故為說罪福雖說罪福不生常邪見亦於空無礙菩薩住二諦中為眾生說法不但說空不但說有為愛著眾生故說空為取相著空眾生故說有有無中二處不染有相是一邊無相是一邊離是二邊行中道是諸法實相般若波羅蜜者是一切諸法實相常是一邊斷滅是一邊離是二邊行中道此般若波羅蜜是一邊此非般若波羅蜜是一邊離是二邊行中道是名般若波羅蜜是為眾生說中道說者說有而不生常等見說空而不著空對治眾生的偏執為著空者說有為著有者說空這樣才是善說中道是中道行在般若行中有相是一邊無相空也是一邊是般若與非般若的分別也都是一邊般若行是以不取著為原則的如心有取著即使是善行空行也都是邊而非中般若經稱之為順道法愛生譬喻為如雜毒食佛所開示的解脫道如空無所有無相阿含經早已指出觀無我我所無所有有的以慧得解脫染著的不得解脫就生在無所有處觀一切無相的有的以慧得解脫如染著而不得解脫就生在無想處非想非非想處原理與方法是有準則的但還是世俗的是否能善巧適中那真如中國所說運用之妙存乎一心了學者應注意佛法的實踐性不只是中論而更是中觀才得八如幻即空即假之緣起中論在論破異執後每舉譬喻來說明譬喻是佛法教化的一種方便摩訶般若經中說幻等十喻中論依般若經說幻化等譬喻是為了表示一切法是空無自性的如卷四大正三三一中說色聲香味觸及法體六種皆空如炎夢如乾闥婆城如是六種中何有淨不淨猶如幻化人亦如鏡中像色等六塵可總攝眾生所知的一切法在眾生心境中這一切似乎確實如此其實是虛誑顛倒而並非真是那樣的這是被譬喻為如陽燄如夢等的意趣這些譬喻是譬喻一切法空的在無始慣習的意識中雖多少知道虛假不實而總覺得假必依實依實立假對這些譬喻也會這樣的解說如幻化就分別為二幻化者與幻化事以為幻化事當然是虛假不實的而能幻化的幻化者不能說是沒有的所以對幻化喻就解說為幻化事境相是空無有實的能幻者心識是不空的般若經與龍樹卻不是這樣解說的如中論卷三大正三二三中下說如世尊神通所作變化人如是變化人復變作化人如初變化人是名為作者變化人所作是則名為業諸煩惱及業作者及果報皆如幻與夢如炎亦如響從變化人再起變化人的譬喻只是為了說明能幻化者與所幻化事一切都是幻化那樣幻化等譬喻是譬喻眾緣所生法的一切法是緣起的所以一切如幻化一切皆空空是無自性的也是假名有的所以一切法如幻化等不但是譬喻空的也譬喻世俗有大智度論卷六大正二五一一下一五下說是十喻為解空法故諸法相雖空亦有分別可見不可見譬如幻化象馬及種種諸物雖知無實然色可見聲可聞與六情相對不相錯亂諸法亦如是雖空而可見可聞不相錯亂諸法雖空而有分別有難解空有易解空今以幻化等易解空喻根境識等難解空有人知十喻是誑惑耳目法不知諸法空故以此十喻喻諸法若有人於十譬喻中心著不解種種難論以此為有是十譬喻不為其用應更為說餘法門幻化等譬喻表示一切法是無自性空的然在世俗諦中可見可聞是不會錯亂的世俗法中因果善惡邪正是歷然不亂的不壞世間法相在世間所知中知道有些是空無有實的如幻化等但有些卻不容易知道是空的所以說易解空十喻比喻難解的虛偽不實譬喻應該理解說譬喻者的意趣所在所以對那些以為沒有幻事而有幻者沒有夢境而有夢心有的以為夢境也是有的不過錯亂而已不能理會說譬喻者的用心專在語文上辨析問難譬喻也就無用了一切法如幻如化也有不如幻如化的嗎依經文可以這麼說不過是不了義的摩訶般若波羅蜜經卷二六大正八四一六上說佛告須菩提若有法生滅相者皆是變化若法無生無滅是非變化不誑相涅槃是法非變化諸法平等非聲聞作非辟支佛作非諸菩薩摩訶薩作非諸佛作有佛無佛諸法性常空性空即是涅槃若新發意菩薩聞是一切法畢竟性空乃至涅槃亦皆如化心則驚怖為是新發意菩薩故分別說生滅者如化不生不滅者不如化生滅法是如化的不生不滅是不如化的就是涅槃大乘法也有這樣說的那是為新學菩薩所說的不了義教如實的說一切法平等性法法如此的自性常空性空就是涅槃涅槃當然也是如化的小品般若經說一切法如幻如夢我說涅槃亦如幻如夢設復有法過於涅槃我亦說如幻如夢一切法性空一切法如幻是般若法門的究竟說大乘法中如對一切有為生滅法說無為自性無為自性與有為法異那也是為新學者所作的不了義說如摩訶般若波羅蜜經卷一大正八二九二中說云何有為諸法相云何名無為諸法相若法無生無滅無住無異無垢無淨無增無減諸法自性云何名諸法自性諸法無所有性是諸法自性是名無為諸法相這段經文分別有為法相性與無為法相性無為法性就是諸法自性有為法外別立的諸法自性不生不滅不垢不淨不增不減與入中論所立的勝義自性相當大智度論卷五九解說大正二五四八下為有為善法是行處無為法是依止處餘無記不善法以捨離故不說此是新發意菩薩所學若得般若波羅蜜方便力應無生忍則不愛行法不憎捨法不離有為法而有無為法是故不依止涅槃無為諸法自性佛為引導眾生依二諦說法說此說彼生死與涅槃有為與無為緣起與空性其實即有為為無為即生死為涅槃即緣起為空性中論所說只此無自性的如幻緣起即是空性即是假名為般若法門的究竟說中文索引一畫一一法是實有自性一切有情樂見童子一切去長老一切法一切法本不生滅一切法不可得一切法不受不著一切法本有寂滅性一切法本空一切法本性空一切法本清淨一切法如幻一切法非常非滅一切法皆是變化一切法清淨一切法無生一切法無我一切法無自性一切法性空一切法空一切法空說一切法空性一切法空非我理一切皆空一切所有皆歸於空一切智一性空一時見諦一說部二畫二十一空二十六空二十句我我所見二十四緣二十空二十億耳二果二福利二處二萬二千頌本二種甚深二諦二諦說二諦說四家二諦說事理二諦與一切法空無我二邊七十空性論七行七求門七杲七福利七空七處三觀經七處善知七種界七覺分支八不緣起八地菩薩八等至定八勝處八解脫八聖道九有情居九次第定等至十二支緣起十二甘露門十二門論十八空十六句義十六空十六行相十四空十四無記十地品十因十緣十住毘婆沙論十喻十遍處十萬頌本十種空十誦律人與法入中論入出息相應入出息念法門入法界品三畫三十七道品三三昧三三昧三觸三法印三三昧與三法印三三摩地提三世實有說三世實有法性恒有住三世觀三受三法印三法度論三波羅聶提三昧三摩地三重三摩地三假說三解脫門三種人三種假三論玄義檢幽集三摩哂多三摩鉢底三學三諦說三彌底部論三觸大人住三昧大方等無想經大因經大空大空經大果大福利大明度經大拘絺羅經大毘婆沙論大乘中觀釋論大乘佛教大乘法門大乘空義大乘相大乘破有論大乘瑜伽大乘僧團大般若經第二分大般若經第三分大般若經第四分大般涅槃經大唐西域記大智度論大眾部大眾部系大眾部系與法空大善見王大雲經大緣方便經長阿含大緣經長部大寶積經上三昧行上本般若上如上座部上座部系上座禪住下如下本般若凡夫法久行菩薩小空經小品般若波羅蜜經小乘小部乞食清淨經四畫天水中月少光天今此是學時非是證時文殊法門文殊師利文殊師利淨律經牛達多月稱不一不異不了義說不生不滅不可得不可得空不可說不可說我不共法不住一切法不空不來不去出不取著一切法不相在不染垢不淨不即不離不退轉菩薩不淨不淨觀不常不斷不動不動心解脫不動作意不移動觸不動利益經不動無所有無相不落二邊不增不減不縛不解不斷不常止止觀雙修止滅止滅空化化地部化詵刪陀迦旃延經化詵陀迦旃延心心一境性心三昧四種心經心解脫三種心解脫四種幻化幻化者與幻化事幻不異色色不異幻幻事幻網經五分律五正理聚五安穩住五求門五取陰五欲空五陰法散滅五陰譬喻五種有五種空五種所知海岸五類聚五蘊空六十二見六十頌如理論六內外處六因四緣六空六界六處相應中本般若中本般若前分中本般若中分中本般若後分中如中觀中觀學派中阿含經中部中道中道中論與中觀中道即空即假中道正見十二緣起中道的綠起說中道行中論中論梵藏本中論青目釋中論二十七品概說中論開宗明義中論之中心思想中論的歸敬偈中論的特色精要特義中論的二諦中論與阿含經中論之遮破中斷內外空內空內空作意內緣起分別分別說部分別說系分別說系律方便假施設方便道