知涅槃非有亦非無但世人又執涅槃是亦有亦無或説是非有非無所以又進一步遮破而破是有是無是亦有亦無是非有非無四執其實遮破四句是阿含經舊有的如有邊無邊亦有邊亦無邊非有邊非無邊常無常亦常亦無常非常非無常去不去亦去亦不去非去非不去我有色我無色我亦有色亦無色我非有色非無色種種四句無非依語言思想的相對性展轉推論而成立又如觀如來品説非陰非離陰此彼不相在如來不有陰何處有如來觀我我與如來在世俗言説中有共同義與五陰不即不離不相在是雜阿含經一再説到的即陰非我離陰非我這是一異根本的二邊不相在是我不在陰中陰不在我中這四句如約五陰分別就是二十句我我所見由於世人的展轉起執中論又加我如來不有陰成為五門推求到月稱時代大抵異説更多所以又增多到七門推求緣起依依緣性而明法的有無生滅有是存在的無是不存在這是約法體説的從無而有名為生從有而無名為滅也是從未來到現在名生從現在入過去名滅生與滅是時間流中的法相緣起法的有與生無與滅都是此故彼的也就是依於衆緣而如此的此故彼所以不即不離中論等的遮破只是以此法則而應用於一切一般的解説佛法每意解為別別的一切法再來説緣起説相依這都不合於佛説緣起的正義所以一一的加以遮破隨世俗説法不能不説相對的如有與無生與滅因與果生死與涅槃有為與無為等佛及佛弟子的説法有種種相對的二法如相與可相見與可見燃與可然作與所作染與可染縛與可縛等如人法相對有去與去者來與住例此見與見者染與染者作與作者受與受者著與著者也有三事並舉的如見可見見者等這些問題一般人別別的取著所以不符緣起而觸處難通中論等依不即不離的緣起義或約先後或約同時一一的加以遮破遮破一切不可得也就成立緣起的一切如觀四諦品説以有空義故一切法得成觀十二因緣品説明苦陰蘊的集與滅外中論又這樣説因業有作者因作者有業成業義如是更無有餘事如是顛倒滅無明則亦滅以無明滅故諸行等亦滅今我不離受亦不即是受非無受非無此即決定義是故經中説若見因緣法則為能見佛見苦集滅道中論所顯示的成立的一切法是緣起的不能依世俗常談去理解而是八不不生不滅不常不斷不一不異不來不出的緣起也就是要從即空而如幻如化的去理解緣起法如中論説如幻亦如夢如乾闥婆城所説生住滅其相亦如是如世尊神通所作變化人如是變化人復變作化人如初變化人是名為作者變化人所作是則名為業諸煩惱及業作者及果報皆如幻與夢如炎亦如響色聲香味觸及法體六種皆空如炎夢如乾闥婆城如是六種中何有淨不淨淨與不淨猶如幻化人亦如鏡中像五陰常相續猶如燈火炎緣起的世間法如幻如化出世的涅槃受諸因緣故輪轉生死中不受諸因緣是名為涅槃也是依緣起的此無故彼無此滅故彼滅而成立説到如來是我那樣的五種求不可得而也不能説是沒有的所以説邪見深厚者則説無如來總之如來與涅槃從緣起的八不説是絶諸戲論而不可説的如來性空中思惟亦不可非世俗的思辨可及如來過戲論而人生戲論諸法不可得滅一切戲論無人亦無處佛亦無所説如從八不的緣起説那如來與涅槃都如幻如化而可説了這就符合了摩訶般若波羅蜜經所説我説佛道如幻如夢我説涅槃亦如幻如夢若當有法勝於涅槃者我説亦復如幻如夢五假名受假假名在中論思想中有極重要的意義首先般若經的原始般若充分表示了一切法但名的意義如小品般若波羅蜜經卷一大正八五三七中下説世尊所言菩薩菩薩者何等法義是菩薩我不見有法名為菩薩世尊我不見菩薩不得菩薩亦不見不得般若波羅蜜當教何等菩薩般若波羅蜜世尊我不得不見菩薩當教何等菩薩般若波羅蜜世尊我不見菩薩法來去而與菩薩作字言是菩薩我則疑悔世尊又菩薩字無決定無住處所以者何是字無所有故佛命須菩提為菩薩説般若波羅蜜而揭開了般若經的序幕須菩提對佛説説到菩薩菩薩到底是什麼呢我沒有見到也沒有得到過有可以名為菩薩的實體般若波羅蜜也是這樣的不可見不可得這樣要我以什麼樣的般若波羅蜜來教示什麼樣的菩薩呢接著從不見不得菩薩與般若波羅蜜進一步的説我不見有菩薩法或生來或滅去什麼都不可得我假使名之為菩薩説菩薩這樣那樣那是會有過失感而心生疑悔的要知道名字是沒有決定性的同一名字可以有種種意義的不是落實在某一法上的名字是無所有的一切但有名字唯名沒有實性須菩提本著般若體悟的立場所以這樣説説沒有菩薩沒有般若這就是為菩薩説般若波羅蜜了如聽了但有假名一切不可得而能不疑不怖那就是菩薩安住於般若波羅蜜了菩薩是人般若是法人與法都是假名無實的這一法門可能從一説部演化而來原始般若的人菩薩法般若不可得一切但有名字在中本般若一般稱之為大品中有了進一步的説明一切是和合故有是法及名字亦不生不滅但以名字故説是名字亦不在內亦不在外不在中間並對但名的一切提出了三假説如摩訶般若波羅蜜經卷二大正八二三一上説菩薩摩訶薩行般若波羅蜜名假施設受假施設法假施設如是應當學一切唯有假名名字也只是假名在般若中一切都是不可得的然從世間一切去通達假名不可得也不能不知道世俗假名的層次性多樣性所以立三種假依大智度論三假施設是三波羅聶提波羅聶提義譯為假假名施設假施設等這三類假施設大智度論的解説有二復次初説是五衆蘊等法是名法波羅聶提五衆因緣和合故名為衆生諸骨和合故名為頭骨如根莖枝葉和合故名為樹是名受波羅聶提用是名字取法與受二法相説是二種是為名字波羅聶提依論所説法波羅聶提法假是蘊處界一一法如色聲等一一微塵貪瞋等一一心心所阿毗達磨論者以為是實法有的般若經稱之為法假施設受假如五蘊和合為衆生衆骨和合為頭骨枝葉等和合為樹這是復合物在鳩摩羅什的譯語中受與取相當如五取蘊譯為五受陰所以受波羅聶提可能是受假取假依論意不能解説為心的攝取而是依攬衆緣和合的意思名假是稱説法與受的名字名字是世俗共許的假施設所説三假在各種譯本中是略有出入的如下名假施設名假名假字法名假受假施設合法因緣合會而假虛號法假施設法假法假所號法法假教授假方便假權法所號善權要理解般若經的三假可與阿毗達磨者的有作對比的觀察如阿毗達磨大毗婆沙論卷九大正二七四二上中説然諸有者有説二種一實物有謂蘊界等二施設有謂男女等有説五種一名有謂龜毛兔角空花鬘等二實有謂一切法各住自性三假有謂瓶衣車乘軍林舍等四和合有謂於諸蘊和合施設補特伽羅五相待有謂此彼岸長短事等阿毗達磨論師立實物法有與施設有這是根本的分類與大般若經第三分本但立名假與法假相合依經説我頭頸等草木等過去未來諸佛夢境谷響等都説如是名假不生不滅唯有等想施設言説所以二假中的名假與阿毗達磨者二種有中的施設有相當般若經立三假法假當然與實物有實有相當五種有中的假有和合有是施設有的再分類與般若經的受假相當名有是龜毛兔角等在世俗中也只有假説的一類可以含攝在名假中但三假中的名假重在稱呼那法與受的名字不過般若經的三假有的不立受假包含在名假中別立方便假教授假權法等這是説佛為弟子教授説法都是方便善巧的施設如法蘊足論引經説如是緣起法住法界一切如來自然通達等覺宣説施設建立分別開示令其顯了如來説法本著自覺自證而以方便施設名相為衆生宣説開示的佛的教法一切都是方便施設的這本是阿含經以來的一貫見解如第一義空經説俗數法者謂此有故彼有此起故彼起等緣起的集與滅所説的俗數法順正理論引經譯作法假阿毗達磨論者雖知緣起等一切教法是方便施設的而對於文句所詮表的法義總是分為實有與假有般若經明一切法但假施設依大智度論所説有次第悟入的意義如説行者先壞名字波羅聶提到受波羅聶提次破受波羅聶提到法波羅聶提破法波羅聶提到諸法實相中諸法實相即是諸法及名字空般若波羅蜜中論的空假中偈在緣起即空下説亦為是假名這裡的假名原文為正是般若經所説的受假施設依中論青目釋空亦復空但為引導衆生故以假名説離有無二邊故名為中道假名是指空性説的緣起法即空性而空性只是假名所以緣起即空離有邊空只是假名空也不可得離無邊緣起為不落有無二邊的中道當然假名可以約緣起説構成緣起為即空即假的中道不過依般若經三假來説緣起是法假空性應該是名假為什麼中論與般若經不同特別使用這受假一詞呢説一切有部的阿毗達磨立二有三有五有包含了一切實有假有並沒有與受假相當的名字受假應該是從犢子部系來的如三法度論卷中大正二五二四上中説不可説者受過去滅施設受施設過去施設滅施設若不知者是謂不可説不知受施設不知者衆生已受陰界入計衆生與陰界入是一及餘計異三法度論是屬於犢子部系的論典犢子部立不可説我又有三類受施設是依蘊界處而施設的如異部宗輪論説犢子部本宗同義謂補特伽羅數取趣非即蘊離蘊依蘊處界假施設名補特伽羅我不可説與蘊等是一不可説與蘊等是異不一不異如計執為是一或是異這就是不可説不知犢子部的我是假施設名此外有三彌底部論三彌底是正量的音譯正量部是犢子部分出的大宗三彌底部論卷中大正三二四六六上中也説佛説有三種人問曰云何三種人答依説人度説人滅説人説者亦名安亦名制亦名假名三種人與三法度論的三類施設不可説我相同依説人的説依小注可譯為安立假名可知是施設的異譯所以依説人就是受施設我依或受就是中論所説中的這個字有依因基取受等意義所以般若燈論解説為若言從緣生者亦是空之異名何以故因施設故觀誓的般若燈論廣注釋因施設為即取因施設從犢子部出家的陳那也有取因施設論總之般若經所説的受假正是中論所説的因施設這一術語是由犢子部系中來的為了説明中論的緣起是假名受假施設所以分別的來説一佛的説法以語句方便來表達稱為施設假如般若經的方便假教授假那是佛教界所公認的對於所表示的內容雖有假名有的如五蘊和合名為我枝葉等和合名為樹但總以為假必依實有實法存在實法有如説一切有部説蘊處界都是實有自性的俱舍論以為蘊是假而處界是實有的經部以為蘊處是假而界是實有的這些上座部系的學派都是成立實法有的大衆部中以説假為部名的説假部立十二處非真實一説部説諸法但名無實有沒有立實法為所依傳説中沒有明確的記録二一切法從因緣生從種種緣生不從一因生是佛教界所公認的説一切有部立法性恆住三世實有所以從因緣生並非新生法體法體是三世一如的從緣生只是衆因緣力法體與生相應從未來來現在名為生起而已如經部説現在實有而過未非實所以從緣生是界一一法的功能在剎那剎那的現在相續中以緣力而現起為唯識宗種子生現