body:
  text: 序我在中觀今論中說在師友中我是被看作研究三論或空宗的我對於空宗根本大義確有廣泛的同情但我不能屬於空宗的任何學派問題是我讀書不求甚解泛而不專是不適於專宏一宗或深入而光大某一宗的還有面對現實的佛教總覺得與佛法有一段距離我的發心修學只是對佛法的一點真誠希望從印度傳來的三藏中理解出行持與義解的根源與流變把握更純正的更少為了適應而天神化俗化的佛法這是從寫作以來不敢忘失的方針前幾年為了初期大乘佛教之起源與開展的寫作在閲讀般若經時想起了三十多年前中觀今論的一個見解中論是阿含經的通論中論確是以大乘學者的立場抉發阿含經的緣起深義將大乘佛法的正見確樹於緣起中道的磐石這一論斷出於個人的論斷不一定能受到佛學界的認可對於般若經的空義既有了較明確的理解不如從阿含部派般若龍樹作一番空之探究以闡明空的實踐性與理論的開展這一構想就是寫作本書的動機本書的主題就是空簡單的說阿含的空是重於修持的解脫道部派的空漸傾向於法義的論究般若的空是體悟的深奧義龍樹的空是般若經的假名空性與阿含經緣起中道的統一大乘佛法的一切法空不離佛法緣起中道的根本立場是中論理論的也是中觀實踐的雖然名為探究其實只是引述經論來說明沒有自己的發揮最近見到世界佛學名著譯叢目録知道有梶山雄一等的集體著作般若思想與中觀思想沒有能讀到與參考非常遺憾希望能有一些共同的看法民國七十三年十一月二十九日自序於台中華雨精舍第一章阿含空與解脫道一引言空與空性是佛法中的重要術語在佛法的弘傳流通中空義不斷的發揚從佛被稱為空王佛教被稱為空門就可以想見空義的廣大深遠了然空與空性的早期意義到底表示了什麼在什麼情況下空性竟表示了最普遍的真理絶對的真理呢佛法所處理的問題本是當時印度宗教界的共同問題面對生而又死死而又生生死流轉的事實而求得生死的徹底解脫涅槃也就是最高理想的實現事實與理想原則上大致相近而怎樣來實現解脫各教派所提出的見解與方法卻各不相同釋尊基於人生真義的大覺提出了獨到的正道中道釋尊的原始教說實際上並沒有以空為主題來宣揚但佛法的特性確乎可以空來表達所以在佛法中空義越來越重要終於成為佛法甚深的主要論題空與空性先依初期聖典來觀察那些是初期聖典呢代表初期的契經現存漢譯的四阿含經及巴利藏的五部漢譯的是一雜阿含經宋求那跋陀羅譯佚失二卷二中阿含經東晉僧伽提婆譯這二部是說一切有部的誦本三長阿含經後秦佛陀耶舍共竺佛念譯是法藏部的誦本四增一阿含經苻秦曇摩難提譯出由東晉僧伽提婆改正是大衆部末派的誦本已有大乘思想此外有別譯雜阿含經失譯是雜阿含經的一部分可能是飲光部的誦本巴利藏五部是一長部二中部三相應部與雜阿含經相當四增支部這四部與四阿含經相當五小部共十五種其中二法句五經集經集分蛇品小品大品義品彼岸道品是小部中成立比較早的這五部是赤銅鍱部的誦本這些早期教說雜阿含經是其他三阿含的根本雜阿含經可分為三類一修多羅是簡短的散文原始結集者將一則一則的佛說隨類而集成四部五蘊六處因緣道品這是隨類而集成的所以名為相應教相應也有雜廁的意思這是最原始的教說不過現存的已雜有後出的成分二祇夜與相應部的有偈品相當祇夜本是一切偈頌的通稱由於有偈品成為相應修多羅的一分其他偈頌如法句經集等就被稱為伽陀優陀那了三記說有弟子記說與如來記說弟子記說重於分別法義已有解說祇夜的經說雜阿含經有這三分集出是有次第先後的現存的漢譯與巴利文藏不但集出有先後而且都是部派的誦本含有部派的成分這是不可不加注意的現在先從共通的簡要的空義說起作為全論的引言在初期聖典中空與住處有關如相應部五四入出息相應南傳一六下一八一說比丘往阿練若往樹下往空屋結跏趺坐正身修普前念正念入息正念出息佛與出家弟子的修行處經中一再說到阿練若樹下空屋這三處是最一般的還有岩洞冢間等地方空屋或譯為空間處空舍空所靜室等與大體相同的還有譯為空舍的空屋空舍是曠野處的小屋適合於修習禪觀的住處此外有當時宗教傳說中的空宮殿如長部二四波梨經南傳八三六三七說世界生時空虛梵天宮現時有有情壽盡或功德因盡光音天沒空虛梵天宮生空虛梵天宮長阿含經譯為空梵處這是適應印度創造神的梵天信仰而給以佛教的解說又有弊宿王不淨布施死後生於榵樹林空宮殿的傳說空宮殿表示宮殿裡是沒有別人的如阿㝹夷經說我先至此獨一無侶天上的空宮殿人間的空屋本來是世俗語言並沒有什麼特殊意義空只是沒有什麼人物而已但作為修行者的住處空屋空舍卻啓發了一項深遠的意義住在空屋中沒有外來的囂雜煩擾當然是寧靜的間適的在這裡修習禪慧不為外境所惑亂不起內心的煩動惱亂這種心境不正如空屋那樣的空嗎雜阿含經說猶如空舍宅牟尼心虛寂云何無所求空寂在於此獨一處空間而得心所樂明確的表示了以空屋來象徵禪心空寂的意義所以在空屋中修行空屋是修行者的住處修行者的禪慧住處正如空屋那樣於是就稱為空住空住定了如毗訶羅後來幾乎是寺院的通稱然在古代也是曠野的小屋修行者作為風雨酷熱時暫時休憩的住處這是修行者的住處所以禪慧安住的境地也名為住而有空住寂靜住等名目總之在空間處修行引起了以空來象徵禪慧的境地是空義不斷昂揚的初期意義空住是佛教初期被尊重的禪慧如雜阿含經卷九大正二五七中說舍利弗白佛言世尊我今於林中入空三昧禪住佛告舍利弗善哉善哉舍利弗汝今入上座禪住而坐禪此經巴利藏是編入中部的名為乞食清淨經比較起來雜阿含經的文句簡要得多應該是初集出的乞食清淨經中舍利弗說我今多住空住佛讚歎說空住是大人住大人住雜阿含經作上座禪住上座或譯尊者所以瑜伽論作尊勝空住無論是大人住尊勝空住都表示了在一切禪慧中空住是偉大的可尊崇的傳說佛滅百年舉行七百結集時長老一切去多入空住分別說系的律典也稱之為大人三昧十誦律作上三昧行可見空住空三昧在佛教初期受到了佛教界的推崇舍利弗與一切去的空住都是在靜坐中但佛對舍利弗說要入上座禪住的在出入往來乞食行住坐臥時應該這樣的正思惟在眼見色意知法時有沒有愛念染著如有愛念染著那就為斷惡不善故當勤欲方便堪能繫念修學如沒有那就願以此喜樂善根日夜精勤繫念修習這可見修習空住不僅是靜坐時修更要應用於日常生活中安住遠離愛念染著的清淨離去愛念染著是空沒有愛念染著的清淨也是空空表示了離愛染而清淨的境地中部的空小經空大經是依此經所說的空住修習傳宏而又分別集出的在空的修行中這是值得尊重的空經義品的答摩犍提所問偈說到了空諸欲空諸欲是什麼意義偈頌簡略不明摩訶迦旃延分別解說為何為已空諸欲者居士若人於此諸欲離貪離欲離愛離渴離熱煩離渴愛居士如是為已空諸欲者空諸欲雜阿含經約空五欲說而實不限於五欲的諸欲的欲包含了貪欲愛渴熱煩渴愛正是繫縛生死的緣起支中渴愛支的種種相也就是四諦中愛為集諦的愛空諸欲與空住的意義相通都是著重於離愛而不染著的經集的彼岸道品偈說到了觀世間空所說的世間空或譯作空世間阿難曾提出來問佛空世間是什麼意義如相應部三五六處相應南傳一五八七八八說阿難眼我我所空色我我所空眼識我我所空眼觸我我所空眼觸因緣所生受若苦若樂若非苦非樂我我所空意觸因緣所生受若樂若苦若非苦非樂我我所空阿難我我所空故名空世間世間佛約眼等內六處色等六外處六識六觸六受說這些都是可破壞的破壞法所以名為世間六處等我我所空名為空世間以無我我所為空是空三昧的一般意義相應部的質多相應說到了四種心解脫無量心解脫無所有心解脫空心解脫無相心解脫雜阿含經作四種心三昧四種心解脫名字不同意義當然也不同了但都是心解脫也就可說文異義同約意義不同說空心解脫是我我所有空與空世間義一致如約意義相同說無量無所有無相三種心解脫修到最第一的是不動心解脫不動心解脫者染欲空瞋恚空愚癡空這是說無量等心解脫修到究竟處是不動心解脫也就是空心解脫貪瞋癡是煩惱的大類可以總攝一切煩惱的離一切煩惱的不動心解脫就是阿羅漢的見法涅槃涅槃或無為阿含經是以貪欲滅瞋恚滅愚癡滅貪瞋癡的滅盡來表示的所以四種心解脫的共同義就是貪瞋癡空的心解脫不同名字的心解脫不外乎空心解脫在修行方便上的多樣化依上來所說空五欲空世間空心解脫的說明都屬於弟子記說可見空與離煩惱的清淨解脫是不能分離的空諸欲空世間我我所空貪瞋癡空都是依生死世間說空的如徹底的貪空瞋空癡空貪瞋癡永滅也就顯示了出世的涅槃相應部說到了這樣的文句如來所說法甚深義甚深出世間空性相應佛說的法為什麼甚深因為是出世間空性相應的出世間空性是聖者所自證的如來所說而與之相應也就甚深了出世間空性是難見難覺唯是自證的涅槃甚深佛依緣起說法能引向涅槃所以緣起也是甚深了阿難以為佛說此緣起甚奇極甚深明亦甚深然我觀見至淺至淺以此受到了佛的教誡這樣甚深法有二緣起甚深涅槃甚深如雜阿含經卷一二大正二八三下說此甚深處所謂緣起倍復甚深難見所謂一切取離愛盡無欲寂滅涅槃如此二法謂有為無為相應部的梵天相應中部的聖求經等也都說到了緣起與涅槃二種甚深涅槃甚深緣起怎樣的與之相應呢依緣起的此有故彼有此生故彼生闡明生死的集起依緣起的此無故彼無此滅故彼滅顯示生死的寂滅涅槃緣起是有為是世間是空所以修空離卻煩惱以實現涅槃涅槃是無為是出世間也是空出世間空性雜阿含經在說這二種甚深時就說說賢聖出世空相應緣起隨順法出世空相應緣起隨順法透露了空是依緣起而貫徹於生死與涅槃的這雖是說一切有部所傳但是值得特別重視的二泛說解脫道空與空性是佛法解脫道的心要與解脫道是不相離的在佛法的開展中解脫道引起的多方面開展空與空有關的方便也就多方面開展而有種種這裡依據早期的經說從種種解脫道中對空作進一步的探究佛說的解脫道原始是以八正道為本的因機設教成立不同的道品古人依道品的數目次第總列為四念處四正勤四神足五根五力七菩提分八聖道分七類共三十七道品成為佛教界的定論說一切有部論師以此為進修次第的全部歷程未必與事實相符這不過是條理總貫作如此解說而已八正道的內容不外乎戒心慧三學經上說戒定慧解脫戒清淨心清淨見清淨解脫清淨正是以戒定慧的修習而實現解脫然從聖道的修習來說經中或先說聞法或先說持戒而真能部分的或徹底的斷除煩惱那就是定與慧了化地部說道唯五支不取正語正業正命這三支是戒所攝為道體也是不無意義的定與慧要修習而成分別的說修止奢摩他可以得定修觀毗鉢舍那可以成慧止是住心於一處觀是事理的觀察在修持上方法是不相同的但不是互不相關而是相互助成的如雜阿含經卷一七大正二一一八中說修習於止終成於觀修習觀已亦成於止謂聖弟子止觀俱修得諸解脫界依經說有先修止而後成觀的有先修觀而後成止的一定要止觀雙修才能得淺深不等的種種解脫界增支部分為四類一修止而後修觀二修觀而後修止三止觀俱修四掉舉心重的在止觀中特重於修止這可見止與觀定與慧可以約修持方法而分別說明而在修持上有著相成的不可或缺的關係所以大毗婆沙論引法句說慧闕無靜慮禪靜慮闕無慧是二具足者去涅槃不遠說到定經中的名目不一在佛功德十力的說明中列舉了四類一禪譯義為靜慮舊譯作思惟修二解脫舊譯為背捨三三摩地三昧譯義為等持定四三摩鉢底譯義為等至舊譯作正受四類中禪是從初禪到四禪的專稱四禪也是等至如加上四無色處合名八等至再加滅盡定名為九次第定等至這九定是有向上增進次第的又如四禪四無量四無色定都是等至合名十二甘露門三摩地是空等三三摩地有尋有伺等三三摩地三摩地也是一般定法的通稱解脫是八解脫這四種名義不同都含有多種層次或不同類的定法此外如三摩呬多譯義為等引心一境性心住也都是定的一名都沒有組成一類一類的佛教所說的種種定法多數是依觀想成就而得名的其中最原始最根本的定法應該是四種禪理由是一佛是依第四禪而成正覺的也是從第四禪出而後入涅槃的在家時出外觀耕也有在樹下入禪的傳說二依經文的解說在所有各種道品中正定是四禪定覺支是四禪定根是四禪定力也是四禪三四禪是心的安定與身生理的呼吸等密切相關在禪的修習中以心力達成身心的安定也以身息來助成內心的安定寂靜次第進修達到最融和最寂靜的境地禪的修學以離五欲及五蓋等惡不善法為前提與煩惱的解脫空相應不是世俗那樣以修精鍊氣為目的從修行的過程來說初禪語言滅而輕安二禪尋伺滅而輕安三禪喜滅而輕安四禪樂滅入出息滅而輕安達到世間法中身心輕安最寂靜的境地四禪有禪支功德不是其他定法所能及的四在戒定慧的修行解脫次第中如中部三八愛盡大經三九馬邑大經五一乾達羅迦經五三有學經七六刪陀迦經一一二六淨經一二五調御地經中阿含經六五烏鳥喻經八迦絺那經一四四算數目揵連經這些經一致的說得四禪而後漏盡解脫或說具三明或說得六通主要是盡漏的明慧依此四點在解脫道中四禪是佛說定法的根本這應該是無可懷疑的說到慧就是般若般若是解脫道的先導也是解脫道的主體沒有般若是不可能解脫生死的如經說我說知見能得漏盡非不知見我不說一法不知不識而得究竟苦邊如實知見在解脫道中是必要而又優先的所以說此五根一切皆為慧根所攝受譬如堂閣衆材棟為其首皆依於棟以攝持故與慧有關的名詞經中所說的極多如八正道中的正見正思惟七菩提分中的擇法四神足中的觀觀隨觀知見智等表示證智方面的如說如實知見明覺悟慧無間等現觀是名為明經中處處說到先以如實知然後厭離離欲滅而得解脫到底如實知些什麼那些是應該如實知的將種種經說統攝起來不外乎下面這幾例知苦知苦知苦知苦集知苦集知集知集知集知苦滅知苦滅知滅知滅知滅知道知道知味知味知味知患知患知患知離知離知離在以正見為首的正道的修習中應知生死苦的所以集起生死苦的可以滅盡也就是知緣起的如是純大苦聚集如是純大苦聚滅苦是什麼是生死法是五蘊是眼等六處或是六界總之是有情當前的身心自體經中每一一的作分別說明如依世俗來說世間是有苦有樂的雜阿含經說世尊說苦樂從緣起生又說我論因說因佛對苦樂非苦非樂而實諸受皆苦的生死現實總是依因緣來說明的佛常說離於二邊處中說法或譯作離是二邊說中道就是緣起不一定是十二支的苦集與苦滅苦集如分別來說那麼苦是身心苦聚造成苦聚的原因名為集如再加修行的道就是苦苦之集苦之滅至苦滅之道簡稱苦集滅道四諦了所以知緣起與知四諦不過說明的小小不同而已世間不只是憂苦的也有可喜可樂的一面所以苦受以外有樂受由於是可喜樂的所以會心生味著這是知味世間的憂苦是可厭的可喜可樂而心生味著的也不能一直保持下去終於要變壞可味著的存有可厭的過患可能而一定要到來的這是知患苦是可厭的喜樂的也有過患世間是這樣的相續不已真是無可奈何然而這是可以超脫出離的因為生死世間是此有故彼有此生故彼生的也就會此無故彼無此滅故彼滅的所以如知其集因而豫以除去也就因無果無了出離生死苦是可能的是知離知味知患知離是苦集與苦滅的又一說明綜合起來說明的是七處善知如七處三觀經說四諦等都是應該如實知的而苦諦又應該遍知如雜阿含經卷一五大正二一四中說於苦聖諦當知當解於苦集聖諦當知當斷於苦滅聖諦當知當證於苦滅道跡聖諦當知當修四諦都應該知而苦諦更應該解參照相應部及瑜伽師地論知道解是遍知的異譯遍知苦斷苦集現證苦滅修習苦滅道這就是在正道的修習中遍知苦斷集而證滅達成了解脫生死的目的解脫道從知苦著手知苦是知五蘊六處一切有漏法應怎樣的如實觀察呢經中所說的主要是無常苦無我無常苦無我我所無常苦空無我無常苦無我或說無我我所觀察無常苦無我我所而得解脫是相應部及雜阿含經所常見的南傳佛教所傳宏的著重於此說一切有部用無常苦空無我義也是阿含經所共說的如雜阿含經說如病如癰如刺如殺無常苦空非我相應部作無常苦疾癰刺痛病他或譯為敵壞空無我中部與增支部也有同樣的文句在無常與空中間所有苦病癰刺痛疾敵壞都是表示苦的所以相應部將癰等列於苦下雜阿含經別列癰等於前雖次第不同而無常苦空無我的實質並沒有差別無常苦無我我所無常苦空無我都是雜阿含經與相應部所說的不過部派間所取不同解說也小小差別成為部派佛教的不同特色無常的所以是苦的無常苦變易法所以是無我我所的無我我所是空的要義廣義是離一切煩惱的空寂空與無我的聯合只表示無我與無我所無我我所是空的狹義所以我曾說佛法的初義似乎只有無常苦無我三句把空加上成為苦諦的四行相似乎加上了空義而實是把空說小了無常故苦無常苦故無我無我所就是空這是解脫的不二門古人依無常苦無我立三解脫門可見空在定慧修證中的重要了三空與心解脫在定慧的修習中所有的方便不一隨觀想的不同修習成就成為種種的定法這不是偏於定而是從定得名在佛教界類集分別的學風本於佛說經弟子們的發展成為阿毗達磨中多方面傳出定法或經過論辨然後成為定論修證者所傳的內容不但名稱不一即使名稱相同的含義也有淺有深因為這些名稱絶大多數是世俗固有的名詞空也不例外隨俗立名加上宏傳者的程度參差意義也就難以一致了這是理解種種定法所必要注意的與空有密切關係的定法主要是四種心三昧相應部作心解脫雜阿含經卷二一大正二一四九下說質多羅長者問尊者那伽達多此諸三昧為世尊所說為尊者自意說耶尊者那伽達多答言此世尊所說從那伽達多與質多羅的問答可見當時所傳的定法有些是佛說的有些是弟子們傳授時自立名目的這四種心三昧或心解脫那時也還沒有達到衆所周知的程度所以有此問答與此相當的相應部經問答者是牛達多與質多長者又編入中部四三有明大經是舍利弗為大拘絺羅說的依相應部四種心解脫是無量心解脫無所有心解脫空心解脫無相心解脫問題是這四種心解脫到底是文異義異還是文異義同呢依質多長者的見解可從兩方面說一名稱不同意義也就不同不同的是無量心解脫是慈悲喜捨四無量定無所有心解脫是四無色中的無所有處定空心解脫是思惟我我所空無相心解脫是一切相不作意得無相心三昧二名稱雖然不同而意義可說是一致的這是說貪瞋癡代表了一切煩惱是量的因漏盡比丘所得無量心解脫中不動心解脫最為第一不動心解脫是貪空瞋空癡空貪瞋癡空即超越於限量是漏盡比丘的究竟解脫不動阿羅漢同樣的意義貪瞋癡是障礙貪瞋癡空即超越於所有不動心解脫是無所有心解脫中最上的貪瞋癡是相的因貪瞋癡空即超越於相不動心解脫是無相心解脫中最上的經中說無量無所有無相卻沒有說到空心解脫這因為空於貪瞋癡的不動心解脫就是空心解脫的別名從文異而義同來說無量心解脫無所有心解脫無相心解脫達到究竟處與空心解脫不動心解脫平等平等依觀想的方便不同有四種心解脫的名目而從空一切煩惱來說這是一致的目標如萬流入海都是鹹味那樣雜阿含經的四種心三昧從名稱不同而意義也不同來說與相應部所說是一致的但從名稱不同而意義相同來說雜阿含經的文句與相應部有些出入如經卷二一大正二一五上說云何法一義種種味味是名的舊譯答言尊者謂貪有量恚癡是有量若無諍者第一無量謂貪者是有相恚癡者是有相無諍者是第一無相貪者是所有恚癡者是所有無諍者是第一無所有復次無諍者空於貪空於恚癡空常住不變易空非我非我所是名法一義種種味相應部的不動心解脫雜阿含經作無諍應該是無諍住或無諍三昧的簡稱諍有三類煩惱也名為諍煩惱諍所以無諍是沒有一切煩惱與空一切煩惱的不動心解脫相當相應部說了無量等三種心解脫中最第一的是貪空瞋空癡空不再說空心解脫那是以不動心解脫為空心解脫了雜阿含經說明無量等三種中無諍最為第一然後又解說無諍是空於貪空於恚癡空常住不變易空非我非我所解說無諍也就是解說空心三昧無諍與空是有關係的如中阿含經拘樓瘦無諍經末了說須菩提族姓子以無諍道於後知法如法知法如真實須菩提說偈此行真實空捨此住止息總之四種心解脫中最上的是空於貪恚癡的不動心解脫或無諍住也就是心解脫或心三昧而達究竟不外乎空的究竟完成無量無所有無相無諍不動從煩惱空而清淨來說都可以看作空的異名無諍阿練若本是修行者的住處由於住處寧靜沒有煩纍象徵禪慧的境地而名為無諍住無諍三昧的這與空本用來形容住處的空曠沒有人物的煩纍也就用來象徵禪慧而有空住空三昧等名目情境是完全一樣的四無量無量無所有無相空四名的內容以下分別的加以探究慈悲喜捨四無量定也名無量心解脫無量心三昧或名四梵住四無量遍緣無量有情所以是勝解作意俱生假想起故或依定而起慈等觀想或依慈等觀想而成定在定法中這是重要的一組其中慈為一切功德之母慈心是印度文化中最重視的佛經中可以充分證明這一意義的如雜阿含經卷一大正二六七下說我自憶宿命曾於七年中修習慈心經七劫成壞不還此世欲界七劫壞時生光音天七劫成時還生梵世空宮殿中作大梵王無勝無上領千世界這一則佛的本生傳說中阿含經增支部增一阿含經都同樣的說到還有佛本生善眼大師教弟子們修習慈心生於梵世界善眼更修增上慈所以命終以後生在晃昱天即光音天劫成時生梵世作大梵王這是中阿含經與增支部所一再說到的梵天中的大梵天王是千世界的統攝者也就是婆羅門教的最高神創造神梵世俗所仰信的創造神依佛說是修慈心定的果報修慈心能生於梵天功德很大勝過了布施與持戒的功德如中阿含經一五五須達多經大正一六七七下說梵志隨藍行如是大施歸命三尊佛法比丘衆及受戒若有為彼一切衆生行於慈心乃至𤛓牛乳頃者此於彼施戒為最勝也隨藍婆羅門本生也見於增支部關於慈心的殊勝功德除勝於布施持戒外還有不為諸惡鬼神所欺害的功德如雜阿含經與相應部說增支部說到慈心的八功德十一功德智度論說慈以樂與衆生故增一阿含中說有五功德與大毗婆沙論所說相近應該是說一切有部所誦的慈心的定義是與衆生樂與儒家的仁耶教的愛相近在人類的德性中這確是最高的如能仁心普洽民胞物與浩然之氣充塞於天地之間那與慈無量心更類似了慈是與樂觀想衆生得到安樂悲是拔苦想衆生遠離苦惱喜是想衆生離苦得樂而心生喜悅捨是冤親平等一視同仁分別的說這四心的觀行是各不相同的如綜合起來說這才是慈心的全貌本來只是慈心約義而分為四類如雜阿含經卷二九大正二二九下二一上說有比丘修不淨觀斷貪欲修慈心斷瞋恚修無常想斷我慢修安那般那念入出息念斷覺想尋思修習四類觀想對治四類煩惱也是中阿含經與增支部所說的本來只說到修慈但中部教誡羅睺羅大經同樣的修法卻說修慈悲喜捨不淨無常入出息念七行這是將慈行分為慈悲喜捨四行了佛法重視慈心在世間德行中崇高價值所以約義而分別為四心如觀想成就就是四無量定以慈心為本的四無量心是適應婆羅門教的如舍利弗勸老友梵志陀然修四無量心命終生梵天中就因為彼諸梵志長夜愛著梵天傳說大善見王本生也是修四梵住而生梵天中的所以依一般經文所說四無量心是世間定法是有漏是俗定然在佛法初期慈悲喜捨四定顯然的曾淨化而提升為解脫道甘露門從四無量心也稱為無量心解脫最上的就是不動心解脫來說就可以確定初期的意義了如雜阿含經卷二七大正二一九七下說若比丘修習慈心多修習已得大果大福利是比丘心與慈俱修念覺分依遠離依無欲依滅向於捨乃至修習捨覺分依遠離依無欲依滅向於捨經說慈心是譯者的簡略實際是慈悲喜捨四心所說的大果大福利或是二果二福利是阿那含與阿羅漢或是四果四福利從須陀洹到阿羅漢或是七果七福利是二種阿羅漢與五種阿那含慈悲喜捨與七覺分俱時而修能得大果大功德當然是通於無漏的解脫道無量心解脫包含了適應世俗佛法不共二類一般聲聞學者都以為四無量心緣廣大無量的衆生無量是衆多難以數計是勝解假想觀所以是世間定但量是依局限性而來的如觀一切衆生而超越限量心不起自他的分別就與無我我所的空慧相應質多羅長者以為無量心解脫中最上的是空於貪瞋癡的不動心解脫空就是無量這一意義在大乘所說的無緣慈中才再度的表達出來五無所有再說無所有與無所有有關的有二經一中部善星經說衆生的心或傾向於世間的五欲或傾向於不動而離欲結或傾向於無所有處而離不動結或傾向於非想非非想處而離無所有處結或傾向於涅槃而離非想非非想處結這五類是世間人心所傾仰的也是修行者的次第升進以涅槃為最高理想傾心於前四類是不能出離的所以善星經的傾心於無所有處只是世間無所有處定境沒有與空相同的意義二中部的不動利益經中阿含經作淨不動道經經中分淨不動道淨無所有處道淨無想道中部作非想非非想處利益行道無餘涅槃聖解脫前三種淨道名稱與次第都是與善星經一致的前三種淨道共分為七類今依中阿含經參考中部列表如下現世欲來世欲現世欲想來世欲想是魔境魔餌心淨得不動淨不動道現世欲來世欲想四大四大所成色是無常苦滅心淨得不動現世欲來世欲想現世色來世色現世色想來世色想是無常苦滅心淨得不動現世欲來世色想不動想是無常苦滅心淨得無所有處淨無所有處道此世是我我所空心淨得無所有處我是非為自非為他心淨得無所有處淨無想道現世欲不動想無所有處想是無常苦滅心淨得無想淨不動道經所說的前三淨道是有層次的層次與善星經相同有次第觀想次第超越息滅的層次所以被稱為漸次度脫瀑流然本經與善星經不同淨不動道以上都是有解脫可能的其中欲是欲界的五欲不動一般的說是四禪在這裡有兩點是值得注意的不動四禪以上是無所有處無想處非想非非想處為什麼四禪以上與無所有處無想處中間沒有空無邊處與識無邊處呢這是一中部的非想非非想處中阿含經作無想無想處無相心定中阿含經每譯作無想定無想無相心定與非想非非想處定無想定滅盡定有著復雜的關係本經的不動無所有無想無相三者次第而說不正與說一切有部經論所說從滅盡定起起不動無相無所有三觸的名稱相同嗎這是二說到淨無所有處道經中分為三類一中部說聖弟子作如此的思惟現在欲不動想這一切無餘滅盡那是寂靜的殊妙的就是無所有處這樣的專心安住於是得心清淨中部說無所有處是寂靜殊妙的中阿含經作彼一切想是無常法是苦是滅這可能是一般所說觀下苦粗障觀上靜妙離厭下欣上的修法厭下而專住於無所有處想成就無所有處定然經上說修習無所有處的或得無所有處定或依慧而得解脫可見這不只是世俗定了依中阿含經說彼一切想是無常法是苦是滅壞法那在離欲不動想時無常苦滅的觀慧是有解脫可能的二聖弟子作這樣的思惟我屬於我的是空的這樣的專心安住而得心淨也有得無所有處定或依慧得解脫的二類中阿含經說聖弟子作如是觀此世間空空於神神所有我我所有的舊譯空有常空有恆空長存空不變易這是說一切有部經論從常恆不變易法空無常以明我我所空的意義修無我我所的空觀得無所有處定古人雖有多種解說其實是空與無所有的同一意趣三中部一六不動利益經南傳一一上三四三說聖弟子作如是思惟我不在何處非誰亦不在何物之內我所不在何處不在誰中亦不在何物中阿含經作聖弟子作如是觀我非為他而有所為亦非自為而有所為意義不大明顯大毗婆沙論引此經作非我有處有時有所屬物亦無處時物屬我者與中部說相近依婆沙論說無論何處何時沒有我所屬的物也無論何處何時沒有物是屬於我的從我與我所相關中通達無所有這也是空與無所有是相同的依此而得心淨的也有得無所有定或依慧得解脫的二類禪定四禪八定一般說是共世間法似乎是世間固有的定法佛弟子依這種定法而修出世的觀慧然佛法的定慧的早期意義未必是這樣的如所說的不動無所有處無想處非想非非想處經上都這麼說多聞聖弟子作如是思惟這是賢聖弟子所修的由於修習者的用心不同而有得定或依慧得解脫的差別依佛法的因果法則修得某種定如不能依之發慧得解脫那就命終以後生在某種定境的天上一般說世間定是厭下欣上而修得的然如淨無所有處道的三類並不是這樣的第二類是觀我我所空而修得的第三類是觀無我所有而修得的這都是出世解脫我我所空的正觀只是修習上有些問題才不能依慧得解脫成為無所有處定生無所有處天就是第一類依淨不動道經也是觀一切欲欲想色色想不動想是無常法是苦是滅無常苦無我我所正是出世解脫道的三要門三解脫門依此而立所以第一類也有依慧得解脫的這樣無所有處道都依出世觀慧而成定不過修持上有點問題這才成為世間定修出世觀慧而成世間定問題到底在那裡經文在無想淨非想非非想道後依無想處而有所說明意義是通於不動及無所有處道的中阿含經七五淨不動道經大正一五四三上中說阿難若比丘如是行無我無我所我當來不有我所當來不有若本有者便盡得捨阿難若比丘樂彼捨著彼捨住彼捨者阿難比丘行如是必不得般涅槃若比丘有所受者彼必不得般涅槃阿難若比丘如是行無我無我所我當不有我所當不有若本有者便盡得捨阿難若比丘不樂彼捨不著彼捨不住彼捨者阿難比丘行如是必得般涅槃若比丘無所受必得般涅槃以非想非非想處來說當來的我與我所不再有本有現在有的盡捨這表示究竟的般涅槃但如對捨而有所樂著住中部日譯本作喜歡迎執著那就不能得般涅槃了樂著住總之是有所受受是取的舊譯所以即使修行者所修的是正觀只要心有所樂著就不得解脫了如修無所有正觀心著而不得解脫就會招感無所有處報無所有處定與天報是在這種情形下成立的無所有無所有處道修無常苦無我我所空是空觀的別名無所有處定是空觀的禪定化六無相無相在解脫道中有種種名稱如無相心解脫無相心三昧無相解脫無相三昧無相等至無相住這些術語的應用在初期佛教裡比空與無所有還要多一些當然如以無我我所為空那說空的經文還是比無相要多些無相定依修行者的用心不同淺深不一與成為定論的非想非非想處滅盡定無想定都有關係所以內容比較復雜阿毗達磨大毗婆沙論卷一四大正二七五四一中說謂無相聲說多種義或於空三摩地說無相聲如是或於見道或於不動心解脫或於非想非非想處或即於無相三摩地說無相聲婆沙論以為無相這一名稱有五種不同的意義然從經文來說也許還不止於所說的五義呢無相心三昧是智果智功德說明這一問題的雜阿含經弟子記說中共有四經依大正藏編號為五五六五五九其實應分為六經都是與阿難有關的有一位比丘修得了無相心三昧卻不知道是何果何功德他於是隨逐尊者阿難脫有餘人問此義者因而得聞彼比丘即隨尊者阿難經六年中無有餘人問此義者終於自己提出來請問六年中沒有人問可見無相心三昧起初是很少有人論到的雜阿含經中說到無相心三昧佛為衆比丘尼說比丘尼們又問阿難阿難為比丘尼們說這一說明主要為了大師及弟子同句同味同義只是為了以如來曾經說過來肯定無相心三昧在佛法中的地位巴利藏增支部九集三七經也說到是智果智功德實為雜阿含經五五七五五九二經的結合總之無相心三昧是經佛弟子的修得而傳出日漸光大起來的無相心三昧依質多羅長者所說是一切相不念作意而修成的三昧作意或譯思惟念憶念不作意一切相的無相心三昧是有淺深的究竟的無相如雜阿含經祇夜卷四五大正二三三一中說修習於無相滅除憍慢使得慢無間等究竟於苦邊偈頌是阿難為婆耆舍說的相應部同瑜伽論解說為由此斷故說名無學智果智功德的無相心三昧毗婆沙論以為是空三摩地的別名瑜伽師地論對無相心三摩地的解說如卷一二大正三三三七中說云何無相心三摩地謂即於彼諸取蘊滅思惟寂靜心住一緣如經言無相心三摩地不低不昂又二因緣入無相定一不思惟一切相故二正思惟無相界故由不思惟一切相故於彼諸相不厭不壞唯不加行作意思惟故名不低於無相界正思惟故於彼無相不堅執著故名不昂不低不昂的無相心三昧正是經中所說不勇不沒的智果智功德的三昧瑜伽論所說與毗婆沙論說是空三摩地異名所見不同依經文所說無相心三昧或在無量心解脫以下說那是出離一切相心不為隨相識所纏縛的或依四禪說無相心三昧如不再進求與衆人往來雜處戲笑調弄那是會退落可能還俗的所以三昧通於有漏智果智功德的無相心三昧也就是無相心解脫唯是無漏的初果到四果定有有想與無想的二類如雜阿含經卷二一大正二一四六下說尊者阿難語迦摩比丘言若比丘離欲惡不善法有覺有觀離生喜樂初禪具足住如是無所有入處具足住如是有想比丘有法而不覺知比丘一切想不憶念無想心三昧身作證具足住是名比丘無想於有法而不覺知無所有處以下是初禪到無所有處定是有想而不覺知無想心定是無想而不覺知增支部與此相當的也說無所有處以下是有想而不覺知接著說不踊不沒即不低不昂的三昧這可見無所有處以上就是無想的無相心三昧增支部的靜慮經先總標說依止初靜慮得諸漏盡依止非想非非想處得諸漏盡然後分別的廣說但在分別廣說中從初靜慮說到無所有處定如是有想等至這是說無所有處定以下是有想定與雜阿含經所說相同以下經文沒有說依止非想非非想處得漏盡只說非想非非想處與想受滅等至善巧非想非非想處與想受滅定不正是無想定而與無相心三昧相當嗎無相心三昧而被解說為非想非非想處的如阿毗達磨大毗婆沙論卷一五大正二七五四二上說於非想非非想處說無相聲者如說我多起加行多用功力得無相心定不應於中欣樂染著此說不起有頂味定唯起淨定問何故非想非非想處名無相耶答彼無明了想相亦無無想相但有昧鈍不明了想微細現行如疑而轉故名無相經說無相定而被解說為非想非非想處定的是中阿含經的淨不動道經經上說欲想色想不動想無所有處想彼一切想是無常法是苦是滅彼於爾時而得無想彼如是行如是學如是修習而廣布便於此得心淨或於此得入無想或以慧為解得此無想定的如有所受取樂著住那就受非有想無想處的果報無相心定而有所樂著所以是無想而又有不明了的細想現行因而名為非想非非想處定如心無取著那就是無相心解脫了想受滅定或名滅盡定或名增上想滅智定與無相心三昧相當的如相應部目犍連相應從初禪說到四禪從空無邊處到非想非非想處在八定以上說無相心定而舍利弗相應也從初禪說到非想非非想處定然後說想受滅定可見無相心三昧與想受滅定的地位相當還有佛入涅槃那一年在毗舍離患病是入無相三昧而康復的如長阿含經二遊行經大正一一五中說吾已老矣年且八十自力精進忍此病苦痛不念一切想入無想定時我身安隱無有惱患雜事也這樣說以無相三昧觀察其身痛惱令息長部大般涅槃經卻說阿難如來一切相不憶念入一切受滅相心三昧住時如來身體康復長部說一切相不憶念又說入一切受滅相心三昧顯然是無相心三昧而又有想受滅的意義想受滅定是從無相心定中分化出來的當然久已為佛教界所公認然於非想非非想處以上立滅盡定的如中部二五撒餌經二六聖求經三心材喻小經三一牛角喻小經六六鶉喻經一一三善士經而在中阿含經中僅與撒餌經相當的一七八獵師經在非想非非想處以上立想知滅其餘都沒有可見部派間所誦的經教想受滅定還在不確定狀態中滅盡定與無想無相心定中阿含經辨別二定的入定與出定的差別而中部卻沒有想受滅定在佛教界是多有諍論的如烏陀夷反對舍利弗所說的若於現法不得究竟智身壞命終過摶食天生餘意生天中於彼出入想知滅定必有此處在部派中或說想受滅定是有為的或說是無為的或說是非有為非無為的或說想受滅者是無想有情或說非無想有情或說世間想受滅是無想有情出世想受滅是聖者大乘經以為菩薩如悲願不足而入滅定是會證小果的如悲願具足那就是證入如如法性的深定了這樣的異說紛紜足以說明與無相心定有關的滅盡定在佛教界是非常暗昧的依無相心三昧演化出非想非非想處定及報處滅盡定以外還有無想有情無想定無相心三昧不作意一切相也就是不起一切想長部大緣經立七識住與二處二處是無想有情處與非想非非想處無想定與滅盡定相似所以從起定時的差異而加以分別七識住與二處綜合起來名為九有情居依長部波梨經說傳說中的世界起源說其中無因論者是從無想有情死沒而來生的所以說無因而有無想定與無想有情可能外道有類似無想的修驗與傳說佛法為了要給以應有的解說才從無相定滅盡定中分出位居四禪廣果天上這是成立要遲一些雜阿含經修多羅卷一大正二七二上中說比丘貪想恚想害想貪覺恚覺害覺及無量種種不善云何究竟滅盡於四念處繫心住無相三昧修習多修習惡不善法從是而滅無餘永盡多聞聖弟子作是思惟世間頗有一法可取而無罪過者思惟已都不見一法可取而無罪過者作是知已於諸世間則無所取無所取者自覺涅槃相應部蘊相應所說的大致相同依經說依三種想而有三種不善覺覺新譯尋思引起種種的不善法多修習無相三昧能永滅無餘無相三昧是依四念處而修的四念處是觀身不淨觀受是苦觀心無常觀法無我是解脫的一乘道依此而修無相三昧不取一切相不取法有也不取法無真能修到無所取著就能自證涅槃了經中常說依四念處修七覺支而得解脫每一覺支的修習都是依遠離依離欲依滅向於捨捨即不著一切的不取著一切相的無相三昧可說就是依滅向於捨的修習不取著一切法的三昧與佛化詵陀迦旃延的未調馬強梁禪應有一定程度的關係如雜阿含經如來記說卷三三大正二二三六上中說如是詵陀比丘如是不念五蓋住於出離如實知禪者不依地修禪不依水火風空識無所有非想非非想而修禪不依此世不依他世非日非月非見聞覺識非得非求非隨覺非隨觀而修禪詵陀比丘如是修禪者諸天主伊溼波羅波闍波提恭敬合掌稽首作禮而說偈言南無大士夫南無士之上以我不能知依何而禪定佛告跋迦利比丘於地想能伏地想於水火風若覺若觀悉伏彼想跋迦利比丘如是禪者不依地水火風乃至不依覺觀而修禪於地等能伏地等想不依地等一切而修的是無相禪別譯雜阿含經引申為皆悉虛僞無有實法但以假號因緣和合有種種名觀斯空寂不見有法及以非法不見有法及以非法與佛教迦旃延經的不起有見無見相合也與離有見無見不見一法可取而無罪過說相合無所依而修禪見於增支部十一集已衍化為類似的十經各部派所誦的經文有不少出入大抵合於自宗的教義然從雜阿含經與增支部相同的來說這是不依一切想而修的無相禪阿毗達磨大毗婆沙論卷四大正二七二九中說大目乾連底沙梵天不說第六無相住者耶若有苾芻於一切相不復思惟證無相心三摩地具足住是名第六無相住者論中廣引經文應是有部的增一阿含經底沙梵天對大目乾連說部分的梵衆天能夠知道誰是俱解脫誰是信勝解目乾連告訴了如來如來以為一切聖者總有七人底沙梵天從俱解脫說到了信勝解只說了五人沒有說第六無相住者無相住者是證得無相心三摩地具足住的這是梵天所不能知道的這與諸天主不知真實禪是依何而禪定一樣佛所說的第六無相住者大毗婆沙論解說為一切聖者總有七人底沙已說了五人所以無相住者就是隨法行與隨信行人隨法行與隨信行是見道位見道位有十五心是速疾道是微細道不可安立施設所以隨法行與隨信行綜合名為無相住者毗婆沙論所引經文見於增支部但略有不同底沙梵天說了六人俱解脫隨法行沒有說第七無相住補特伽羅那麼第七無相住人是專指隨信行人了為什麼隨信行人特別名為無相住人呢關於經說的第六無相住人大毗婆沙論說到有於彼經不了其義便執緣滅諦入正性離生見道名為無相住故唯滅諦中無諸相故這是法藏部的見解如阿毗達磨大毗婆沙論卷一八五大正二七九二七下說有說唯無相三摩地能入正性離生如達摩毱多部說彼說以無相三摩地於涅槃起寂靜作意入正性離生入正性離生就是見道依經典明文隨信行人等所以被名為無相住者是由於於一切相不復思惟於無相心三摩地具足住而不是大毗婆沙論所說那樣的見四諦得道見滅諦得道是部派佛教的二大系依第六名無相住者來說在聖道的修行中知苦斷集而證滅諦名為聖者也許見滅得道說更合於經義呢無相心三昧是有淺深的淺的還可能會退墮深的是見滅得道成為聖者最究竟的當然是一切煩惱空阿羅漢的不動心解脫了七空與空性中阿含經的小空經與大空經與中部的空小經空大經相當是以空為主題而集出的經典這兩部空經都淵源於雜阿含經中的空住經不同的傳宏而分別集出來的都是依空觀的進修而達究竟解脫的在修行的方便上兩部經是不同的但都深深影響了發展中的佛教先說小空經以佛曾經為阿難說我多行空住為緣起以三世如來都行此真實空不顛倒謂漏盡無漏無為心解脫作結這是一切佛所多住的所以成佛之道的大乘法特別舉揚空性的修證是可以從此而得到線索的依小空經說空不是什麼都沒有而是空其所空有其所有的如說鹿子母堂空這是說鹿子母堂中空無牛羊人物而鹿子母堂是有不空的依於這一解說後來瑜伽大乘說謂由於此彼無所有即由彼故正觀為空復由於此餘實是有即由餘故如實知有如是名為悟入空性如實無倒所以若觀諸法所有自性畢竟皆空是名於空顛倒趣入成為大乘有宗的根本義小空經所說的空性是依名釋義的提出不空作空與不空的對立說明實是一項新的解說小空經所說的空住是適應於住阿蘭若者而展開的修法所以從阿蘭若無事處說起修行者專心憶念即作意無事想不起村落想人想因村落想及人想而引起的疲勞是沒有了這樣村落想空人想空而無事想不空是謂行真實空性不顛倒進一步不憶念人想與無事想專一憶念地想觀地平如掌人想空無事想空因人想無事想而引起的疲勞沒有了而地想不空是謂行真實空性不顛倒這樣的次第進修專念空無邊處想而地等想空專念識無邊處想而空無邊處等想空專念無所有處想不念識無邊處等想識無邊處等想空而無所有處想不空是謂行真實空性不顛倒以上依世間道修空這樣的行真實空性是有漏的有淺深層次的以下依聖道修空小空經這樣大正一七三七下說若欲多行空者彼比丘莫念無量識處想莫念無所有處想當數念一無想心定彼如是知空無量識處想空無所有處想然有不空唯一無想心定彼作是念我本無想心定本所行本所思若本所行本所思者我不樂彼不求彼不應住彼如是知如是見欲漏心解脫有漏心解脫無明漏心解脫彼如是知空欲漏空有漏空無明漏然有不空唯此我身六處命存若彼中無者以此故彼見是空若彼有餘者彼見真實有阿難是謂行真實空性不顛倒也謂漏盡無漏無為心解脫無想心定依空小經知道是無相心三昧的異譯經說然有不空唯一無想心定與上