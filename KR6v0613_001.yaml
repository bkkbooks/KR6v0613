諦理涅槃寂靜是理想的證得這樣的三法印表徵著全部佛法的特色空等三三昧與無常等三法印的關係如下空空諸法無我無所有無願諸行無常無相無相涅槃寂靜從空無所有無相著重於正觀的三三昧演化為空無願無相的三三昧只是著重於出世道的出發於厭離終於不願後有生死的相續而解脫在聖道中依無常苦而引發的厭離無願是有重要意義的施護異譯的佛說法印經對離慢知見清淨部分解說為識蘊既空無所造作是名無作無願的異譯解脫門如是名為聖法印即是三解脫門三法印與三解脫門合一雖是晚期所譯文義有了變化但重視無常無願不失原始佛教的本意十勝解觀與真實觀四禪八定九次第定等一切定法原本只是四禪其餘是由觀想而成立的四禪在佛法中的重要性上文已引經說明從經文所說的四禪異名也可以了解四禪的特勝如瑜伽師地論卷一一大正三三三一上說是諸靜慮名差別者或名增上心謂由心清淨增上力正審慮故或名樂住謂於此中受極樂故所以者何依諸靜慮領受喜樂安樂捨樂身心樂故又得定者於諸靜慮數數入出領受現法安樂住故或復名為彼分涅槃亦得說名差別涅槃由諸煩惱一分斷故非決定故名彼分涅槃非究竟涅槃故名差別涅槃比丘們依四禪得漏盡解脫是經中所常見的如經說五安穩住也就是四禪及漏盡上面說到善星經與不動利益經漢譯名淨不動道經都以不動無所有無相為次第第四禪名不動在不動與無所有中間為什麼沒有空無邊處識無邊處呢原來不動無所有無相是如實觀的三昧而空無邊處與識無邊處是世俗假想觀的三昧這二類觀想的分別如大毗婆沙論說有三種作意謂自相作意共相作意勝解作意勝解作意者如不淨觀持息念四無量八解脫八勝處十遍處等瑜伽師地論說勝解作意者謂修靜慮者隨其所欲於諸事相增益作意真實作意者謂以自相共相及真如相如理思惟諸法作意依此可以知道自相作意共相作意真如作意是一切法真實事理的作意勝解作意是假想觀於事是有所增益的如不淨觀想青瘀或膿爛等觀自身及到處的尸身青瘀或膿爛這是與事實不符的是誇張的想像所成的定境所以說是增益佛法中的八解脫八勝處十遍處都是勝解作意彼此的相互關係對列如下八勝處十遍處八解脫內有色想觀外色少內有色想觀外色內有色想觀外色多內無色想觀外色少內無色想觀外色內無色想觀外色多地遍處水遍處火遍處風遍處內無色想觀外色青青遍處內無色想觀外色黃黃遍處淨解脫身作證內無色想觀外色赤赤遍處內無色想觀外色白白遍處空遍處空無邊處識遍處識無邊處無所有處非想非非想處想受滅身作證解脫遍處不淨念在內勝處這三類定法相通而又有所不同都出發於色的觀想在不同的宏傳中發展成三類不同的定法古人將這三類總集起來解說為淺深的次第勝處的前四勝處與解脫的前二解脫相當是不淨觀勝處的後四勝處與第三解脫的淨解脫身作證相當是淨觀遍處的前八遍處也是淨觀青黃赤白是所造色所造色依於能造的四大地水火風所以有前四遍處前三解脫前八遍處八勝處都是依色界禪定緣欲界色為境的都是勝解的假想觀十遍處中在地水火風及依四大而有的青黃赤白遍處以上有虛空遍處識遍處這不是地水火風虛空識六界嗎六界是說明衆生自體所有的特質構成衆生自體的因素四大是色法血肉等身體虛空是鼻孔咽喉毛孔等空隙可見可觸是有局限性的識是自身的心理作用衆生自體只是這六界的綜合如沒有識界那就是外在的器世界了古代的修行者觀色法的不淨對治貪欲進而觀色法的清淨就是前三解脫前八遍處八勝處或超越色相觀虛空相勝解為遍一切處如不能依之發慧得解脫生在虛空無邊處或進一步的觀識相假想為遍一切處後代所說的心包太虛心遍十方都由此定境而來不能解脫的生在識無邊處無色界的前二天及定依此修得的定境而來四禪名為不動中阿含經的大空經中內空外空內外空與不動並列內空外空內外空是從根境識的相關中空於五欲不動是觀五陰無常無我內離我慢不動修習成就就是空住的成就如著空而不得解脫就稱四禪為不動善星經不動利益經等說不動無所有無相為次第是諦理的如實觀如有著而不得解脫的生在四禪無所有處無想處非想非非想處更進而立滅受想定在四禪與無所有處間本沒有空無邊處識無邊處的由於十遍處的修得依六界的次第進修而在四禪與無所有處間結合空無邊處識無邊處而成四禪四無色定八等至更加滅受想定成九次第等至定總列如下種種想四禪十遍處八勝處八解脫九次第定欲初禪內有色想觀外色少內有色想觀外色解脫初禪內有色想觀外色多二禪內無色想觀外色少內無色想觀外色解脫二禪色內無色想觀外色多三禪三禪地水火風遍處不動四禪青黃赤白遍處內無色想觀青黃等四淨解脫四禪空遍處空無邊處解脫空無邊處定識遍處識無邊處解脫識無邊處定無所有無所有處解脫無所有處定無相非想非非想處解脫非想非非想處定滅受想解脫滅受想定佛法的解脫道是依止四禪發真實慧離欲而得解脫的真實慧依於如實觀無常故苦無常苦故無我無我無我所空是一貫的不二的正觀能離一切煩惱離一切相契入超越的寂滅依於觀慧的加行不同名為空名為無所有名為無相如止觀相應而實慧成就依觀慧立名名為空性心三昧無所有心三昧無相心三昧心三昧或名心解脫雖因加行不同而立此三名而空於一切煩惱是一致的其實加行也有共通處如空大經說不作意一切相內空成就住不動利益經說空於我及我所是第二無所有處道空與無相無所有與空不是明顯的相通嗎所以能得解脫的真實慧雖有不同名稱到底都不過是空慧的異名勝解的假想觀是不能得究竟解脫的但也有對治煩惱斷除部分煩惱增強心力的作用所以釋尊應用某些方便來教導弟子假想觀中主要是不淨觀如青瘀想膿爛想骨想等障礙出家弟子的猛利煩惱是淫欲愛為了對治貪淫佛開示不淨觀法門不淨與無常苦無我相聯合成為四念處四念處中觀身不淨是應該先修習的假想不淨觀引起了副作用由於厭患情緒的深切有些比丘自殺或自願為人所殺這是經律一致記載的改善不淨觀的修習一方面佛又開示入出息念法門一方面由不淨觀而轉出淨觀如八解脫的第三解脫八勝處的後四勝處十遍處的前八遍處都是淨觀不淨觀與淨觀都是緣色法的假想的勝解所成與不淨觀淨觀有關的可以提到幾則經文一雜阿含經卷一七大正二一一六下說世尊告諸比丘有光界淨界無量空入處界無量識入處界無所有入處界非想非非想入處界有滅界彼光界者緣暗故可知淨界緣不淨故可知經中立七種界在虛空無邊處以前有光界淨界光界與淨界與第二禪名光天第三禪名淨天的次第相合禪天的名稱是與此有關的依修觀成就來說光是觀心中的光明相現前如勝解而能見白骨流光就能由不淨而轉淨觀觀地水火風青黃赤白等光與淨都依勝解觀而成就淨觀的內容如地等清淨是清淨的國土相青等清淨通於器界或衆生的淨色相勝解淨相在定中現見清淨身土漸漸引發了理想中的清淨土清淨身說二中阿含經七三天經大正一五四中下說我為智見極明淨故便在遠離獨住心無放逸修行精勤即得光明便見形色及與彼天共同集會共相慰勞有所論說有所答對亦知彼天如是姓如是字如是生亦知彼天如是食如是受苦樂亦知彼天如是長壽如是久住如是命盡亦知彼天作如是如是業已死此生彼亦知彼天屬彼彼天中亦知彼天上我曾生其中未曾生其中也此經巴利藏編入增支部八集成立可能遲一些下接勝處與解脫得殊勝知見是修定四大目的之一本經的精勤修行共分八個層次先勝解光明相如光相成就能於光明中現見色相色相是清淨的天色相光明相現前現見清淨天色相與解脫勝處的淨觀成就相當進一步與諸天集會互相問答這樣的定境使我們想起了般舟三昧經的阿彌陀佛現前佛與修行者問答不但見色相還聽見聲音無著修彌勒法上升兜率天見彌勒菩薩受瑜伽師地論密宗的修習成就本尊現前也能有所開示原則是一樣的只是修行者信仰對象不同而已依般舟三昧經說所見的不是真實佛是自己的定心所現攝大乘論本說諸瑜伽師於一物種種勝解各不同種種所見皆得成故知所取唯有識勝解的假想觀多釆多姿在佛教的演進中急劇的神教化也助成了唯心思想的高揚三中阿含經的有勝天經中部作阿那律經有勝天經說有三種天光天淨光天遍淨光天這三天因人心勝如如是不如勝如即優劣故修便有精粗因修有精粗故得至天人則有勝如不但有差別每一天的天人也有勝妙與不如的所以有差別是由於因中的修行有精粗不同以光天來說因中意解作光明想成就遊成就遊異譯作具足住心作光明想極盛然由於勝解的光明想有大有小所以光天集在一處雖身有異而光不異如各各散去時其身既異光明亦異淨光天的差別是因中意解淨光天遍滿成就遊如不再修習生在淨光天中就不得極寂靜亦不得盡壽訖如數修數習生天時就能得極寂靜亦得盡壽遍淨光天生在一處也是有差別的那是雖同樣的意解遍淨光天遍滿成就遊如不極止睡眠不善息調調是掉舉的舊譯悔那就彼生天已光不極淨如極止睡眠善息調悔彼生天已光極明淨有勝天經的三天阿那律經作四天少光天無量光天雜染光天清淨光天少光天與無量光天與有勝天經光天的二類相當雜染光天與清淨光天與有勝天經中清淨光天的光不極淨光極明淨二類相當三天或四天不外乎光與淨與七界的光界淨界相當其實清淨色相是不能離光明的成就四禪而不得解脫的感得四禪天的果報四禪諸天的名字也是漸次成立的經中常見的天魔梵魔以下有種種天如超出魔界就名為梵天這是適合於印度教的佛教中欲界以魔天他化自在天為最高如出魔界也就是離欲界的禪天所以初禪天就名為梵天佛弟子修勝解觀依光明相而現起所以緣色法而修勝解的不外乎光明相與清淨色相修此而感報的也就是光天與淨天作為二禪天三禪天的名字由於光明相等有優劣所以又分每一禪天為三天或二天但在初期聖典中四禪天的名字是梵天或梵衆天光音天遍淨天廣果天第四禪只是廣果天這一名稱可能初期以此為最高處定或依慧得解脫第四禪是廣大果吧佛教假想觀及如實觀的發達對於上二界諸天的安立是有直接關係的
